name: Build Images

# Four ways in:
#   * a stable `v*` tag — build service images, publish `latest`, and create a release.
#   * a prerelease `v*-<label>` tag — build service images and create a
#     prerelease without changing the stable `latest` channel.
#   * an `infra-v*` tag — build graph PostgreSQL and Keycloak images, publish
#     `infra-latest`, and create a separate infrastructure release.
#   * a branch push — publish a complete immutable `sha-<full-commit>` snapshot.
#     Main also advances `edge`; a feature branch never moves `edge` or `latest`
#     and its snapshot may be deployed only to dev (enforced by deploy.yml).
#   * manual — rebuild an immutable snapshot for the selected ref.
on:
  push:
    tags: ["v*", "infra-v*"]
    branches: ["**"]
  workflow_dispatch:
    inputs:
      publish_latest:
        description: "Also move the `latest` tag to this build"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Serialize releases for one ref. Main snapshots may supersede an older
  # build; version tags are never cancelled.
  group: build-images-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  require-ci:
    runs-on: ubuntu-24.04
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      prototype: ${{ steps.changes.outputs.prototype }}
      theia: ${{ steps.changes.outputs.theia }}
      any_service: ${{ steps.changes.outputs.any_service }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Classify the build
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" != "tag" ]; then
            scope=services
          elif [[ "${{ github.ref_name }}" =~ ^infra-v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            scope=infra
          elif [[ "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?(\+[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            scope=services
          else
            echo "Unsupported release tag: ${{ github.ref_name }}" >&2
            exit 1
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"

      - name: Require successful tests for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1200))

          while (( SECONDS < deadline )); do
            runs="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow Test \
              --commit "$GITHUB_SHA" \
              --limit 10 \
              --json status,conclusion,url)"

            if jq -e 'any(.[]; .status == "completed" and .conclusion == "success")' \
              <<<"$runs" >/dev/null; then
              echo "Successful Test workflow found for $GITHUB_SHA"
              exit 0
            fi

            if jq -e 'any(.[]; .status != "completed")' <<<"$runs" >/dev/null; then
              echo "Tests for $GITHUB_SHA are still running; waiting..."
              sleep 15
              continue
            fi

            if jq -e 'length > 0' <<<"$runs" >/dev/null; then
              echo "Tests completed without success for $GITHUB_SHA" >&2
              jq -r '.[] | "\(.status) \(.conclusion // "-") \(.url)"' <<<"$runs" >&2
              exit 1
            fi

            echo "Test run for $GITHUB_SHA is not visible yet; waiting..."
            sleep 10
          done

          echo "Timed out waiting for successful tests for $GITHUB_SHA" >&2
          exit 1

      - uses: actions/checkout@v6
        if: steps.classify.outputs.scope == 'services'
        with:
          # A push can contain several commits; the component diff must reach
          # github.event.before rather than only HEAD^.
          fetch-depth: 0

      - name: Select service components
        id: changes
        if: steps.classify.outputs.scope == 'services'
        shell: bash
        run: |
          set -euo pipefail

          full=false
          changed_file="$RUNNER_TEMP/service-image-paths"
          : > "$changed_file"

          # Tags and manual runs are explicit publication points: always
          # produce a complete, independently reproducible image set.
          if [ "${{ github.ref_type }}" = "tag" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            full=true
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [[ "$before" =~ ^0+$ ]] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
              full=true
            else
              git diff --name-only "$before" "$GITHUB_SHA" > "$changed_file"
              # A change to the image pipeline itself gets one full proving
              # build, so condition/output mistakes cannot silently skip it.
              if grep -Eq '^\.github/workflows/release\.yml$' "$changed_file"; then
                full=true
              fi
            fi
          fi

          selected() {
            local pattern="$1"
            if [ "$full" = true ] || grep -Eq "$pattern" "$changed_file"; then
              printf 'true'
            else
              printf 'false'
            fi
          }

          backend="$(selected '^(studio-backend/|rust-toolchain\.toml$)')"
          frontend="$(selected '^studio-frontend/')"
          prototype="$(selected '^studio-frontend-prototype/')"
          theia="$(selected '^theia/')"
          if [ "$backend" = true ] || [ "$frontend" = true ] || [ "$prototype" = true ] || [ "$theia" = true ]; then
            any_service=true
          else
            any_service=false
          fi

          {
            echo "backend=$backend"
            echo "frontend=$frontend"
            echo "prototype=$prototype"
            echo "theia=$theia"
            echo "any_service=$any_service"
          } >> "$GITHUB_OUTPUT"

          echo "Selected: backend=$backend frontend=$frontend prototype=$prototype theia=$theia"

  backend-binary:
    needs: require-ci
    if: needs.require-ci.outputs.scope == 'services' && needs.require-ci.outputs.backend == 'true'
    # Pinned, not `-latest`: the binary links the builder's glibc, and the
    # runtime image (Dockerfile, debian:trixie-slim, glibc 2.41) must be at
    # least as new. `ubuntu-latest` moving to a newer glibc than trixie would
    # resurrect "version GLIBC_X.YY not found" at container start — bump the
    # runner and the runtime base TOGETHER.
    runs-on: ubuntu-24.04
    steps:
      # Cargo.lock pins the exact gears-rust revision, so rebuilding the same
      # commit resolves the same Rust sources.
      - uses: actions/checkout@v6

      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev cmake pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: studio-backend

      - name: Build (release)
        working-directory: studio-backend
        # Keep LLM disabled, but compile graph-storage for the Kubernetes
        # profile. Its database runtime is versioned independently by
        # infra-v* releases and Deploy Infra.
        run: cargo build --locked --release --no-default-features --features graph,theia-bridge

      - uses: actions/upload-artifact@v6
        with:
          name: studio-backend-linux-x86_64
          path: studio-backend/target/release/studio-backend

  file-storage-sidecar-binary:
    needs: require-ci
    if: needs.require-ci.outputs.scope == 'services' && needs.require-ci.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      # Cargo.lock is the single source of truth for the gears-rust revision.
      # Building the sidecar from that same commit prevents control/data-plane
      # protocol drift without duplicating a revision in this workflow.
      - name: Resolve pinned gears-rust revision
        id: gears
        shell: bash
        run: |
          set -euo pipefail
          source_line=$(sed -n '/name = "cf-gears-file-storage"/,/^\[\[package\]\]/p' \
            studio-backend/Cargo.lock | grep '^source = ' | head -n 1)
          revision="${source_line##*#}"
          revision="${revision%\"}"
          test "${#revision}" -eq 40
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          repository: constructorfabric/gears-rust
          ref: ${{ steps.gears.outputs.revision }}
          path: gears-rust

      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev cmake pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gears-rust

      - name: Build file-storage sidecar
        working-directory: gears-rust
        run: cargo build --locked --release -p cf-gears-file-storage --bin sidecar

      - uses: actions/upload-artifact@v6
        with:
          name: file-storage-sidecar-linux-x86_64
          path: gears-rust/target/release/sidecar

  # Builds the FrontX-based studio-frontend/ — the deployed portal since it
  # replaced studio-frontend-prototype/ (now a playground with its own image).
  frontend-dist:
    needs: require-ci
    if: needs.require-ci.outputs.scope == 'services' && needs.require-ci.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio-frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: studio-frontend/package-lock.json
      - run: npm ci
      # Build before test: the suites resolve workspace packages through
      # their dist/ entries, which only the build produces (same as ci.yml).
      - run: npm run build
      - run: npm test
      - uses: actions/upload-artifact@v6
        with:
          name: studio-frontend-dist
          path: studio-frontend/dist

  # The pre-FrontX prototype ships as its OWN image and rides along in
  # compose on :8081. It is tested and built only here, at release time —
  # ci.yml deliberately does not gate on it.
  prototype-dist:
    needs: require-ci
    if: needs.require-ci.outputs.scope == 'services' && needs.require-ci.outputs.prototype == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio-frontend-prototype
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio-frontend-prototype/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v6
        with:
          name: studio-frontend-prototype-dist
          path: studio-frontend-prototype/dist

  service-images:
    needs: [require-ci, backend-binary, file-storage-sidecar-binary, frontend-dist, prototype-dist]
    if: >-
      always() &&
      needs.require-ci.result == 'success' &&
      needs.require-ci.outputs.scope == 'services' &&
      needs.require-ci.outputs.any_service == 'true' &&
      (needs.backend-binary.result == 'success' || needs.backend-binary.result == 'skipped') &&
      (needs.file-storage-sidecar-binary.result == 'success' || needs.file-storage-sidecar-binary.result == 'skipped') &&
      (needs.frontend-dist.result == 'success' || needs.frontend-dist.result == 'skipped') &&
      (needs.prototype-dist.result == 'success' || needs.prototype-dist.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        if: needs.require-ci.outputs.backend == 'true'
        with:
          name: studio-backend-linux-x86_64
          path: studio-backend/.release/
      - uses: actions/download-artifact@v7
        if: needs.require-ci.outputs.backend == 'true'
        with:
          name: file-storage-sidecar-linux-x86_64
          path: studio-backend/.release/file-storage-sidecar-download/
      - uses: actions/download-artifact@v7
        if: needs.require-ci.outputs.frontend == 'true'
        with:
          name: studio-frontend-dist
          path: studio-frontend/dist
      - uses: actions/download-artifact@v7
        if: needs.require-ci.outputs.prototype == 'true'
        with:
          name: studio-frontend-prototype-dist
          path: studio-frontend-prototype/dist

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr rejects any reference with an uppercase letter, and
      # `github.repository` carries the owner's name exactly as registered —
      # `AndrejK666/studio-web` here. GitHub expressions have no lowercase
      # function, so it is done in the shell, and it has to overwrite the
      # workflow-level IMAGE_PREFIX rather than define a second variable: the
      # build steps below already read $IMAGE_PREFIX, and two names for one
      # thing is how the wrong one gets used later.
      - name: Lowercase the image prefix
        run: |
          set -euo pipefail
          lower=$(printf '%s' "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_PREFIX=ghcr.io/$lower" >> "$GITHUB_ENV"

      # Every build first publishes the full immutable commit SHA. Mutable or
      # human-readable tags are promoted only after ALL images have built and
      # the graph PostgreSQL compatibility check has passed.
      - name: Work out the image tags
        id: tags
        run: |
          set -euo pipefail
          immutable="sha-$GITHUB_SHA"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            # A prerelease is deployable by its immutable human-readable tag,
            # but it must never replace the stable production/default channel.
            if [[ "${{ github.ref_name }}" == *-* ]]; then
              promotions="${{ github.ref_name }}"
            else
              promotions="${{ github.ref_name }} latest"
            fi
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            if [ "${{ inputs.publish_latest }}" = "true" ]; then
              promotions="edge latest"
            else
              promotions="edge"
            fi
          else
            if [ "${{ inputs.publish_latest }}" = "true" ]; then
              echo "A feature branch cannot move latest" >&2
              exit 1
            fi
            promotions=""
          fi
          echo "immutable=$immutable" >> "$GITHUB_OUTPUT"
          echo "promotions=$promotions" >> "$GITHUB_OUTPUT"

      - name: Build backend image
        if: needs.require-ci.outputs.backend == 'true'
        run: |
          set -euo pipefail
          tag="${{ steps.tags.outputs.immutable }}"
          docker build -f studio-backend/Dockerfile -t "$IMAGE_PREFIX/studio-backend:$tag" studio-backend

      - name: Push immutable backend image
        if: needs.require-ci.outputs.backend == 'true'
        run: |
          set -euo pipefail
          tag="${{ steps.tags.outputs.immutable }}"
          docker push "$IMAGE_PREFIX/studio-backend:$tag"

      - name: Build and push file-storage sidecar image
        if: needs.require-ci.outputs.backend == 'true'
        run: |
          set -euo pipefail
          tag="${{ steps.tags.outputs.immutable }}"
          mv studio-backend/.release/file-storage-sidecar-download/sidecar \
            studio-backend/.release/file-storage-sidecar
          docker build -f studio-backend/Dockerfile.file-storage-sidecar \
            -t "$IMAGE_PREFIX/file-storage-sidecar:$tag" studio-backend
          docker push "$IMAGE_PREFIX/file-storage-sidecar:$tag"

      - name: Build & push frontend image
        if: needs.require-ci.outputs.frontend == 'true'
        run: |
          set -euo pipefail
          tag="${{ steps.tags.outputs.immutable }}"
          docker build -f studio-frontend/Dockerfile -t "$IMAGE_PREFIX/studio-frontend:$tag" studio-frontend
          docker push "$IMAGE_PREFIX/studio-frontend:$tag"

      # Same nginx runtime recipe as the main frontend, its own dist and name.
      - name: Build & push frontend prototype image
        if: needs.require-ci.outputs.prototype == 'true'
        run: |
          set -euo pipefail
          tag="${{ steps.tags.outputs.immutable }}"
          docker build -f studio-frontend-prototype/Dockerfile -t "$IMAGE_PREFIX/studio-frontend-prototype:$tag" studio-frontend-prototype
          docker push "$IMAGE_PREFIX/studio-frontend-prototype:$tag"

      # The per-workspace Theia IDE session image (moved in from fabric-poc).
      # Self-contained multi-stage build from theia/ — no artifact to download,
      # it downloads Theia plugins at build time (needs network, ~10 min).
      # studio-session pulls this by the `image:` in config/*.yaml.
      - name: Build & push Theia session image
        if: needs.require-ci.outputs.theia == 'true'
        env:
          # Resolving the Constructor Studio skill engine goes through
          # api.github.com, whose anonymous limit is 60/hour per IP and is
          # routinely exhausted on shared runners (403). Passed as a BuildKit
          # secret, never a build ARG, so it stays out of image history.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.tags.outputs.immutable }}"
          DOCKER_BUILDKIT=1 docker build -f theia/Dockerfile \
            --secret id=github_token,env=GITHUB_TOKEN \
            -t "$IMAGE_PREFIX/cf-studio-theia:$tag" theia
          docker push "$IMAGE_PREFIX/cf-studio-theia:$tag"

      # Preserve a complete immutable snapshot without rebuilding unchanged
      # components. `edge` is moved only after a successful complete set, so it
      # is the last known-good source for a remote registry-side copy.
      - name: Copy unchanged images into the immutable snapshot
        if: github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
        env:
          BUILD_BACKEND: ${{ needs.require-ci.outputs.backend }}
          BUILD_FRONTEND: ${{ needs.require-ci.outputs.frontend }}
          BUILD_PROTOTYPE: ${{ needs.require-ci.outputs.prototype }}
          BUILD_THEIA: ${{ needs.require-ci.outputs.theia }}
        run: |
          set -euo pipefail
          immutable="${{ steps.tags.outputs.immutable }}"

          copy_image() {
            local image="$1"
            docker buildx imagetools create \
              --tag "$IMAGE_PREFIX/$image:$immutable" \
              "$IMAGE_PREFIX/$image:edge"
          }

          if [ "$BUILD_BACKEND" != true ]; then
            copy_image studio-backend
            copy_image file-storage-sidecar
          fi
          if [ "$BUILD_FRONTEND" != true ]; then
            copy_image studio-frontend
          fi
          if [ "$BUILD_PROTOTYPE" != true ]; then
            copy_image studio-frontend-prototype
          fi
          if [ "$BUILD_THEIA" != true ]; then
            copy_image cf-studio-theia
          fi

      - name: Promote the complete service image set
        if: steps.tags.outputs.promotions != ''
        run: |
          set -euo pipefail
          immutable="${{ steps.tags.outputs.immutable }}"
          images=(
            studio-backend
            file-storage-sidecar
            studio-frontend
            studio-frontend-prototype
            cf-studio-theia
          )
          for promotion in ${{ steps.tags.outputs.promotions }}; do
            for image in "${images[@]}"; do
              docker buildx imagetools create \
                --tag "$IMAGE_PREFIX/$image:$promotion" \
                "$IMAGE_PREFIX/$image:$immutable"
            done
          done
      - name: Summary
        run: |
          {
            echo "### Images published"
            for t in ${{ steps.tags.outputs.immutable }} ${{ steps.tags.outputs.promotions }}; do
              echo "- \`$IMAGE_PREFIX/studio-backend:$t\`"
              echo "- \`$IMAGE_PREFIX/file-storage-sidecar:$t\`"
              echo "- \`$IMAGE_PREFIX/studio-frontend:$t\`"
              echo "- \`$IMAGE_PREFIX/studio-frontend-prototype:$t\`"
              echo "- \`$IMAGE_PREFIX/cf-studio-theia:$t\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  infra-images:
    needs: require-ci
    if: needs.require-ci.outputs.scope == 'infra'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase the image prefix
        run: |
          set -euo pipefail
          lower=$(printf '%s' "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_PREFIX=ghcr.io/$lower" >> "$GITHUB_ENV"

      - name: Work out the infrastructure image tags
        id: tags
        run: |
          set -euo pipefail
          echo "immutable=sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "promotions=${{ github.ref_name }} infra-latest" >> "$GITHUB_OUTPUT"

      - name: Build graph PostgreSQL CloudNativePG operand
        run: |
          set -euo pipefail
          tag="${{ steps.tags.outputs.immutable }}"
          docker build \
            -f studio-backend/docker/graph-postgres/Dockerfile \
            -t "$IMAGE_PREFIX/graph-postgres:$tag" \
            studio-backend/docker/graph-postgres

      - name: Verify graph PostgreSQL CloudNativePG compatibility
        run: >-
          bash studio-backend/docker/graph-postgres/verify-cnpg-compatibility.sh
          "$IMAGE_PREFIX/graph-postgres:${{ steps.tags.outputs.immutable }}"

      - name: Build Keycloak image
        run: |
          set -euo pipefail
          tag="${{ steps.tags.outputs.immutable }}"
          docker build \
            -f keycloak/Dockerfile \
            -t "$IMAGE_PREFIX/cf-studio-keycloak:$tag" \
            keycloak

      - name: Push immutable infrastructure images
        run: |
          set -euo pipefail
          tag="${{ steps.tags.outputs.immutable }}"
          docker push "$IMAGE_PREFIX/graph-postgres:$tag"
          docker push "$IMAGE_PREFIX/cf-studio-keycloak:$tag"

      - name: Promote the complete infrastructure image set
        run: |
          set -euo pipefail
          immutable="${{ steps.tags.outputs.immutable }}"
          images=(graph-postgres cf-studio-keycloak)
          for promotion in ${{ steps.tags.outputs.promotions }}; do
            for image in "${images[@]}"; do
              docker tag "$IMAGE_PREFIX/$image:$immutable" "$IMAGE_PREFIX/$image:$promotion"
              docker push "$IMAGE_PREFIX/$image:$promotion"
            done
          done

      - name: Summary
        run: |
          {
            echo "### Infrastructure images published"
            for t in ${{ steps.tags.outputs.immutable }} ${{ steps.tags.outputs.promotions }}; do
              echo "- \`$IMAGE_PREFIX/graph-postgres:$t\`"
              echo "- \`$IMAGE_PREFIX/cf-studio-keycloak:$t\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    needs: [require-ci, backend-binary, frontend-dist, service-images]
    # A main push publishes images, not releases.
    if: >-
      always() &&
      github.ref_type == 'tag' &&
      needs.require-ci.outputs.scope == 'services' &&
      needs.backend-binary.result == 'success' &&
      needs.frontend-dist.result == 'success' &&
      needs.service-images.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Pack artifacts
        run: |
          cd artifacts
          tar czf studio-backend-linux-x86_64.tar.gz -C studio-backend-linux-x86_64 .
          tar czf studio-frontend-dist.tar.gz -C studio-frontend-dist .
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/studio-backend-linux-x86_64.tar.gz
            artifacts/studio-frontend-dist.tar.gz

  infra-github-release:
    needs: [require-ci, infra-images]
    if: >-
      always() &&
      github.ref_type == 'tag' &&
      needs.require-ci.outputs.scope == 'infra' &&
      needs.infra-images.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
