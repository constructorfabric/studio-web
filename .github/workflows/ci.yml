name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      frontx: ${{ steps.filter.outputs.frontx }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'studio-backend/**'
              - '.github/workflows/**'
            frontend:
              - 'studio-frontend-prototype/**'
              - '.github/workflows/**'
            frontx:
              - 'studio-frontend/**'
              - '.github/workflows/**'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio-backend
    steps:
      # gears-rust is a git dependency pinned in Cargo.toml — no second
      # checkout, and no second place to keep the revision in sync.
      - uses: actions/checkout@v4

      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: studio-backend

      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --locked
      - name: "Smoke: assembly resolves 13 gears"
        run: |
          cargo run --locked -- --config config/dev.yaml --list-gears | tee gears.txt
          grep -q 'account-management' gears.txt

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio-frontend-prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio-frontend-prototype/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: studio-frontend-dist
          path: studio-frontend-prototype/dist
          retention-days: 7

  frontx:
    needs: changes
    if: needs.changes.outputs.frontx == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio-frontend
    steps:
      - uses: actions/checkout@v4
      # The FrontX-based app is assembled incrementally (ADR-0006); until its
      # package.json lands the job is a green no-op — setup-node would fail on
      # the missing lock file, and a red path-filtered job would block every PR
      # that touches studio-frontend/.
      - name: Detect app
        id: app
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "studio-frontend is being rebuilt on FrontX — nothing to build yet"
          fi
      - uses: actions/setup-node@v4
        if: steps.app.outputs.present == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: studio-frontend/package-lock.json
      - name: Install
        if: steps.app.outputs.present == 'true'
        run: npm ci
      - name: Test
        if: steps.app.outputs.present == 'true'
        run: npm test
      - name: Build
        if: steps.app.outputs.present == 'true'
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: steps.app.outputs.present == 'true'
        with:
          name: studio-frontx-dist
          path: studio-frontend/dist
          retention-days: 7
