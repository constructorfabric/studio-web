name: Gearbox engine extension

# The gearbox engine (gear catalogue, products, `.gdl`) as an extension a
# desktop fetches on first start (theia/gearbox-engine), instead of inside the
# installer. The engine is the constructorfabric/gearbox release the session
# image uses: theia/Dockerfile's `gearbox` stage is the one pin, and names the
# SHA-256 of each platform's archive (from that release's SHA256SUMS), so this
# only downloads, checks and packs; nothing is compiled.
#
# Each version -- theia/gearbox-engine/package.json's version plus the
# revision, e.g. 0.1.0-cf63925 -- is published once, into its own release
# `gearbox-engine-v<version>`, with one VSIX per desktop platform (win32-x64,
# darwin-arm64), and never replaced: installed apps pin its SHA-256. A new
# revision in the Dockerfile is a new release; a change to the packaging alone
# needs that package.json's version raised. A platform added later goes into
# the release that is already there, beside the VSIXs it holds.
#
# A pull request builds it and keeps the VSIXs as artifacts. A push publishes
# what the version's release is missing -- on the upstream that is main; a
# fork publishes into its own releases, which is how a fork's desktop build
# gets an engine to fetch.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - theia/Dockerfile
      - theia/gearbox-engine/**
      - .github/workflows/gearbox-engine.yml
  push:
    paths:
      - theia/Dockerfile
      - theia/gearbox-engine/**
      - .github/workflows/gearbox-engine.yml

concurrency:
  group: gearbox-engine-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # `archive` is the engine release's target; `sha256` the
          # theia/Dockerfile argument that pins its archive.
          - target: win32-x64
            archive: x86_64-pc-windows-msvc.zip
            sha256: STUDIO_GEARBOX_SHA256_WIN32_X64
            engine: gearbox.exe
          - target: darwin-arm64
            archive: aarch64-apple-darwin.tar.gz
            sha256: STUDIO_GEARBOX_SHA256_DARWIN_ARM64
            engine: gearbox
    name: build (${{ matrix.target }})
    # Packing is platform-neutral now that nothing is compiled.
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - name: Pins
        shell: bash
        run: |
          set -euo pipefail
          # A Windows checkout may carry CRLF; a stray CR would end up in the ref.
          pin() { tr -d '\r' < theia/Dockerfile | sed -n "s/^ARG $1=//p"; }
          repo=$(pin STUDIO_GEARBOX_REPO)
          release=$(pin STUDIO_GEARBOX_RELEASE)
          engine_version=$(pin STUDIO_GEARBOX_VERSION)
          ref=$(pin STUDIO_GEARBOX_REF)
          sha256=$(pin ${{ matrix.sha256 }})
          if [ -z "$repo" ] || [ -z "$release" ] || [ -z "$engine_version" ] || [ -z "$ref" ] || [ -z "$sha256" ]; then
            echo "::error::theia/Dockerfile no longer pins the gearbox engine the way this step reads it"
            exit 1
          fi
          version="$(node -p "require('./theia/gearbox-engine/package.json').version")-${ref:0:7}"
          {
            echo "GEARBOX_URL=$repo/releases/download/$release/gearbox-$engine_version-${{ matrix.archive }}"
            echo "GEARBOX_SHA256=$sha256"
            echo "GEARBOX_REF=$ref"
            echo "ENGINE_VERSION=$version"
            echo "ENGINE_TAG=gearbox-engine-v$version"
          } >> "$GITHUB_ENV"
      - name: Already published?
        id: published
        shell: bash
        run: |
          vsix="constructorfabric.gearbox-engine-$ENGINE_VERSION-${{ matrix.target }}.vsix"
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] \
            && gh release view "$ENGINE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "$vsix"; then
            echo "$vsix is already published in $ENGINE_TAG; nothing to build"
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Download the engine
        if: steps.published.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/${{ matrix.archive }}"
          curl -sSL --fail -o "$archive" "$GEARBOX_URL"
          echo "$GEARBOX_SHA256  $archive" | sha256sum --check
          mkdir -p gearbox-bin
          case "$archive" in
            *.zip) unzip -q -j "$archive" '*/${{ matrix.engine }}' -d gearbox-bin ;;
            *) tar xzf "$archive" -C gearbox-bin --strip-components=1 --wildcards '*/${{ matrix.engine }}' ;;
          esac
          ls -la gearbox-bin
      - name: Pack
        if: steps.published.outputs.done != 'true'
        shell: bash
        run: python3 theia/gearbox-engine/build_vsix.py --engine gearbox-bin/${{ matrix.engine }} --ref "$GEARBOX_REF" --target ${{ matrix.target }} --out dist
      - uses: actions/upload-artifact@v6
        if: steps.published.outputs.done != 'true'
        with:
          name: gearbox-engine-${{ env.ENGINE_VERSION }}-${{ matrix.target }}
          path: dist/*.vsix
          if-no-files-found: error

  publish:
    # One job publishes what the builds made, so two of them never race to
    # create the release.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            theia/Dockerfile
            theia/gearbox-engine/package.json
          sparse-checkout-cone-mode: false
      - name: Version
        shell: bash
        run: |
          set -euo pipefail
          ref=$(sed -n 's/^ARG STUDIO_GEARBOX_REF=//p' theia/Dockerfile | tr -d '\r')
          version="$(node -p "require('./theia/gearbox-engine/package.json').version")-${ref:0:7}"
          echo "ENGINE_VERSION=$version" >> "$GITHUB_ENV"
          echo "ENGINE_TAG=gearbox-engine-v$version" >> "$GITHUB_ENV"
          echo "GEARBOX_REF=$ref" >> "$GITHUB_ENV"
      # Nothing to download when every platform was published already.
      - uses: actions/download-artifact@v6
        continue-on-error: true
        with:
          pattern: gearbox-engine-*
          path: dist
          merge-multiple: true
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          built=(dist/*.vsix)
          if [ ${#built[@]} -eq 0 ]; then
            echo "$ENGINE_TAG already holds every platform; nothing to publish"
            exit 0
          fi
          if gh release view "$ENGINE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Published once: an app's manifest pins what is there.
            existing=$(gh release view "$ENGINE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            for vsix in "${built[@]}"; do
              if ! grep -qx "$(basename "$vsix")" <<< "$existing"; then
                gh release upload "$ENGINE_TAG" --repo "$GITHUB_REPOSITORY" "$vsix"
              fi
            done
            exit 0
          fi
          gh release create "$ENGINE_TAG" --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "Gearbox engine $ENGINE_VERSION" \
            --notes "The gearbox engine at $GEARBOX_REF, as the extension a desktop Studio fetches. Not an installer to download by hand." \
            "${built[@]}"
