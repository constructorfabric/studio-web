name: Deploy Services

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        required: true
        options:
          - dev
          - test
      component:
        description: Service component to deploy
        type: choice
        required: true
        default: all
        options:
          - all
          - backend
          - frontend
      image_tag:
        description: Full sha-<commit> snapshot or v* release tag
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-services-${{ inputs.environment }}
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  IMAGE_TAG: ${{ inputs.image_tag }}
  NAMESPACE: studio-${{ inputs.environment }}
  KUBECONFIG: /tmp/studio-kubeconfig

jobs:
  deploy:
    name: Deploy ${{ inputs.component }} ${{ inputs.image_tag }} to ${{ inputs.environment }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.target.outputs.url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate target and immutable tag
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$IMAGE_TAG" =~ ^v[0-9][0-9A-Za-z._-]*$ ]]; then
            resolved="$(git rev-parse --verify "refs/tags/${IMAGE_TAG}^{commit}")"
            if ! git merge-base --is-ancestor "$resolved" origin/main; then
              echo "Release tag $IMAGE_TAG does not point to a commit on main" >&2
              exit 1
            fi
            source_kind=release
          elif [[ "$IMAGE_TAG" =~ ^sha-[0-9a-f]{7,40}$ ]]; then
            commit="${IMAGE_TAG#sha-}"
            resolved="$(git rev-parse --verify "${commit}^{commit}")"
            source_kind=snapshot
            if [ "${{ inputs.environment }}" != "dev" ]; then
              echo "Branch/main snapshots may be deployed only to dev; use a v* release tag for ${{ inputs.environment }}" >&2
              exit 1
            fi
          else
            echo "image_tag must be sha-<commit> or a v* release tag" >&2
            exit 1
          fi

          case "${{ inputs.environment }}" in
            dev) host=studio-dev.cfabric.org ;;
            test) host=studio-test.cfabric.org ;;
            *) echo "Unsupported environment" >&2; exit 1 ;;
          esac
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "url=https://$host" >> "$GITHUB_OUTPUT"
          echo "source_kind=$source_kind" >> "$GITHUB_OUTPUT"
          echo "source_commit=$resolved" >> "$GITHUB_OUTPUT"

      - uses: azure/setup-kubectl@v4
        with:
          version: v1.35.3

      - uses: azure/setup-helm@v4
        with:
          version: v4.2.3

      - name: Configure namespace-scoped cluster access
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KUBE_CONFIG_B64"
          printf '%s' "$KUBE_CONFIG_B64" | base64 --decode > "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
          unset KUBE_CONFIG_B64

          kubectl auth can-i get deployments -n "$NAMESPACE" | grep -qx yes
          kubectl auth can-i create deployments -n "$NAMESPACE" | grep -qx yes
          if kubectl auth can-i '*' '*' --all-namespaces | grep -qx yes; then
            echo "Refusing to deploy with a cluster-admin credential" >&2
            exit 1
          fi

      - name: Verify images and namespace prerequisites
        id: versions
        shell: bash
        run: |
          set -euo pipefail

          current_tag() {
            local component="$1"
            local image
            image="$(kubectl get deployment "studio-studio-web-$component" \
              -n "$NAMESPACE" \
              -o jsonpath='{.spec.template.spec.containers[0].image}')"
            printf '%s' "${image##*:}"
          }

          backend_tag="$(current_tag backend)"
          frontend_tag="$(current_tag frontend)"
          keycloak_tag="$(current_tag keycloak)"

          case "${{ inputs.component }}" in
            all)
              backend_tag="$IMAGE_TAG"
              frontend_tag="$IMAGE_TAG"
              ;;
            backend) backend_tag="$IMAGE_TAG" ;;
            frontend) frontend_tag="$IMAGE_TAG" ;;
            *) echo "Unsupported component" >&2; exit 1 ;;
          esac

          docker manifest inspect "$IMAGE_PREFIX/studio-backend:$backend_tag" >/dev/null
          docker manifest inspect "$IMAGE_PREFIX/studio-frontend:$frontend_tag" >/dev/null
          docker manifest inspect "$IMAGE_PREFIX/cf-studio-keycloak:$keycloak_tag" >/dev/null

          echo "backend_tag=$backend_tag" >> "$GITHUB_OUTPUT"
          echo "frontend_tag=$frontend_tag" >> "$GITHUB_OUTPUT"
          echo "keycloak_tag=$keycloak_tag" >> "$GITHUB_OUTPUT"

          for secret in \
            studio-postgres-app \
            studio-web-idp \
            studio-web-app \
            keycloak-postgres-app \
            studio-web-keycloak-admin \
            studio-web-keycloak-realm; do
            kubectl get secret "$secret" -n "$NAMESPACE" -o name >/dev/null
          done

      - name: Render and validate chart
        shell: bash
        run: |
          set -euo pipefail
          values="deploy/helm/values-${{ inputs.environment }}.example.yaml"
          common_args=(
            -f "$values"
            --set-string "backend.image.tag=${{ steps.versions.outputs.backend_tag }}"
            --set-string "frontend.image.tag=${{ steps.versions.outputs.frontend_tag }}"
            --set-string "keycloak.image.tag=${{ steps.versions.outputs.keycloak_tag }}"
          )

          helm lint deploy/helm/studio-web "${common_args[@]}"
          helm template studio deploy/helm/studio-web \
            -n "$NAMESPACE" "${common_args[@]}" \
            | kubectl apply --dry-run=server -n "$NAMESPACE" -f - >/dev/null

      - name: Deploy with automatic rollback
        shell: bash
        run: |
          set -euo pipefail
          helm upgrade --install studio deploy/helm/studio-web \
            -n "$NAMESPACE" \
            -f "deploy/helm/values-${{ inputs.environment }}.example.yaml" \
            --set-string "backend.image.tag=${{ steps.versions.outputs.backend_tag }}" \
            --set-string "frontend.image.tag=${{ steps.versions.outputs.frontend_tag }}" \
            --set-string "keycloak.image.tag=${{ steps.versions.outputs.keycloak_tag }}" \
            --force-conflicts \
            --rollback-on-failure \
            --wait \
            --timeout 10m \
            --history-max 10

      - name: Verify rollout and public endpoints
        shell: bash
        run: |
          set -euo pipefail
          host="${{ steps.target.outputs.host }}"

          case "${{ inputs.component }}" in
            all) components=(backend frontend) ;;
            backend) components=(backend) ;;
            frontend) components=(frontend) ;;
          esac

          for component in "${components[@]}"; do
            deployment="studio-studio-web-$component"
            kubectl rollout status "deployment/$deployment" -n "$NAMESPACE" --timeout=3m
            images="$(kubectl get "deployment/$deployment" -n "$NAMESPACE" -o jsonpath='{.spec.template.spec.containers[*].image}')"
            grep -q ":$IMAGE_TAG" <<<"$images"
          done

          curl --fail --silent --show-error --retry 6 --retry-all-errors \
            "https://$host/" >/dev/null
          curl --fail --silent --show-error --retry 6 --retry-all-errors \
            "https://$host/cf/health" >/dev/null

          issuer="$(curl --fail --silent --show-error \
            "https://$host/auth/realms/studio/.well-known/openid-configuration" \
            | jq -r .issuer)"
          test "$issuer" = "https://$host/auth/realms/studio"

          kubectl get pods -n "$NAMESPACE"
          helm status studio -n "$NAMESPACE"
