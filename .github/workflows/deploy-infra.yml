name: Deploy Infra

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        required: true
        options:
          - dev
          - test
      infra_tag:
        description: Published infrastructure release tag (infra-vX.Y.Z)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-infra-${{ inputs.environment }}
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  INFRA_TAG: ${{ inputs.infra_tag }}
  NAMESPACE: studio-${{ inputs.environment }}
  KUBECONFIG: /tmp/studio-kubeconfig

jobs:
  deploy:
    name: Deploy ${{ inputs.infra_tag }} to ${{ inputs.environment }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.target.outputs.url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate the infrastructure release
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$INFRA_TAG" =~ ^infra-v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "infra_tag must match infra-v<semver>" >&2
            exit 1
          fi

          resolved="$(git rev-parse --verify "refs/tags/${INFRA_TAG}^{commit}")"
          if ! git merge-base --is-ancestor "$resolved" origin/main; then
            echo "Infrastructure tag $INFRA_TAG does not point to a commit on main" >&2
            exit 1
          fi

          is_draft="$(gh release view "$INFRA_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft \
            --jq .isDraft)"
          test "$is_draft" = "false"

          case "${{ inputs.environment }}" in
            dev) host=studio-dev.cfabric.org ;;
            test) host=studio-test.cfabric.org ;;
            *) echo "Unsupported environment" >&2; exit 1 ;;
          esac
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "url=https://$host" >> "$GITHUB_OUTPUT"
          echo "source_commit=$resolved" >> "$GITHUB_OUTPUT"

      - uses: azure/setup-kubectl@v4
        with:
          version: v1.35.3

      - uses: azure/setup-helm@v4
        with:
          version: v4.2.3

      - name: Configure namespace-scoped cluster access
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KUBE_CONFIG_B64"
          printf '%s' "$KUBE_CONFIG_B64" | base64 --decode > "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
          unset KUBE_CONFIG_B64

          kubectl auth can-i get clusters.postgresql.cnpg.io -n "$NAMESPACE" | grep -qx yes
          kubectl auth can-i patch clusters.postgresql.cnpg.io -n "$NAMESPACE" | grep -qx yes
          kubectl auth can-i patch deployments.apps -n "$NAMESPACE" | grep -qx yes
          if kubectl auth can-i '*' '*' --all-namespaces | grep -qx yes; then
            echo "Refusing to deploy with a cluster-admin credential" >&2
            exit 1
          fi

      - name: Verify images and namespace prerequisites
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          docker manifest inspect "$IMAGE_PREFIX/graph-postgres:$INFRA_TAG" >/dev/null
          docker manifest inspect "$IMAGE_PREFIX/cf-studio-keycloak:$INFRA_TAG" >/dev/null

          for secret in \
            studio-postgres-app \
            studio-web-idp \
            studio-web-app \
            keycloak-postgres-app \
            studio-web-keycloak-admin \
            studio-web-keycloak-realm \
            studio-web-keycloak-vault; do
            kubectl get secret "$secret" -n "$NAMESPACE" -o name >/dev/null
          done

          current_tag() {
            local component="$1"
            local image
            image="$(kubectl get deployment "studio-studio-web-$component" \
              -n "$NAMESPACE" \
              -o jsonpath='{.spec.template.spec.containers[0].image}')"
            printf '%s' "${image##*:}"
          }

          echo "backend_tag=$(current_tag backend)" >> "$GITHUB_OUTPUT"
          echo "frontend_tag=$(current_tag frontend)" >> "$GITHUB_OUTPUT"

      - name: Render and validate infrastructure changes
        shell: bash
        run: |
          set -euo pipefail
          template="deploy/k8s/cloudnative-pg/${{ inputs.environment }}-cluster.template.yaml"
          graph_image="$IMAGE_PREFIX/graph-postgres:$INFRA_TAG"
          sed "s#\${GRAPH_POSTGRES_IMAGE}#$graph_image#g" "$template" \
            | kubectl apply --dry-run=server -n "$NAMESPACE" -f - >/dev/null

          values="deploy/helm/values-${{ inputs.environment }}.example.yaml"
          common_args=(
            -f "$values"
            --set-string "backend.image.tag=${{ steps.versions.outputs.backend_tag }}"
            --set-string "frontend.image.tag=${{ steps.versions.outputs.frontend_tag }}"
            --set-string "keycloak.image.tag=$INFRA_TAG"
          )
          helm lint deploy/helm/studio-web "${common_args[@]}"
          helm template studio deploy/helm/studio-web \
            -n "$NAMESPACE" "${common_args[@]}" \
            | kubectl apply --dry-run=server -n "$NAMESPACE" -f - >/dev/null

      - name: Reconcile graph PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          template="deploy/k8s/cloudnative-pg/${{ inputs.environment }}-cluster.template.yaml"
          graph_image="$IMAGE_PREFIX/graph-postgres:$INFRA_TAG"
          sed "s#\${GRAPH_POSTGRES_IMAGE}#$graph_image#g" "$template" \
            | kubectl apply --server-side \
                --field-manager=studio-infra-deployer \
                -n "$NAMESPACE" -f -

          kubectl wait cluster/studio-postgres \
            -n "$NAMESPACE" \
            --for=jsonpath='{.status.phase}'='Cluster in healthy state' \
            --timeout=15m

      - name: Deploy Keycloak with automatic rollback
        shell: bash
        run: |
          set -euo pipefail
          helm upgrade --install studio deploy/helm/studio-web \
            -n "$NAMESPACE" \
            -f "deploy/helm/values-${{ inputs.environment }}.example.yaml" \
            --set-string "backend.image.tag=${{ steps.versions.outputs.backend_tag }}" \
            --set-string "frontend.image.tag=${{ steps.versions.outputs.frontend_tag }}" \
            --set-string "keycloak.image.tag=$INFRA_TAG" \
            --force-conflicts \
            --rollback-on-failure \
            --wait \
            --timeout 15m \
            --history-max 10

      - name: Verify PostgreSQL and Keycloak
        shell: bash
        run: |
          set -euo pipefail
          host="${{ steps.target.outputs.host }}"

          test "$(kubectl get cluster studio-postgres -n "$NAMESPACE" -o jsonpath='{.status.phase}')" = \
            "Cluster in healthy state"
          kubectl rollout status deployment/studio-studio-web-keycloak \
            -n "$NAMESPACE" --timeout=5m

          keycloak_image="$(kubectl get deployment/studio-studio-web-keycloak \
            -n "$NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[0].image}')"
          grep -q ":$INFRA_TAG$" <<<"$keycloak_image"

          issuer="$(curl --fail --silent --show-error --retry 6 --retry-all-errors \
            "https://$host/auth/realms/studio/.well-known/openid-configuration" \
            | jq -r .issuer)"
          test "$issuer" = "https://$host/auth/realms/studio"

          kubectl get cluster,pods -n "$NAMESPACE"
          helm status studio -n "$NAMESPACE"
