name: Desktop — Windows build

# The desktop Studio (ADR-0027) as an installer: theia/electron-app built on a
# Windows runner, so its native modules (node-pty, keytar, drivelist,
# native-keymap, the ffmpeg check) compile against the real toolchain, then
# packaged by theia/electron-app/scripts/package.mjs into an NSIS installer and
# a zip. The build offers the Studios in theia/electron-app/environments.json
# (dev, test, local) and starts on the one given; the member switches in the
# Studio view. The installer is an artifact of the run.
#
# Not on every pull request: a Windows runner costs several times a Linux one,
# and the browser session image does not depend on this. It runs when the
# desktop packaging itself changes in a PR, on main, for a release tag, and
# on demand. Fork feature pushes rely on the upstream PR check instead.
#
# A tag `desktop-v<version>` makes it a RELEASE: the tag must match
# theia/electron-app/package.json's version, and the installer, its blockmap
# and the update channel files go into a GitHub release `desktop-v<version>`
# (a pre-release when the version has a `-beta`-style suffix) and into the
# rolling release `desktop-updates`, which installed apps check for updates
# (theia/electron-app/desktop-updater.js).

on:
  workflow_dispatch:
    inputs:
      default_environment:
        description: The Studio the build starts on (an id in environments.json)
        default: dev
      studio_url:
        description: Instead, ship exactly one Studio at this address
        default: ''
      issuer:
        description: That Studio's realm, when not <address>/auth/realms/studio
        default: ''
      version:
        description: The version the installer carries, when not electron-app's own
        default: ''
  pull_request:
    paths:
      - theia/electron-app/**
      - theia/cfs.json
      - .github/workflows/desktop-windows.yml
  push:
    branches: [main]
    # Path filters do not apply to tag pushes, so a release tag always builds.
    tags: ['desktop-v*']
    paths:
      - theia/electron-app/**
      - theia/cfs.json
      - .github/workflows/desktop-windows.yml

concurrency:
  # A newer PR or main push supersedes the earlier installer build. Tags and
  # manual builds each get their own group so neither can be discarded.
  group: desktop-windows-${{ (github.event_name == 'workflow_dispatch' || github.ref_type == 'tag') && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}

permissions:
  contents: read

jobs:
  build:
    # Pinned, not windows-latest: that image moved to Visual Studio 2026, which
    # the node-gyp in this dependency tree (10.x) does not recognise, so every
    # native module fails with "could not find Visual Studio". 2022 is what it
    # knows. Move on when node-gyp in the tree does.
    runs-on: windows-2022
    defaults:
      run:
        working-directory: theia
    env:
      STUDIO_DEFAULT: ${{ inputs.default_environment || 'dev' }}
      STUDIO_URL: ${{ inputs.studio_url }}
      STUDIO_ISSUER: ${{ inputs.issuer }}
      STUDIO_VERSION_INPUT: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: theia/package-lock.json
      # studio/src/node/cfs-map-adapter.ts requires this schema at build and at
      # run time; it is generated by Constructor Studio and not in git. The
      # session image copies the same file (theia/Dockerfile).
      - name: Ship the CFS map schema
        shell: bash
        run: mkdir -p .cf-studio/.core/schemas && cp docker/cfs-map.schema.json .cf-studio/.core/schemas/map.schema.json
      # One version, from one place: electron-app/package.json, which a release
      # tag has to agree with. A manual run may still name another.
      - name: Version
        shell: bash
        run: |
          own=$(node -p "require('./electron-app/package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then
            tagged="${GITHUB_REF_NAME#desktop-v}"
            if [ "$tagged" != "$own" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match electron-app/package.json ($own)"
              exit 1
            fi
          fi
          echo "STUDIO_VERSION=${STUDIO_VERSION_INPUT:-$own}" >> "$GITHUB_ENV"
      - name: Install
        run: npm ci
      - name: Build drawio-editor
        run: npm --prefix drawio-editor run build
      - name: Download the built-in plugins
        working-directory: theia/electron-app
        run: npx theia download:plugins
      # Claude Code and Codex, as the VS Code extensions product-ext drives
      # (`claude-vscode.sidebar.open`, `chatgpt.openSidebar`, …). The installer
      # does not carry them (#480): it carries their manifest, and the app
      # fetches each one on first need, checks it against the SHA-256 recorded
      # here, and deploys it live (studio/src/node/desktop-assistants.ts).
      # theia/Dockerfile's `fetch_vsix` lines are the one pin; a pinned version
      # with no win32 build takes the newest win32 build there is instead, and
      # the run warns about it. The script downloads each VSIX once to check
      # open-vsx's digest. The Constructor Studio CLI (`cfs`) comes the same
      # way, from the release studio-cli.yml publishes for the version
      # theia/cfs.json pins; until that release exists the build warns and
      # ships without it.
      - name: Assistant extensions manifest (Claude Code, Codex)
        shell: bash
        run: |
          set -euo pipefail
          node electron-app/scripts/assistants-manifest.mjs --dockerfile Dockerfile --target win32-x64 \
            --studio-cli "https://github.com/$GITHUB_REPOSITORY/releases/download" \
            --out "$RUNNER_TEMP/assistants.json"
          echo "STUDIO_ASSISTANTS=$(cygpath -w "$RUNNER_TEMP/assistants.json")" >> "$GITHUB_ENV"
      - name: Rebuild native modules for Electron
        working-directory: theia/electron-app
        run: npx theia rebuild:electron --cacheRoot ..
      - name: Build the app
        working-directory: theia/electron-app
        run: npx theia build --mode production
      # The gearbox engine behind the gear catalogue, products and `.gdl`
      # (gearbox-studio), built at the revision and with the Rust the session
      # image uses: theia/Dockerfile's `gearbox` stage is the one pin. The
      # repository publishes no release, so it is built from source here too.
      - name: Gearbox engine revision
        shell: bash
        run: |
          set -euo pipefail
          # A Windows checkout may carry CRLF; a stray CR would end up in the ref.
          pin() { tr -d '\r' < Dockerfile | sed -n "$1"; }
          repo=$(pin 's/^ARG STUDIO_GEARBOX_REPO=//p')
          ref=$(pin 's/^ARG STUDIO_GEARBOX_REF=//p')
          rust=$(pin 's/^FROM rust:\([0-9.]*\)-.* AS gearbox$/\1/p')
          if [ -z "$repo" ] || [ -z "$ref" ] || [ -z "$rust" ]; then
            echo "::error::theia/Dockerfile no longer pins the gearbox engine the way this step reads it"
            exit 1
          fi
          echo "GEARBOX_REPO=$repo" >> "$GITHUB_ENV"
          echo "GEARBOX_REF=$ref" >> "$GITHUB_ENV"
          echo "GEARBOX_RUST=$rust" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            gearbox-src/target
            ~/.cargo/registry
            ~/.cargo/git
          key: gearbox-windows-${{ env.GEARBOX_RUST }}-${{ env.GEARBOX_REF }}
      - name: Build the gearbox engine
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gearbox-src && cd gearbox-src
          [ -d .git ] || git init -q .
          git fetch -q --depth 1 "$GEARBOX_REPO" "$GEARBOX_REF"
          git checkout -q --force FETCH_HEAD
          rustup toolchain install "$GEARBOX_RUST" --profile minimal
          CARGO_PROFILE_RELEASE_DEBUG=0 CARGO_PROFILE_RELEASE_STRIP=true \
            cargo "+$GEARBOX_RUST" build --release --locked -p gearbox-cli
          ./target/release/gearbox.exe --version
          echo "GEARBOX_ENGINE_BUILT=$(cygpath -w "$PWD/target/release/gearbox.exe")" >> "$GITHUB_ENV"
      - name: Package
        working-directory: theia/electron-app
        shell: pwsh
        run: |
          $packArgs = @('--version', $env:STUDIO_VERSION, '--gearbox', $env:GEARBOX_ENGINE_BUILT, '--assistants', $env:STUDIO_ASSISTANTS)
          if ($env:STUDIO_URL) {
            $packArgs += @('--studio-url', $env:STUDIO_URL)
            if ($env:STUDIO_ISSUER) { $packArgs += @('--issuer', $env:STUDIO_ISSUER) }
          } else {
            $packArgs += @('--default', $env:STUDIO_DEFAULT)
          }
          node scripts/package.mjs @packArgs
      - uses: actions/upload-artifact@v6
        with:
          name: constructor-studio-windows-${{ env.STUDIO_VERSION }}
          path: |
            theia/electron-app/dist/*.exe
            theia/electron-app/dist/*.exe.blockmap
            theia/electron-app/dist/*.zip
            theia/electron-app/dist/*.yml
            !theia/electron-app/dist/builder-debug.yml
          if-no-files-found: error

  release:
    # Only for a release tag: publish what the build made.
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - name: The versioned release
        shell: bash
        run: |
          set -euo pipefail
          ls -la dist
          version="${TAG#desktop-v}"
          flags=(--repo "$GITHUB_REPOSITORY" --title "Constructor Studio desktop $version" --generate-notes --verify-tag)
          # A pre-release version (0.3.1-beta.1) is a GitHub pre-release, and
          # never becomes the repository's "latest".
          if [[ "$version" == *-* ]]; then flags+=(--prerelease); else flags+=(--latest=false); fi
          gh release create "$TAG" "${flags[@]}" dist/*.exe dist/*.exe.blockmap dist/*.yml dist/*.zip
      - name: The rolling release installed apps read
        shell: bash
        run: |
          set -euo pipefail
          # The feed electron-updater's generic provider reads: the channel
          # files (latest.yml, beta.yml) and the installers they point at. A
          # pre-release, so it never becomes the repository's "latest".
          if ! gh release view desktop-updates --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create desktop-updates --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "Desktop updates (rolling)" \
              --notes "The update feed installed desktop apps read. Refreshed by every desktop-v* release; not an installer to download by hand."
          fi
          gh release upload desktop-updates --repo "$GITHUB_REPOSITORY" --clobber dist/*.exe dist/*.exe.blockmap dist/*.yml
