name: Desktop build

# The desktop Studio (ADR-0027) as installers: theia/electron-app built on a
# Windows runner and on an Apple Silicon Mac, so its native modules (node-pty,
# keytar, drivelist, native-keymap, the ffmpeg check) compile against each
# platform's real toolchain, then packaged by
# theia/electron-app/scripts/package.mjs -- an NSIS installer and a zip for
# Windows, a dmg and a zip for macOS. The build offers the Studios in
# theia/electron-app/environments.json (dev, test, local) and starts on the one
# given; the member switches in the Studio view. The installers are artifacts
# of the run.
#
# The macOS app is signed ad hoc unless the repository has a Developer ID
# (secrets MAC_CSC_LINK, MAC_CSC_KEY_PASSWORD; notarized with APPLE_API_KEY,
# APPLE_API_KEY_ID, APPLE_API_ISSUER too). Ad hoc, Gatekeeper asks the member
# to allow it once, and it points to new releases instead of updating itself.
#
# Not on every pull request: Windows and macOS runners cost several times a
# Linux one, and the browser session image does not depend on this. It runs when the
# desktop packaging itself changes in a PR, on main, for a release tag, and
# on demand. Fork feature pushes rely on the upstream PR check instead.
#
# A tag `desktop-v<version>` makes it a RELEASE: the tag must match
# theia/electron-app/package.json's version, and the installer, its blockmap
# and the update channel files go into a GitHub release `desktop-v<version>`
# (a pre-release when the version has a `-beta`-style suffix) and into the
# rolling release `desktop-updates`, which installed apps check for updates
# (theia/electron-app/desktop-updater.js).

on:
  workflow_dispatch:
    inputs:
      default_environment:
        description: The Studio the build starts on (an id in environments.json)
        default: dev
      studio_url:
        description: Instead, ship exactly one Studio at this address
        default: ''
      issuer:
        description: That Studio's realm, when not <address>/auth/realms/studio
        default: ''
      version:
        description: The version the installer carries, when not electron-app's own
        default: ''
      platforms:
        description: Which installers to build
        type: choice
        options: [both, windows, macos]
        default: both
  pull_request:
    paths:
      - theia/electron-app/**
      - theia/cfs.json
      - .github/workflows/desktop.yml
  push:
    branches: [main]
    # Path filters do not apply to tag pushes, so a release tag always builds.
    tags: ['desktop-v*']
    paths:
      - theia/electron-app/**
      - theia/cfs.json
      - .github/workflows/desktop.yml

concurrency:
  # A newer PR or main push supersedes the earlier installer build. Tags and
  # manual builds each get their own group so neither can be discarded.
  group: desktop-${{ (github.event_name == 'workflow_dispatch' || github.ref_type == 'tag') && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows, macos]
        include:
          # Pinned, not windows-latest: that image moved to Visual Studio 2026,
          # which the node-gyp in this dependency tree (10.x) does not
          # recognise, so every native module fails with "could not find Visual
          # Studio". 2022 is what it knows. Move on when node-gyp in the tree
          # does.
          - platform: windows
            runner: windows-2022
            target: win32-x64
          # Apple Silicon only: Intel Macs would need a second build, and a
          # second Python, CLI and engine for darwin-x64.
          - platform: macos
            runner: macos-15
            target: darwin-arm64
        # A manual run may build one of them; every other run builds both.
        exclude:
          - platform: ${{ inputs.platforms == 'windows' && 'macos' || inputs.platforms == 'macos' && 'windows' || 'none' }}
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: theia
    env:
      STUDIO_DEFAULT: ${{ inputs.default_environment || 'dev' }}
      STUDIO_URL: ${{ inputs.studio_url }}
      STUDIO_ISSUER: ${{ inputs.issuer }}
      STUDIO_VERSION_INPUT: ${{ inputs.version }}
      # The rest of a Developer ID for the macOS app (CSC_LINK itself is set by
      # the step "Developer ID"). electron-builder reads these itself; empty,
      # they are ignored.
      CSC_KEY_PASSWORD: ${{ matrix.platform == 'macos' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
      APPLE_API_KEY: ${{ matrix.platform == 'macos' && secrets.APPLE_API_KEY || '' }}
      APPLE_API_KEY_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_API_KEY_ID || '' }}
      APPLE_API_ISSUER: ${{ matrix.platform == 'macos' && secrets.APPLE_API_ISSUER || '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: theia/package-lock.json
      # node-gyp on the Mac: a Python it can use (the image's Homebrew one
      # refuses pip), with setuptools for its gyp.
      - uses: actions/setup-python@v6
        if: matrix.platform == 'macos'
        with:
          python-version: '3.12'
      - name: Python for node-gyp
        if: matrix.platform == 'macos'
        run: python -m pip install --quiet setuptools
      # Only when the repository has one: electron-builder takes an empty
      # CSC_LINK on a Mac for a certificate to import, and the ad-hoc build
      # fails. Without it, package.mjs signs ad hoc.
      - name: Developer ID
        if: matrix.platform == 'macos'
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
        run: |
          if [ -n "$MAC_CSC_LINK" ]; then
            {
              echo 'CSC_LINK<<STUDIO_CSC_LINK_END'
              echo "$MAC_CSC_LINK"
              echo 'STUDIO_CSC_LINK_END'
            } >> "$GITHUB_ENV"
          else
            echo "no MAC_CSC_LINK: the app is signed ad hoc"
          fi
      # studio/src/node/cfs-map-adapter.ts requires this schema at build and at
      # run time; it is generated by Constructor Studio and not in git. The
      # session image copies the same file (theia/Dockerfile).
      - name: Ship the CFS map schema
        shell: bash
        run: mkdir -p .cf-studio/.core/schemas && cp docker/cfs-map.schema.json .cf-studio/.core/schemas/map.schema.json
      # One version, from one place: electron-app/package.json, which a release
      # tag has to agree with. A manual run may still name another.
      - name: Version
        shell: bash
        run: |
          own=$(node -p "require('./electron-app/package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then
            tagged="${GITHUB_REF_NAME#desktop-v}"
            if [ "$tagged" != "$own" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match electron-app/package.json ($own)"
              exit 1
            fi
          fi
          echo "STUDIO_VERSION=${STUDIO_VERSION_INPUT:-$own}" >> "$GITHUB_ENV"
      # What npm ci and the packaging download besides packages: the Electron
      # binary (npm's `electron` postinstall) and electron-builder's tools
      # (NSIS and winCodeSign; the dmg builder). A few hundred MB per run from
      # GitHub releases, and the same bytes for as long as the lockfile stays
      # put. The first two paths are Windows', the others macOS'.
      - name: Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-downloads-${{ runner.os }}-${{ hashFiles('theia/package-lock.json') }}
          restore-keys: electron-downloads-${{ runner.os }}-
      - name: Install
        run: npm ci
      - name: Build drawio-editor
        run: npm --prefix drawio-editor run build
      - name: Download the built-in plugins
        working-directory: theia/electron-app
        run: npx theia download:plugins
      # Claude Code and Codex, as the VS Code extensions product-ext drives
      # (`claude-vscode.sidebar.open`, `chatgpt.openSidebar`, …). The installer
      # does not carry them (#480): it carries their manifest, and the app
      # fetches each one on first need, checks it against the SHA-256 recorded
      # here, and deploys it live (studio/src/node/desktop-assistants.ts).
      # theia/Dockerfile's `fetch_vsix` lines are the one pin. The script downloads each VSIX once to check
      # open-vsx's digest. The Constructor Studio CLI (`cfs`) comes the same
      # way, from the release studio-cli.yml publishes for the version
      # theia/cfs.json pins; until that release exists the build warns and
      # ships without it. So does the gearbox engine, from the release
      # gearbox-engine.yml builds for the revision theia/Dockerfile pins.
      - name: Assistant extensions manifest (Claude Code, Codex)
        shell: bash
        run: |
          set -euo pipefail
          node electron-app/scripts/assistants-manifest.mjs --dockerfile Dockerfile --target "${{ matrix.target }}" \
            --studio-cli "https://github.com/$GITHUB_REPOSITORY/releases/download" \
            --gearbox-engine "https://github.com/$GITHUB_REPOSITORY/releases/download" \
            --out "$RUNNER_TEMP/assistants.json"
          manifest="$RUNNER_TEMP/assistants.json"
          if command -v cygpath >/dev/null; then manifest=$(cygpath -w "$manifest"); fi
          echo "STUDIO_ASSISTANTS=$manifest" >> "$GITHUB_ENV"
      - name: Rebuild native modules for Electron
        working-directory: theia/electron-app
        run: npx theia rebuild:electron --cacheRoot ..
      - name: Build the app
        working-directory: theia/electron-app
        run: npx theia build --mode production
      - name: Package
        working-directory: theia/electron-app
        shell: pwsh
        run: |
          $packArgs = @('--version', $env:STUDIO_VERSION, '--assistants', $env:STUDIO_ASSISTANTS)
          if ($env:STUDIO_URL) {
            $packArgs += @('--studio-url', $env:STUDIO_URL)
            if ($env:STUDIO_ISSUER) { $packArgs += @('--issuer', $env:STUDIO_ISSUER) }
          } else {
            $packArgs += @('--default', $env:STUDIO_DEFAULT)
          }
          node scripts/package.mjs @packArgs
      - uses: actions/upload-artifact@v6
        with:
          name: constructor-studio-${{ matrix.platform }}-${{ env.STUDIO_VERSION }}
          path: |
            theia/electron-app/dist/*.exe
            theia/electron-app/dist/*.dmg
            theia/electron-app/dist/*.zip
            theia/electron-app/dist/*.blockmap
            theia/electron-app/dist/*.yml
            !theia/electron-app/dist/builder-debug.yml
          if-no-files-found: error

  release:
    # Only for a release tag: publish what the build made.
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - name: The versioned release
        shell: bash
        run: |
          set -euo pipefail
          # A file type a build did not make is left out, not passed as a pattern.
          shopt -s nullglob
          ls -la dist
          version="${TAG#desktop-v}"
          flags=(--repo "$GITHUB_REPOSITORY" --title "Constructor Studio desktop $version" --generate-notes --verify-tag)
          # A pre-release version (0.3.1-beta.1) is a GitHub pre-release, and
          # never becomes the repository's "latest".
          if [[ "$version" == *-* ]]; then flags+=(--prerelease); else flags+=(--latest=false); fi
          gh release create "$TAG" "${flags[@]}" dist/*.exe dist/*.dmg dist/*.zip dist/*.blockmap dist/*.yml
      - name: The rolling release installed apps read
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          # The feed electron-updater's generic provider reads: the channel
          # files (latest.yml, beta.yml; latest-mac.yml, beta-mac.yml) and the
          # installers they point at -- the macOS update is its zip. A
          # pre-release, so it never becomes the repository's "latest".
          if ! gh release view desktop-updates --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create desktop-updates --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "Desktop updates (rolling)" \
              --notes "The update feed installed desktop apps read. Refreshed by every desktop-v* release; not an installer to download by hand."
          fi
          gh release upload desktop-updates --repo "$GITHUB_REPOSITORY" --clobber \
            dist/*.exe dist/*.exe.blockmap dist/*-mac-*.zip dist/*-mac-*.zip.blockmap dist/*.dmg dist/*.dmg.blockmap dist/*.yml
