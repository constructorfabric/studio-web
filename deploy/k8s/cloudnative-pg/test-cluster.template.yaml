# Render GRAPH_POSTGRES_IMAGE to an immutable GHCR `sha-*` tag before apply.
# Example:
#   GRAPH_POSTGRES_IMAGE=ghcr.io/constructorfabric/studio-web/graph-postgres:sha-0123456 \
#     envsubst < test-cluster.template.yaml | kubectl apply -f -
apiVersion: postgresql.cnpg.io/v1
kind: ImageCatalog
metadata:
  name: studio-postgres-images
  namespace: studio-test
spec:
  images:
    - major: 19
      image: ${GRAPH_POSTGRES_IMAGE}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: studio-postgres
  namespace: studio-test
spec:
  description: Experimental PostgreSQL 19 cluster for graph-enabled Studio test
  instances: 2
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ImageCatalog
    name: studio-postgres-images
    major: 19
  primaryUpdateStrategy: unsupervised
  # The ceiling every consumer is counted against: 160 rather than
  # PostgreSQL's default 100, and the number is load-bearing.
  # studio-backend/config/k8s.yaml sizes its gear pools against it (62 per
  # replica) and the Keycloak chart caps its pool against it. Two backend
  # replicas need 124, and 144 with Keycloak, the bootstrap Job, the operator
  # and the superuser reserve; README.md carries the table. When a new gear
  # pool does not fit, lower the shared pool or give the gear a small one of
  # its own before raising this: every backend is a process, so 160 of them
  # is roughly 450 MB more resident memory at saturation (this cluster's 4 Gi
  # already covers it; dev needed a bump).
  #
  # NOT RELOADABLE — changing it restarts PostgreSQL.
  postgresql:
    parameters:
      max_connections: "160"
  enableSuperuserAccess: false
  managed:
    roles:
      # Dedicated, least-privilege database provisioner for Studio's Helm
      # bootstrap hook. The runtime `studio` role remains non-CREATEDB.
      - name: studio_bootstrap
        ensure: present
        login: true
        inherit: true
        createdb: true
        inRoles: ["studio"]
        passwordSecret:
          name: studio-postgres-bootstrap
      - name: keycloak
        ensure: present
        login: true
        passwordSecret:
          name: keycloak-postgres-app
  bootstrap:
    initdb:
      database: studio
      owner: studio
      # Per-gear databases are deliberately not listed here: Studio's Helm
      # bootstrap Job discovers them from the effective backend config on every
      # upgrade, so adding a gear never requires recreating this cluster.
  storage:
    storageClass: cinder-postgres
    size: 20Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  affinity:
    topologyKey: kubernetes.io/hostname
  monitoring:
    enablePodMonitor: false
---
# studio-test has default-deny ingress. Replication and application traffic are
# same-namespace and already allowed; the operator additionally needs the
# authenticated instance-manager status endpoint introduced in CNPG 1.30.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: keycloak
  namespace: studio-test
spec:
  name: keycloak
  owner: keycloak
  cluster:
    name: studio-postgres
  encoding: UTF8
  databaseReclaimPolicy: retain
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cnpg-operator
  namespace: studio-test
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: studio-postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
      ports:
        - protocol: TCP
          port: 8000
