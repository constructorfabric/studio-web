# Development uses the same graph-capable image and database contract as test,
# but a single smaller instance. Render GRAPH_POSTGRES_IMAGE to an immutable
# GHCR `sha-*` tag before apply.
apiVersion: postgresql.cnpg.io/v1
kind: ImageCatalog
metadata:
  name: studio-postgres-images
  namespace: studio-dev
spec:
  images:
    - major: 19
      image: ${GRAPH_POSTGRES_IMAGE}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: studio-postgres
  namespace: studio-dev
spec:
  description: Experimental PostgreSQL 19 cluster for graph-enabled Studio dev
  instances: 1
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ImageCatalog
    name: studio-postgres-images
    major: 19
  primaryUpdateStrategy: unsupervised
  # The ceiling every consumer is counted against: 160 rather than
  # PostgreSQL's default 100, and the number is load-bearing.
  # studio-backend/config/k8s.yaml sizes its gear pools against it (62 per
  # replica) and the Keycloak chart caps its pool against it. Two backend
  # replicas need 124, and 144 with Keycloak, the bootstrap Job, the operator
  # and the superuser reserve; README.md carries the table. When a new gear
  # pool does not fit, lower the shared pool or give the gear a small one of
  # its own before raising this: every backend is a process, so 160 of them
  # is roughly 450 MB more resident memory at saturation, which is what the
  # `limits.memory` bump below pays for.
  #
  # NOT RELOADABLE — changing it restarts PostgreSQL.
  postgresql:
    parameters:
      max_connections: "160"
  enableSuperuserAccess: false
  managed:
    roles:
      # Used only by the Helm database-bootstrap hook. It can create a newly
      # declared gear database but cannot administer roles or the cluster.
      # Membership permits `CREATE DATABASE ... OWNER studio` without granting
      # CREATEDB to the runtime application role.
      - name: studio_bootstrap
        ensure: present
        login: true
        inherit: true
        createdb: true
        inRoles: ["studio"]
        passwordSecret:
          name: studio-postgres-bootstrap
      - name: keycloak
        ensure: present
        login: true
        passwordSecret:
          name: keycloak-postgres-app
  bootstrap:
    initdb:
      database: studio
      owner: studio
      # Per-gear databases are deliberately not listed here: Studio's Helm
      # bootstrap Job discovers them from the effective backend config on every
      # upgrade, so adding a gear never requires recreating this cluster.
  storage:
    storageClass: cinder-postgres
    size: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      # 3 Gi rather than 2: `max_connections: 160` above is 160 processes at
      # saturation, and a server that is OOMKilled for accepting the
      # connections it was configured to accept is a worse failure than
      # refusing them.
      memory: 3Gi
  monitoring:
    enablePodMonitor: false
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: keycloak
  namespace: studio-dev
spec:
  name: keycloak
  owner: keycloak
  cluster:
    name: studio-postgres
  encoding: UTF8
  databaseReclaimPolicy: retain
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cnpg-operator
  namespace: studio-dev
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: studio-postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
      ports:
        - protocol: TCP
          port: 8000
