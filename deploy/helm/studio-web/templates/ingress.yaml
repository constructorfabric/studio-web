{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "studio-web.fullname" . }}
  labels: {{- include "studio-web.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range prepend .Values.global.customDomains .Values.global.hostname }}
    {{- if . }}
    - host: {{ . | quote }}
      http:
        paths:
          {{- if $.Values.backend.fileStorage.enabled }}
          # Same-origin signed upload/download URLs: no extra DNS or CORS.
          - path: /api/file-storage-data
            pathType: Prefix
            backend: { service: { name: {{ include "studio-web.fullname" $ }}-backend, port: { name: file-storage } } }
          {{- end }}
          {{- if $.Values.researchEmulator.enabled }}
          # The Research emulator, same origin: the browser's sign-in and the
          # backend's calls both come here (docs/research-emulator.md).
          - path: {{ $.Values.researchEmulator.path | trimSuffix "/" }}
            pathType: Prefix
            backend: { service: { name: {{ include "studio-web.fullname" $ }}-research-emulator, port: { name: http } } }
          {{- end }}
          - path: /cf
            pathType: Prefix
            backend: { service: { name: {{ include "studio-web.fullname" $ }}-backend, port: { name: http } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ include "studio-web.fullname" $ }}-frontend, port: { name: http } } }
    {{- end }}
    {{- end }}
{{- end }}
