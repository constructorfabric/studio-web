# Defaults are dev-safe: no production hostnames, no real credentials.
# Required per environment: database.existingSecret, auth (IDP) secret.
global:
  hostname: ""            # e.g. constructor.local (never a prod default)
  customDomains: []
  environmentName: "dev"
  environmentType: "prod" # policy: default reflects production behavior

backend:
  image:
    # Matches release.yml: ghcr.io/<github repo>/studio-backend
    repository: ghcr.io/constructorfabric/studio-web/studio-backend
    tag: ""                # REQUIRED: fixed at chart publication (no latest)
  replicas: 1
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1
  # ── Rollout and shutdown ──────────────────────────────────────────────────
  #
  # THE HONEST POSITION, because the numbers above do not state it on their own:
  # every deployed environment runs ONE backend replica with
  # `maxUnavailable: 1, maxSurge: 0`, which means the old pod is stopped before
  # the new one starts and the API is down for the length of a boot. That is a
  # deliberate trade, not an oversight — surge capacity is scarce on a stand
  # running IDE sessions, and a second replica is refused anyway while sessions
  # are on (see the guard in templates/backend/deployment.yaml).
  #
  # So the three settings below do not remove the window. They make it as short
  # as a boot and stop it costing anything extra: nothing is killed for being
  # slow to start, no request is answered by a process on its way out, and
  # in-flight work finishes.
  #
  # How long boot may take before the kubelet gives up. It is generous on
  # purpose: fourteen gear database migrations, and an embedding model to load
  # when the graph feature is compiled in. Only failure past this budget is a
  # crash loop; a boot that takes 200 s just takes 200 s.
  startupBudgetSeconds: 300
  # The pause between the pod leaving the Service's endpoints and the process
  # receiving SIGTERM. Removal and shutdown are concurrent in Kubernetes, so
  # without this a deploy 502s whatever kube-proxy sent in the overlap.
  preStopDrainSeconds: 10
  # Must exceed preStopDrainSeconds — the drain runs inside it, and the chart
  # refuses to render otherwise.
  terminationGracePeriodSeconds: 60
  # A PodDisruptionBudget is rendered only above one replica, the same rule the
  # Keycloak one follows. At a single replica the choice is between a budget
  # that permits the eviction (no protection) and one that forbids it (drains
  # and node upgrades block on an operator). Neither is availability, and
  # pretending otherwise with an object in the cluster is worse than the gap
  # being visible here.
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  port: 8090
  configProfile: "k8s"
  # Optional ConfigMap override for testing a corrected profile with an already
  # published immutable image. The ConfigMap key must match configProfile.
  configOverride:
    existingConfigMap: ""
  # Postgres is operator-managed; connection comes ONLY from this Secret
  # (keys: host, port, user, password, dbname).
  database:
    existingSecret: "studio-postgres-app"
    # Key mapping is configurable because CloudNativePG generates `username`,
    # while the legacy manually-created Secret used `user`.
    keys:
      host: host
      port: port
      user: user
      password: password
      dbname: dbname
  # Run an idempotent pre-install/pre-upgrade Job before the backend Deployment.
  # It discovers all PostgreSQL gear databases from config/k8s.yaml, creates
  # only missing databases, and runs forward migrations. Existing databases,
  # schemas and data are never removed. Leave existingSecret empty to reuse the
  # app connection; set a dedicated CREATEDB-capable role for least privilege.
  bootstrap:
    enabled: true
    existingSecret: ""
    # A bootstrap only creates missing databases and runs forward migrations;
    # it does not serve traffic or load the ONNX model.  Declare resources
    # explicitly instead of inheriting the namespace LimitRange default (4
    # CPUs), which can make an otherwise small hook exceed the namespace quota.
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
    keys:
      host: host
      port: port
      user: user
      password: password
      dbname: dbname
    backoffLimit: 1
    activeDeadlineSeconds: 600
  # Platform IDP (OIDC issuer + client) — external, per-service Secret
  # (keys: issuer_url, client_id, client_secret).
  auth:
    existingSecret: "studio-web-idp"
  # Application secrets (keys: llm_api_key [required], fs_signing_seed
  # [required only when fileStorage.enabled=false], credstore_key [strongly recommended: base64 of 32 bytes,
  # `openssl rand -base64 32`; without it user-typed secrets die with every
  # pod restart], s2s_client_secret [optional], idp_admin_secret [optional],
  # spec_quality_api_key [optional; enables the external detector wrapper],
  # insight_api_key [optional; enables Constructor Insight analytics — without it the
  # Components page reports delivery activity as unavailable],
  # embed_api_key [required when embedding.provider=remote]).
  appSecrets:
    existingSecret: "studio-web-app"
  # WHO ADMINISTERS THIS INSTALLATION, as Keycloak subject ids, comma-separated.
  #
  # A platform administrator is a membership of the platform root and nothing
  # else (ADR-0018 SS3); the gear writes that membership from this list at every
  # start, so it survives a database that is recreated. Empty means the
  # installation has no administrator and the gear says so at boot -- the
  # directory's administrative routes then answer 403 to everyone, which is the
  # honest answer and not a bug.
  #
  # It is per-environment because a subject id is: the same person is a
  # different subject on each Keycloak. Find one with
  #   GET /auth/admin/realms/studio/users?username=<name>&exact=true
  platformAdmins: ""
  # The subject of Studio's service identity, the `studio-service` client's
  # service account (ADR-0030): what a shared IDE session acts as. Empty uses
  # the id fixed in the realm files, which holds for a realm Keycloak created
  # from them. On a realm that existed before the client, import the client
  # and set this to its service account's id:
  #   GET /auth/admin/realms/studio/users?username=service-account-studio-service&exact=true
  serviceSubject: ""
  # Knowledge-graph embeddings (graph-storage gear). ONE provider per
  # deployment; switching it over a populated graph blocks vector search until
  # the graph is re-embedded, and the backend logs that at boot.
  #   onnx   — a MiniLM model in the backend process. An init container fetches
  #            the pinned artifacts into an emptyDir; the ONNX Runtime library
  #            is in the backend image. Budget ~300 MiB of extra RSS.
  #   remote — an OpenAI-compatible /embeddings endpoint; needs the
  #            `embed_api_key` app secret. Nothing leaves the pod except the
  #            node text being embedded (ADR-0004 calls this governed egress).
  #   fake   — deterministic hash; vectors carry no meaning. Write-path only.
  embedding:
    provider: "onnx"
    remote:
      baseUrl: "https://api.openai.com/v1"
      model: "text-embedding-3-small"   # must yield 384 dimensions (see config)
    # sentence-transformers/all-MiniLM-L6-v2, same pins as docker-compose and
    # the gears-rust CI lane. Change together with the gear's re-embedding.
    model:
      url: "https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/onnx/model.onnx"
      sha256: "6fd5d72fe4589f189f8ebc006442dbb529bb7ce38f8082112682524616046452"
    tokenizer:
      url: "https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/tokenizer.json"
      sha256: "be50c3628f2bf5bb5e3a7f17b1f74611b2561a3a27eeab05e5aa30f411572037"
    fetchImage: "curlimages/curl:8.14.1"
    fetchResources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 500m, memory: 256Mi }
  # Where artifact-ingest clones repositories so File nodes carry their text.
  #
  # Text reaches the graph from a checkout on disk, and the gear looks in two
  # places: the studio-session workspaces root, then its own clone volume
  # (STUDIO_ARTIFACT_WORKDIR). In Kubernetes the first one is unreachable by
  # construction — the IDE's clone lands in the session Pod's own per-workspace
  # claim, which the backend Pod cannot mount — so without this volume every
  # sync degrades to the connector's tree API: paths and sizes, no content, and
  # the Specs tab has nothing to classify. It is why that tab works under
  # docker-compose (one shared filesystem) and not here.
  #
  # `emptyDir` on purpose: the clones are shallow and single-branch, and a
  # re-clone after a pod restart costs less than a per-environment claim. Switch
  # to a PVC if that stops being true. `sizeLimit` is a real limit — the kubelet
  # evicts the pod for exceeding it — so size it for the repositories this
  # environment actually syncs, not for the largest one imaginable.
  artifactClone:
    enabled: true
    sizeLimit: 4Gi
    mountPath: /var/lib/studio/artifact-clones
  # The Gearbox engine: the gear catalogue an IDE lists when its workspace
  # holds no gear corpus (`/studio-product/v1/gearbox/catalogue`),
  # product previews, and the corpus clone relay. Off, those routes answer
  # 503 and the IDE's Building mode has no backend corpus to list.
  #
  # The backend keeps one checkout of the corpus under `mountPath`, refreshed
  # at most every `refreshSecs`. `emptyDir` for the reason artifactClone gives:
  # a restart re-clones. Empty `corpusUrl`/`corpusRef` take the code's
  # defaults (product/gearbox.rs).
  gearbox:
    enabled: false
    sizeLimit: 2Gi
    mountPath: /var/lib/studio/gearbox
    corpusUrl: ""
    corpusRef: ""
    refreshSecs: ""
  # OpenTelemetry push to the cluster's collector (deploy/observability).
  #
  # The instruments already exist in the binary — the api-gateway gear installs
  # its HttpMetrics layer unconditionally — and stay no-ops until a meter
  # provider is initialized. These flags are that provider's switch, wired into
  # config/k8s.yaml's `opentelemetry` block as STUDIO_OTEL_* env vars.
  #
  # Default off, so an environment without a collector is unaffected: the
  # toolkit installs a no-op provider and nothing is exported or buffered.
  telemetry:
    # RED metrics: http.server.request.duration + http.server.active_requests,
    # keyed on the matched route template.
    metrics: false
    # Traces need a Tempo to arrive at. Until then, spans would be batched and
    # dropped — CPU spent to answer nothing.
    tracing: false
    endpoint: "http://alloy-metrics.studio-monitoring.svc.cluster.local:4317"
  # S3-backed file-storage data plane. The sidecar binary is built from the
  # exact gears-rust revision pinned by studio-backend/Cargo.lock. Secrets are
  # synchronized by deploy.yml from the selected GitHub Environment.
  fileStorage:
    enabled: false
    image:
      repository: ghcr.io/constructorfabric/studio-web/file-storage-sidecar
      tag: ""                  # empty follows backend.image.tag
    publicBaseUrl: ""          # empty => https://global.hostname
    backendId: "s3-webstudio"
    s3:
      endpoint: "https://eu3-s3.virtuozzo.cloud"
      region: "eu3"
      bucket: ""               # REQUIRED when enabled
      pathStyle: true
    secrets:
      s3ExistingSecret: "studio-web-file-storage-s3"
      signingExistingSecret: "studio-web-file-storage-signing"
    # Non-secret digest supplied by deploy.yml. A rotation rolls the Pod.
    secretRevision: ""
    resources:
      requests: { cpu: "50m", memory: 64Mi }
      # 200m, measured: this signs URLs and proxies bytes, and its 24-hour peak
      # on studio-dev is 0.001 CPU. A 500m ceiling is 500x a load that does not
      # exist — and in a namespace whose quota counts limits, that is a quarter
      # of an IDE session spent on nothing.
      limits: { cpu: "200m", memory: 512Mi }
  # Theia AI's upstream for studio-llm-proxy (non-secret half; key in appSecrets).
  # Any OpenAI-compatible provider; defaults = Groq free tier.
  llm:
    baseUrl: "https://api.groq.com/openai/v1"  # Theia AI proxy upstream
    host: "api.groq.com"                       # mini-chat/OAGW host; unused in the release
    model: "llama-3.3-70b-versatile"
  # Keycloak Admin API base URL for user invites (keycloak-idp-plugin).
  # Empty = invites disabled (plugin self-deprioritizes).
  idpAdmin:
    baseUrl: ""
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 80
  # IDE sessions (studio-session Kubernetes driver, ADR-0003). Off by default;
  # the config profile also has to select driver=kubernetes. When on, the
  # backend gets a namespaced Role over pods/services (sessions-rbac.yaml) and
  # a NetworkPolicy opens egress for session Pods (sessions-netpol.yaml).
  # The backend stays single-replica while on, and the chart refuses to render
  # if either `backend.autoscaling.enabled` or a `backend.replicas` above 1 is
  # combined with this (see templates/backend/deployment.yaml).
  #
  # The reason it was imposed is gone: sessions are no longer kept in a map
  # this process owns. The Kubernetes API is asked for them, ids are derived
  # from the workspace so every replica names a session the same way, and two
  # launches racing for one workspace resolve to the one that won. That much is
  # covered by unit tests over a fake runtime.
  #
  # What has not happened is two real replicas against a real cluster. Until
  # someone runs that on studio-dev, the guard stays — lifting it is then a
  # one-line change here.
  sessions:
    enabled: false
    # One checkout, read by the IDE and by the analyses.
    #
    # A claim the backend mounts and every session Pod mounts too, each
    # workspace in a `subPath` of its own id — which is the layout
    # artifact-ingest already resolves (`{root}/{workspace_id}/{repo_dir}`).
    # Without it the two sides never see the same files: the IDE's clone lives
    # in its Pod's own volume, ingest falls back to the connector's tree API,
    # and document text exists nowhere in the cluster.
    #
    # It also makes a workspace outlive its session, which is what the
    # per-workspace claim (`k8s_workspace_persistent`) was for. That knob is
    # superseded while this is on: the shared claim wins, and a claim the
    # backend cannot mount would defeat the point.
    #
    # THE COST, and it is not small: this cluster has no ReadWriteMany class
    # (Cinder block only, every PV ReadWriteOnce), and an RWO volume attaches
    # to ONE node. So every session Pod is pinned to the backend's node — the
    # driver refuses to launch rather than leave a Pod Pending on a
    # multi-attach error. All IDEs therefore land on one node, and losing that
    # node loses the backend and every session together. With an RWX class the
    # pinning disappears and nothing else about this changes.
    sharedWorkspaces:
      enabled: false
      size: 20Gi
      # Empty leaves it to the cluster default.
      storageClass: ""
      mountPath: /var/lib/studio/workspaces
    rbac:
      # Set false when application deploys run under a restricted ServiceAccount.
      # A cluster administrator must bootstrap the Role/RoleBinding once; see
      # deploy/README.md. Keeping this true preserves the self-contained chart
      # behaviour for cluster-admin installations.
      create: true
    image:
      # The deploy workflow publishes cf-studio-theia beside the backend. An
      # empty tag follows backend.image.tag, preserving one immutable release.
      repository: harbor.constr.dev/proxy-ghcr.io/constructorfabric/studio-web/cf-studio-theia
      tag: ""
    # One idle Pod of the session image per node, so a deploy pulls it
    # everywhere and the first IDE after it does not wait for the pull
    # (templates/backend/session-image-prepull.yaml). replicas = worker nodes.
    prepull:
      enabled: false
      replicas: 3
      # The namespace LimitRange refuses a container under 10m / 16Mi.
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 20m, memory: 32Mi }
    # The session driver needs egress to the kube-apiserver, but that rule must
    # NOT ship as a chart CiliumNetworkPolicy: the constructorfabric Argo CD
    # project does not permit kind CiliumNetworkPolicy, so rendering it makes the
    # whole Application sync invalid. Keep this false and add the apiserver egress
    # to cluster-specific-bundles (alongside studio-web-egress) instead. Left as a
    # toggle only for clusters whose Argo project DOES allow the kind.
    kubeApiEgress: false
    networkPolicy:
      enabled: true
      # Git hosts the session entrypoint may clone from (CIDRs, since a bare
      # NetworkPolicy cannot name FQDNs). Empty = DNS only (no external clone).
      egressCidrs: []

frontend:
  image:
    repository: ghcr.io/constructorfabric/studio-web/studio-frontend
    tag: ""                # REQUIRED: fixed at chart publication
  replicas: 1
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1
  port: 8080               # nginx-unprivileged listens on 8080 (non-root)
  # nginx serving a static bundle: nothing here resists a second replica, which
  # is why the deployed environments run two and this budget renders. The drain
  # is shorter than the backend's for the same reason — there is no migration
  # and no in-flight write, only whatever byte range a browser is mid-way
  # through.
  preStopDrainSeconds: 5
  terminationGracePeriodSeconds: 30
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  # Optional Discord invite shown on the Home hub (runtime env.js).
  discordUrl: ""
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    # 100m, measured: nginx serving a static bundle peaks at 0.000 CPU over
    # 24 hours on studio-dev. Memory is left alone — 4% of 256Mi is not a
    # number worth tuning, and the namespace quota has memory to spare.
    limits: { cpu: 100m, memory: 256Mi }
  autoscaling:
    enabled: false

# Experimental pre-FrontX portal. It is a separate immutable image exposed at
# the root of `hostname`; the primary Studio hostname serves only the main
# frontend. `path` remains the container-internal health/mount compatibility
# path and is not added to the primary ingress.
frontendPrototype:
  enabled: false
  path: /prototype
  hostname: ""
  ingress:
    annotations: {}
    tls: []
  image:
    repository: ghcr.io/constructorfabric/studio-web/studio-frontend-prototype
    tag: ""                # REQUIRED when enabled: fixed service release tag
  replicas: 1
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1
  port: 8080
  # nginx serving a static bundle: nothing here resists a second replica, which
  # is why the deployed environments run two and this budget renders. The drain
  # is shorter than the backend's for the same reason — there is no migration
  # and no in-flight write, only whatever byte range a browser is mid-way
  # through.
  preStopDrainSeconds: 5
  terminationGracePeriodSeconds: 30
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    # 100m, measured: nginx serving a static bundle peaks at 0.000 CPU over
    # 24 hours on studio-dev. Memory is left alone — 4% of 256Mi is not a
    # number worth tuning, and the namespace quota has memory to spare.
    limits: { cpu: 100m, memory: 256Mi }

# How much of the namespace this deployment may use.
#
# The numbers below are not a guess at "enough": they are derived, and the
# arithmetic is worth keeping because the next person will want to change them.
#
# MEASURED ON THE CLUSTER (webstudio, 2026-09-18):
#   3 worker nodes x 8 CPU / ~15.5Gi  = 24 CPU, ~46Gi allocatable
#   actually REQUESTED across all of it: ~4 CPU (16%), ~7Gi (16%)
#   already-declared LIMITS: 98% and 121% of two of those nodes
#
# So the hardware is nearly idle and limits are already oversubscribed, which
# is normal — the scheduler reserves REQUESTS and limits are burst ceilings.
# Sessions were failing on the declared ceiling, not on the machines.
#
# PLATFORM BASELINE in studio-dev, counted as limits.cpu:
#   postgres 1 + backend 1 + file-storage .2 + frontend .1 x2
#   + prototype .1 + keycloak .5                                  = 3.0
#   plus 0.5 for the database bootstrap hook while it runs
#
# It was 4.0 with one frontend replica, and the difference is not a smaller
# deployment — it is ceilings that were set by habit and have now been set by
# measurement. Peak usage over 24 hours on studio-dev, against the old limits:
# frontend 0.2%, file-storage 0.2%, prototype 1.8%, keycloak 1.0%. The backend
# keeps its whole CPU (8.7% on a quiet day, but its cost is a repository sync
# with embeddings, which a quiet day does not show) and so does Postgres, at
# 37.5%.
#
# WHY THIS IS WORTH DOING AT ALL, given none of it was throttling: a
# ResourceQuota counts limits, not usage. A ceiling nobody reaches is still
# spent, and in this namespace it is spent in units of IDE session.
#
# ONE IDE SESSION: requests 250m/512Mi, limits 2 CPU/2Gi (studio-session sets
# these; they are configurable there). Theia peaks at 62% of that CPU while
# somebody is working in it, so it is the one ceiling here that is sized about
# right.
#
# limits.cpu    = 3.5 + (4 sessions + 1 terminating) x 2 = 13.5  -> 16
# limits.memory = 5Gi + 0.5 + 5 x 2Gi                  = 15.5Gi -> 24Gi
# requests.cpu  = 1.15 + 5 x 250m                      = 2.4    -> 6
# requests.mem  = 2Gi  + 5 x 512Mi                     = 4.5Gi  -> 8Gi
#
# The limits ceiling is unchanged at 16 even though the baseline dropped: the
# headroom now buys six concurrent sessions instead of four, which is the
# point. Requests are what has to fit the hardware, and they do with room to
# spare: this namespace's 6 CPU plus studio-test's 8 is 14 of 24.
#
# NB the quota LIVE in studio-dev is 8 CPU / 16Gi, not this — it predates the
# chart and `capacity.enabled` is false there, because the deployer may not
# write a ResourceQuota (deploy/README.md, "Namespace capacity"). Under that
# 8 the baseline above is what decides: 4.25 allowed one session, 3.0 allows
# two. Four needs the Role and this block actually applied.
capacity:
  # OFF by default, and the default is the whole point.
  #
  # A ResourceQuota governs the NAMESPACE, not this release. Where Studio has a
  # namespace to itself (studio-dev, studio-test) that is what we want. Where it
  # shares one — the dmz deployment sits in `dev-constructorfabric` alongside
  # airbyte, argo, clickhouse and twenty-odd other Pods, with no quota at all
  # today — creating one would put every neighbour under a ceiling nobody asked
  # for, and the first Pod to exceed it would be somebody else's.
  #
  # So this is opted INTO per environment, by somebody who knows the namespace
  # belongs to Studio. See values-dev.example.yaml and values-test.example.yaml.
  enabled: false
  # Four people in four workspaces at once, plus one session on its way out.
  # Raise `limits` by 2 CPU / 2Gi for each further concurrent session.
  limits:
    cpu: 16
    memory: 24Gi
  requests:
    cpu: 6
    memory: 8Gi
    storage: 100Gi
  counts:
    pods: 50
    # One per session, plus the platform's own eight.
    services: 20
    persistentVolumeClaims: 10
    configMaps: 100
    secrets: 100
  # What a container that declares nothing is charged. The cluster's own
  # default was 4 CPU / 8Gi — a quarter of the quota above, for saying nothing.
  containerDefaults:
    limits:
      cpu: 1
      memory: 2Gi
    requests:
      cpu: 100m
      memory: 128Mi
    # Unchanged from the cluster's: a container that needs more may still ask.
    max:
      cpu: 4
      memory: 8Gi

ingress:
  enabled: true
  className: "nginx"
  # Private by default; public exposure (ext-ingress + basic auth) is an
  # explicit per-environment override (INFRA-3725).
  annotations: {}
  tls: []

serviceAccount:
  create: true
  name: ""

# ghcr packages published by GITHUB_TOKEN start PRIVATE, so a fresh cluster
# needs either public packages or a dockerconfigjson Secret referenced here:
#   imagePullSecrets:
#     - name: ghcr-pull
imagePullSecrets: []

# Non-root is enforced; the concrete uid comes from each image (backend:
# the `studio` system user, frontend: nginx-unprivileged uid 101) — pinning
# one pod-wide uid would break whichever image doesn't own its files.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

# Self-hosted Keycloak (real SSO, INFRA-3767). Off by default — enable per
# environment once (a) a cf-studio-keycloak image exists for the release tag,
# (b) the PGO cluster has a keycloak DB user, and (c) the admin + vault Secrets
# are sealed. The image bakes the studio realm and vault; only env-specific,
# non-secret wiring lives in the chart. Egress (Keycloak -> Postgres, -> GitHub
# for social brokering) is NOT a chart CiliumNetworkPolicy — it goes in
# cluster-specific-bundles, same reason as the backend kube-api egress.
keycloak:
  enabled: false
  replicas: 1
  relativePath: "/auth"
  image:
    # Matches release.yml: ghcr.io/<repo>/cf-studio-keycloak. The common values
    # override rewrites this to the Harbor GHCR proxy (kyverno admits Harbor only).
    repository: ghcr.io/constructorfabric/studio-web/cf-studio-keycloak
    tag: ""                # REQUIRED when enabled: the infra-v* release tag
  # Public issuer hostname (needs DNS + TLS). Empty disables the IdP ingress.
  hostname: ""             # same public hostname as Studio; Keycloak uses /auth
  # Existing Secret for the Keycloak role/database in the shared Studio
  # PostgreSQL cluster (host/port/dbname/username/password).
  db:
    existingSecret: "keycloak-postgres-app"
    keys:
      host: host
      port: port
      database: dbname
      username: username
      password: password
  # Ceiling on Keycloak's own connection pool. Its default is 100, which is the
  # whole server's ceiling by itself; see the connection budget documented on
  # `pg_main` in studio-backend/config/k8s.yaml.
  dbPoolMaxSize: 10
  # Bootstrap (master realm) admin — sealed Secret with keys username/password.
  adminSecret: "studio-web-keycloak-admin"
  # Complete environment-specific realm JSON. The public image contains no
  # realm; this Secret is required and must contain key `realm-studio.json`.
  realmSecret: "studio-web-keycloak-realm"
  # files-plaintext vault Secret (social client id/secret), mounted read-only at
  # /opt/keycloak/data/vault; keys are studio_<provider>-client-id/secret.
  vaultSecret: "studio-web-keycloak-vault"
  # IdP host ingress: cert-manager annotations + TLS come from the override.
  ingress:
    annotations: {}
    tls: []
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    # 500m, measured: a 24-hour peak of 0.010 CPU, so this is still fifty times
    # the observed load. Not lower, because Keycloak's CPU cost is password
    # hashing on sign-in — a burst that a quiet day does not show, and the one
    # moment a person is watching a spinner.
    #
    # Memory is untouched at 1Gi: it sits at 64% of it, which is a working set
    # rather than slack.
    limits: { cpu: 500m, memory: 1Gi }
  podDisruptionBudget:
    enabled: true
