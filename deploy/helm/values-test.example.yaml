global:
  hostname: studio-test.cfabric.org
  environmentName: test
  environmentType: test

backend:
  # Who administers this environment, as Keycloak subject ids in ITS realm.
  # A subject id is per-installation, so this value cannot be shared with
  # another environment — this is `admin` in the studio realm of studio-test.cfabric.org.
  platformAdmins: "00208b90-b311-443c-ad82-383778d7dcbe"
  image:
    tag: "sha-REPLACE_ME"
  replicas: 1
  rollingUpdate: { maxUnavailable: 1, maxSurge: 0 }
  # As on dev (values-dev.example.yaml says why): with the chart's 1Gi the
  # backend was OOM-killed on test (2026-10-27) while a new organization's
  # domain model was seeded; idle it sits near 700Mi.
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { cpu: "2", memory: 4Gi }
  # ACCEPTED: this is a deploy outage window. One replica, and the old pod is
  # stopped before the new one starts, so the API is unavailable for the length
  # of a boot on every deploy. Two things keep it that way and neither is a
  # setting here: the chart refuses a second backend replica while IDE sessions
  # are on, and `studio-events` fans out in-process, so a second replica would
  # deliver events to whichever half of the users happened to land on it.
  #
  # What the chart now does is make the window as short as a boot and free of
  # side effects — `startupBudgetSeconds` stops a slow migration being read as
  # a crash, and `preStopDrainSeconds` stops the overlap being served as 502s.
  database:
    existingSecret: studio-postgres-app
    keys:
      host: host
      port: port
      user: username
      password: password
      dbname: dbname
  bootstrap:
    # Dedicated CNPG-managed role with CREATEDB; never reuse this credential
    # in the backend Deployment.
    existingSecret: studio-postgres-bootstrap
    keys:
      host: host
      port: port
      user: username
      password: password
      dbname: dbname
  autoscaling:
    enabled: false
  sessions:
    enabled: false
  # Metrics ON: this cluster has the collector (deploy/observability) and the
  # OTLP receiver has been listening since it was installed. RED per
  # `http.route` is what the 5xx and latency alerts read; without it they have
  # Traefik's edge view only, which cannot separate an API call from an hour
  # long SSE stream.
  #
  # Tracing stays off: there is no Tempo, and spans with nowhere to go are a
  # batch processor filling up and dropping them.
  telemetry:
    metrics: true
    tracing: false
  configOverride:
    existingConfigMap: ""
  idpAdmin:
    baseUrl: "https://studio-test.cfabric.org/auth"
  fileStorage:
    enabled: true
    s3:
      bucket: test-webstudio

frontend:
  image:
    tag: "sha-REPLACE_ME"
  replicas: 2
  rollingUpdate: { maxUnavailable: 1, maxSurge: 0 }
  # Two replicas, and `maxUnavailable: 1, maxSurge: 0` therefore rolls with one
  # always serving: zero-downtime deploys for the portal at no surge capacity,
  # which matters on a stand that runs at CPU quota with sessions active. The
  # second pod costs 50m/64Mi and also lets a node drain proceed — the
  # PodDisruptionBudget renders only above one replica.
  autoscaling:
    enabled: false

frontendPrototype:
  enabled: true
  hostname: studio-test-poc.cfabric.org
  image:
    tag: "sha-REPLACE_ME"
  rollingUpdate: { maxUnavailable: 1, maxSurge: 0 }

keycloak:
  enabled: true
  replicas: 2
  hostname: studio-test.cfabric.org
  relativePath: /auth
  image:
    tag: "sha-REPLACE_ME"

ingress:
  enabled: true
  className: traefik

# Studio owns this namespace too, and it is the bigger of the two: keep the
# ceilings it already has rather than inheriting the dev sizing, which would
# quietly halve them. Measured before writing these down (2026-09-18):
# limits 16 CPU / 32Gi, requests 8 CPU / 16Gi, 100 pods, 30 services.
#
# limits.cpu 16 with a ~4 CPU platform baseline is six concurrent sessions
# plus one terminating, at 2 CPU each.
capacity:
  enabled: true
  limits:
    cpu: 16
    memory: 32Gi
  requests:
    cpu: 8
    memory: 16Gi
    storage: 200Gi
  counts:
    pods: 100
    services: 30
    persistentVolumeClaims: 20
    configMaps: 150
    secrets: 150
