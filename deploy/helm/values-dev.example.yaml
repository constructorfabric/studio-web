global:
  hostname: studio-dev.cfabric.org
  environmentName: dev
  environmentType: dev

backend:
  image:
    tag: "sha-REPLACE_ME"
  replicas: 1
  # Dev commonly runs at CPU quota while IDE session Pods are active. Replace
  # the single replica in place instead of requiring temporary surge capacity.
  rollingUpdate: { maxUnavailable: 1, maxSurge: 0 }
  database:
    existingSecret: studio-postgres-app
    keys:
      host: host
      port: port
      user: username
      password: password
      dbname: dbname
  bootstrap:
    # Dedicated CNPG-managed role with CREATEDB; never reuse this credential
    # in the backend Deployment.
    existingSecret: studio-postgres-bootstrap
    keys:
      host: host
      port: port
      user: username
      password: password
      dbname: dbname
  autoscaling:
    enabled: false
  sessions:
    enabled: true
    # GitHub's studio-deployer cannot and must not administer RBAC. The
    # namespace-scoped session Role/RoleBinding is bootstrapped once by an
    # administrator (deploy/README.md).
    rbac:
      create: false
    # Dev projects may use arbitrary Git hosts. Test/prod should keep the
    # policy enabled and list approved provider CIDRs explicitly.
    networkPolicy:
      enabled: false
  configOverride:
    existingConfigMap: ""
  idpAdmin:
    baseUrl: "https://studio-dev.cfabric.org/auth"
  fileStorage:
    enabled: true
    s3:
      bucket: dev-webstudio

frontend:
  image:
    tag: "sha-REPLACE_ME"
  replicas: 1
  rollingUpdate: { maxUnavailable: 1, maxSurge: 0 }
  autoscaling:
    enabled: false

frontendPrototype:
  enabled: true
  hostname: studio-dev-poc.cfabric.org
  image:
    tag: "sha-REPLACE_ME"
  rollingUpdate: { maxUnavailable: 1, maxSurge: 0 }

keycloak:
  enabled: true
  replicas: 1
  hostname: studio-dev.cfabric.org
  relativePath: /auth
  image:
    tag: "sha-REPLACE_ME"

ingress:
  enabled: true
  className: traefik

# OFF, and not because the numbers are wrong.
#
# Studio owns this namespace, but owning it is not the same as being allowed to
# write its quota. The `studio-deployer` ServiceAccount these workflows run as
# has no `patch` on `resourcequotas` or `limitranges`, and by design must not be
# able to grant itself any — so the chart renders both objects and the deploy's
# server-side dry-run refuses them:
#
#   resourcequotas "studio-dev" is forbidden: User
#   "system:serviceaccount:studio-dev:studio-deployer" cannot patch resource
#   "resourcequotas" in API group "" in the namespace "studio-dev"
#
# That is every Deploy Services run to dev stopping at validation. It stops
# safely — the dry-run runs before `helm upgrade`, so nothing is half-applied —
# but it stops.
#
# The ceiling itself does not disappear while this is off: the hand-applied
# ResourceQuota and LimitRange that predate the chart are still in the namespace
# and still enforced. What is missing is git describing them, which is what
# turning this on was for.
#
# Turn it back on in the same change as the one-time Role an administrator
# applies — see "Namespace capacity" in deploy/README.md. The numbers and the
# arithmetic behind them are in the chart's own values.yaml; this only turns
# them on. Four concurrent IDE sessions plus one on its way out.
capacity:
  enabled: false
