global:
  hostname: studio-dev.cfabric.org
  environmentName: dev
  environmentType: dev

backend:
  # Who administers this environment, as Keycloak subject ids in ITS realm.
  # A subject id is per-installation, so this value cannot be shared with
  # another environment — this is `admin` in the studio realm of studio-dev.cfabric.org.
  platformAdmins: "46ac15da-3618-4fd2-9a8e-67699228c132"
  # The gear catalogue in the IDE's Building mode. The corpus is the fork
  # branch that carries gear.gdl descriptors until
  # constructorfabric/gears-rust#4793 merges; named here so dev does not
  # silently follow a change of the code's default.
  gearbox:
    enabled: true
    corpusUrl: "https://github.com/MikeFalcon77/gears-rust.git"
    corpusRef: "feature/gearbox"
  image:
    tag: "sha-REPLACE_ME"
  replicas: 1
  # Dev commonly runs at CPU quota while IDE session Pods are active. Replace
  # the single replica in place instead of requiring temporary surge capacity.
  rollingUpdate: { maxUnavailable: 1, maxSurge: 0 }
  # ACCEPTED: this is a deploy outage window. One replica, and the old pod is
  # stopped before the new one starts, so the API is unavailable for the length
  # of a boot on every deploy. Two things keep it that way and neither is a
  # setting here: the chart refuses a second backend replica while IDE sessions
  # are on, and `studio-events` fans out in-process, so a second replica would
  # deliver events to whichever half of the users happened to land on it.
  #
  # What the chart now does is make the window as short as a boot and free of
  # side effects — `startupBudgetSeconds` stops a slow migration being read as
  # a crash, and `preStopDrainSeconds` stops the overlap being served as 502s.
  database:
    existingSecret: studio-postgres-app
    keys:
      host: host
      port: port
      user: username
      password: password
      dbname: dbname
  bootstrap:
    # Dedicated CNPG-managed role with CREATEDB; never reuse this credential
    # in the backend Deployment.
    existingSecret: studio-postgres-bootstrap
    keys:
      host: host
      port: port
      user: username
      password: password
      dbname: dbname
  autoscaling:
    enabled: false
  sessions:
    enabled: true
    # GitHub's studio-deployer cannot and must not administer RBAC. The
    # namespace-scoped session Role/RoleBinding is bootstrapped once by an
    # administrator (deploy/README.md).
    rbac:
      create: false
    # Dev projects may use arbitrary Git hosts. Test/prod should keep the
    # policy enabled and list approved provider CIDRs explicitly.
    networkPolicy:
      enabled: false
  # Metrics ON: this cluster has the collector (deploy/observability) and the
  # OTLP receiver has been listening since it was installed. RED per
  # `http.route` is what the 5xx and latency alerts read; without it they have
  # Traefik's edge view only, which cannot separate an API call from an hour
  # long SSE stream.
  #
  # Tracing stays off: there is no Tempo, and spans with nowhere to go are a
  # batch processor filling up and dropping them.
  telemetry:
    metrics: true
    tracing: false
  configOverride:
    existingConfigMap: ""
  idpAdmin:
    baseUrl: "https://studio-dev.cfabric.org/auth"
  fileStorage:
    enabled: true
    s3:
      bucket: dev-webstudio

frontend:
  image:
    tag: "sha-REPLACE_ME"
  replicas: 2
  rollingUpdate: { maxUnavailable: 1, maxSurge: 0 }
  # Two replicas, and `maxUnavailable: 1, maxSurge: 0` therefore rolls with one
  # always serving: zero-downtime deploys for the portal at no surge capacity,
  # which matters on a stand that runs at CPU quota with sessions active. The
  # second pod costs 50m/64Mi and also lets a node drain proceed — the
  # PodDisruptionBudget renders only above one replica.
  autoscaling:
    enabled: false

frontendPrototype:
  enabled: true
  hostname: studio-dev-poc.cfabric.org
  image:
    tag: "sha-REPLACE_ME"
  rollingUpdate: { maxUnavailable: 1, maxSurge: 0 }

keycloak:
  enabled: true
  replicas: 1
  hostname: studio-dev.cfabric.org
  relativePath: /auth
  image:
    tag: "sha-REPLACE_ME"

ingress:
  enabled: true
  className: traefik

# OFF, and not because the numbers are wrong.
#
# Studio owns this namespace, but owning it is not the same as being allowed to
# write its quota. The `studio-deployer` ServiceAccount these workflows run as
# has no `patch` on `resourcequotas` or `limitranges`, and by design must not be
# able to grant itself any — so the chart renders both objects and the deploy's
# server-side dry-run refuses them:
#
#   resourcequotas "studio-dev" is forbidden: User
#   "system:serviceaccount:studio-dev:studio-deployer" cannot patch resource
#   "resourcequotas" in API group "" in the namespace "studio-dev"
#
# That is every Deploy Services run to dev stopping at validation. It stops
# safely — the dry-run runs before `helm upgrade`, so nothing is half-applied —
# but it stops.
#
# The ceiling itself does not disappear while this is off: the hand-applied
# ResourceQuota and LimitRange that predate the chart are still in the namespace
# and still enforced. What is missing is git describing them, which is what
# turning this on was for.
#
# Turn it back on in the same change as the one-time Role an administrator
# applies — see "Namespace capacity" in deploy/README.md. The numbers and the
# arithmetic behind them are in the chart's own values.yaml; this only turns
# them on. Four concurrent IDE sessions plus one on its way out.
capacity:
  enabled: false
