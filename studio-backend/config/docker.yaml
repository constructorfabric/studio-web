# Constructor Studio Backend — in-Docker profile (one-click compose).
# Differences from postgres.yaml: DB host is the compose service name, the
# HTTP server binds 0.0.0.0 so the frontend (nginx) container can reach it,
# and login goes through the compose Keycloak (oidc-authn-plugin) rather than
# static tokens. config/oidc.yaml is the same idea for a backend running on
# the HOST — it differs only in where Keycloak and Postgres live.

server:
  home_dir: "~/.cf-studio-backend"

database:
  # NB: this does NOT create missing Postgres databases, despite what it sounds
  # like — toolkit-db only consults it to create SQLite parent directories
  # (manager.rs, finalize_sqlite_paths). Postgres databases come from
  # docker/initdb/01-create-databases.sql, which runs once on an empty volume.
  auto_provision: true
  servers:
    # Single Postgres for the whole assembly (Variant B): the graph-postgres
    # image (PostgreSQL 19 + pgvector) hosts every gear database AND graph_storage
    # as separate databases on one instance. Both aliases below point at the same
    # server so gears keep their `server:` unchanged; they differ only in the
    # admin/default dbname. NB: PG19 is beta — this consolidates all data onto it
    # on purpose (see the graph-postgres service in docker-compose.yml).
    pg_main:
      engine: "postgres"
      host: "graph-postgres"
      port: 5432
      user: "studio"
      password: "${STUDIO_PG_PASSWORD}"
      dbname: "studio"            # admin/default db; gears override per-gear below
      pool:
        max_conns: 10
        acquire_timeout: "30s"

    # Same physical instance as pg_main; the graph-storage gear keeps its own
    # `server: pg_graph` and its `graph_storage` database (where the vector /
    # PROPERTY GRAPH / HNSW migrations run).
    pg_graph:
      engine: "postgres"
      host: "graph-postgres"
      port: 5432
      user: "studio"
      password: "${STUDIO_PG_PASSWORD}"
      dbname: "graph_storage"
      pool:
        max_conns: 10
        acquire_timeout: "30s"

logging:
  default:
    console_level: info
    file: "logs/studio-backend.log"
    file_level: info
  account_management:
    console_level: debug
    file: "logs/account-management.log"
    file_level: debug

gears:
  # Wrapper over the external spec-quality detector service (bloat / purpose /
  # leak / traceability). The service has its OWN bearer secret; it lives here
  # (env STUDIO_SPEC_QUALITY_API_KEY) and never reaches the browser. Unset key
  # = analysis calls 500 with a clear message; the backend still boots.
  studio-spec-quality:
    config:
      base_url: "https://349ddd50986c491c844d92fdaefcadfe.constructor.pro"
      api_key_env: "STUDIO_SPEC_QUALITY_API_KEY"

  api-gateway:
    config:
      bind_addr: "0.0.0.0:8090"
      prefix_path: "/cf"
      enable_docs: true
      cors_enabled: false
      openapi:
        title: "Constructor Studio Backend (docker)"
        version: "0.1.0"
        description: "Studio backend assembly — account-management demo"

  gear-orchestrator:
    config: {}

  grpc-hub:
    config:
      listen_addr: "uds:///tmp/cf-studio-backend-grpc"

  authn-resolver:
    config:
      vendor: "constructorfabric"

  # Kept configured but DEPRIORITIZED: this profile logs in through Keycloak
  # (oidc-authn-plugin, priority 100 below). The authn resolver picks exactly
  # ONE plugin per vendor, so the portal's "Developer sign-in (static token)"
  # does not work here — run the backend against config/postgres.yaml or
  # config/dev.yaml if you want the token path instead.
  static-authn-plugin:
    config:
      vendor: "constructorfabric"
      priority: 1000   # LOWER number wins; oidc (100) is in charge here
      mode: static_tokens
      tokens:
        - token: "studio-admin-token"
          identity:
            subject_id: "00000000-0000-0000-0000-00000000a001"
            subject_tenant_id: "00000000-0000-0000-0000-000000000001"
            token_scopes: ["*"]
            subject_type: "gts.cf.core.security.subject_user.v1~"
        - token: "studio-user-token"
          identity:
            subject_id: "ac6ae8e2-b765-541b-8ecd-405addfaef21"
            subject_tenant_id: "00000000-0000-0000-0000-000000000001"
            token_scopes: ["*"]
            subject_type: "gts.cf.core.security.subject_user.v1~"
      s2s_credentials:
        # Explicit identity: without it the plugin's built-in default tenant id
        # is used, which does not exist in OUR tenant tree -> the AM tenant-
        # resolver plugin fails OAGW hierarchy resolution (TenantNotFound).
        - client_id: "mini-chat"
          client_secret: "mini-chat-dev-secret"
          identity:
            subject_id: "00000000-0000-0000-0000-00000000b001"
            subject_tenant_id: "00000000-0000-0000-0000-000000000001"
            token_scopes: ["*"]
            subject_type: "gts.cf.core.security.subject_user.v1~"

  authz-resolver:
    config:
      vendor: "constructorfabric"

  static-authz-plugin:
    config:
      vendor: "constructorfabric"
      priority: 100

  tenant-resolver:
    config:
      vendor: "constructorfabric"

  types-registry:
    database:
      server: "pg_main"
      dbname: "studio_types_registry"
    config:
      entities:
        - "$id": "gts://gts.cf.core.am.tenant_type.v1~cf.core.am.platform.v1~"
          "$schema": "http://json-schema.org/draft-07/schema#"
          description: "Platform root tenant type (root-only)"
          type: "object"
          x-gts-traits:
            allowed_parent_types: []
            idp_provisioning: false
        - "$id": "gts://gts.cf.core.am.tenant_type.v1~cf.studio.tenant.organization.v1~"
          "$schema": "http://json-schema.org/draft-07/schema#"
          description: "Studio organization tenant"
          type: "object"
          x-gts-traits:
            allowed_parent_types: ["gts.cf.core.am.tenant_type.v1~cf.core.am.platform.v1~"]
            idp_provisioning: false
        - "$id": "gts://gts.cf.core.am.tenant_type.v1~cf.studio.tenant.workspace.v1~"
          "$schema": "http://json-schema.org/draft-07/schema#"
          description: "Studio workspace tenant (product-line context)"
          type: "object"
          x-gts-traits:
            allowed_parent_types: ["gts.cf.core.am.tenant_type.v1~cf.studio.tenant.organization.v1~"]
            idp_provisioning: false
        # Studio project tenant: a project is its own codebase context (sources,
        # IDE session, artifact graph, spec-quality) — all of which are already
        # tenant-scoped, so the id of this tenant is what the session/ingest/
        # settings paths key on.
        #
        # Two allowed parents, not one. The portal's New project wizard has no
        # workspace field (ADR-0010) and creates under the organization the
        # session is in; workspace stays allowed so the Org → Workspace →
        # Project shape remains available and already-seeded trees keep working.
        - "$id": "gts://gts.cf.core.am.tenant_type.v1~cf.studio.tenant.project.v1~"
          "$schema": "http://json-schema.org/draft-07/schema#"
          description: "Studio project tenant (a codebase context inside an organization or a workspace)"
          type: "object"
          x-gts-traits:
            allowed_parent_types:
              - "gts.cf.core.am.tenant_type.v1~cf.studio.tenant.organization.v1~"
              - "gts.cf.core.am.tenant_type.v1~cf.studio.tenant.workspace.v1~"
            idp_provisioning: false
        # Connector driver contract (see oidc.yaml for the rationale).
        - "$id": "gts://gts.cf.toolkit.plugins.plugin.v1~cf.studio.connector.plugin.v1~"
          "$schema": "http://json-schema.org/draft-07/schema#"
          description: "Studio source connector provider plugin specification"
          type: "object"
        - "$id": "gts://gts.cf.core.am.tenant_metadata.v1~cf.studio.connector.catalogue.v1~"
          "$schema": "http://json-schema.org/draft-07/schema#"
          description: "Studio source connections (free-form until gears issue #4)"
          type: "object"
          x-gts-traits:
            # inherit: a workspace sees its organization's connections.
            # The nearest row wins whole (AM does not merge across the
            # chain), so a tenant with its own catalogue shadows its
            # ancestors rather than adding to them.
            inheritance_policy: "inherit"
        - "$id": "gts://gts.cf.core.am.tenant_metadata.v1~cf.studio.workspace.settings.v1~"
          # Free-form payload: the GTS OP#12 narrowing check treats the base
          # tenant_metadata envelope as a CLOSED empty object, so a derived
          # schema may not declare typed properties at all (gears issue #4).
          # Shape {automation_level, approved_worker_categories} is enforced
          # client-side until the base schema is relaxed upstream.
          "$schema": "http://json-schema.org/draft-07/schema#"
          description: "Studio workspace settings (free-form until gears issue #4)"
          type: "object"
          x-gts-traits:
            inheritance_policy: "override_only"
        - "$id": "gts://gts.cf.core.am.tenant_metadata.v1~cf.studio.project.config.v1~"
          # Project attributes on the project tenant: {mode, stages[], status,
          # source}. Free-form for the same gears issue #4 reason as the settings
          # above; shape enforced client-side. Per-tenant (not inherited).
          "$schema": "http://json-schema.org/draft-07/schema#"
          description: "Studio project attributes (mode, stages, status, source) — free-form until gears issue #4"
          type: "object"
          x-gts-traits:
            inheritance_policy: "override_only"
        - "$id": "gts://gts.cf.core.am.tenant_metadata.v1~cf.studio.project.kit_installations.v1~"
          "$schema": "http://json-schema.org/draft-07/schema#"
          description: "Desired Constructor Studio kit installations for one project"
          type: "object"
          x-gts-traits:
            inheritance_policy: "override_only"
        - "$id": "gts://gts.cf.core.am.tenant_metadata.v1~cf.studio.access.config.v1~"
          # Organization access config (ADR-0006): {model, roles[]}. Free-form
          # object like workspace.settings; shape enforced client-side until the
          # base tenant_metadata schema is relaxed upstream (gears issue #4).
          "$schema": "http://json-schema.org/draft-07/schema#"
          description: "Studio organization access model + roles (free-form)"
          type: "object"
          x-gts-traits:
            inheritance_policy: "inherit"

  nodes-registry:
    database:
      server: "pg_main"
      dbname: "studio_nodes_registry"
    config: {}

  resource-group:
    database:
      server: "pg_main"
      dbname: "studio_resource_group"
    config: {}

  account-management:
    database:
      server: "pg_main"
      dbname: "studio_account_management"
    config:
      bootstrap:
        root_id: "00000000-0000-0000-0000-000000000001"
        root_name: "Constructor Platform"
        root_tenant_type: "gts.cf.core.am.tenant_type.v1~cf.core.am.platform.v1~"
        strict: true
        # Bind the platform-root tenant to the shared `studio` realm at bootstrap.
        # AM forwards this verbatim as the root IdP `provision_tenant` metadata
        # (WireMetadata): mode defaults to "shared", realm_name is required for a
        # root target. The plugin then persists a TenantIdpMetadataV1 on the root,
        # and EVERY descendant (org -> workspace -> project) inherits `studio`
        # through parent_context -- so user ops (invite/list) resolve a realm
        # instead of failing "tenant has no persisted IdP metadata".
        # deny_unknown_fields on WireMetadata: only mode/realm_name/admin_user_id
        # are permitted keys here.
        root_tenant_metadata:
          realm_name: "studio"
      # Select the official Keycloak IdP plugin. ROLLBACK to the linked static
      # echo IdP: set vendor "cf" and add `enabled: false` to keycloak-idp-plugin.
      idp:
        vendor: "keycloak"
      tr_plugin:
        enabled: true

  # Official cf-gears-keycloak-idp-plugin — the ONLY IdP plugin configured here
  # (static-idp is linked in the binary but left unconfigured → idle). ACTIVE and
  # fully auto-provisioned.
  # Everything it needs is in the realm import (docker/keycloak/realm-studio.json):
  # the `studio-admin` confidential client (service account) now carries all 7
  # realm-management roles, and studio-portal has the tenant_id/user_type mappers.
  # It reuses that ONE client for both admin tiers over plain HTTP inside the
  # compose network (http://keycloak:8080 → no TLS CA, no master realm, no new
  # secrets), so `docker compose up` activates it with zero manual Keycloak steps.
  #
  # ROLLBACK if the stack misbehaves: add `enabled: false` here and set
  # account-management.idp.vendor back to "cf" (static-idp echo).
  #
  # REALM BINDING (verified against gears-rust main): AM's create_tenant calls
  # idp.provision_tenant for EVERY tenant unconditionally (it does NOT gate on
  # the idp_provisioning trait) and forwards the parent's loaded context. The
  # platform root is bound to `studio` via account-management.bootstrap
  # .root_tenant_metadata above (mode defaults to shared); org -> workspace ->
  # project each inherit `studio` through parent_context. So every user op
  # (invite/list) resolves the shared realm — no per-type idp_provisioning flag
  # and no frontend change required. See docs/keycloak-idp-migration.md.
  # REQUIRES A FRESH DB: tenants provisioned before this binding existed carry
  # no IdP metadata — `docker compose down -v` before the first test.
  keycloak-idp-plugin:
    config:
      vendor: "keycloak"
      priority: 50
      security_context:
        platform_tenant_id: "00000000-0000-0000-0000-000000000001"
      keycloak:
        base_url: "http://keycloak:8080"
        bootstrap_admin:
          # Shared-only mode: assert (GET) the studio realm — no master realm needed.
          realm: "studio"
          client_id: "studio-admin"
          client_secret: "studio-admin-dev-secret"
        realm_admin:
          client_id_default: "studio-admin"
          default_shared_realm_secret: "studio-admin-dev-secret"
      tenant_facade: {}
      user_facade: {}

  # ── Feature gears: per-user settings, files, AI chat ──

  simple-user-settings:
    database:
      server: "pg_main"
      dbname: "studio_settings"
    config:
      max_field_length: 200

  file-storage:
    database:
      server: "pg_main"
      dbname: "studio_file_storage"
    config:
      # Dev-only Ed25519 seed so signed URLs survive restarts (generate your
      # own for any shared environment).
      signing_key_seed: "ej5FEOW2E1emMKbKUNBKALhdHb-VLvLNM-n4FcuDREY"

  # LLM egress chain: mini-chat -> oagw -> provider; secrets via credstore
  oagw:
    config:
      proxy_timeout_secs: 120

  credstore:
    database:
      server: "pg_main"
      dbname: "studio_credstore"
    config:
      vendor: "constructorfabric"

  # ── Persistent credstore value store (issue #66) ──
  # This section is what decides whether secret VALUES survive a restart.
  # credstore selects exactly ONE backend plugin per vendor and the LOWEST
  # priority wins (toolkit::plugins::choose_plugin_instance), so at 50 this
  # gear displaces static-credstore-plugin (100) outright — there is no chain
  # and no fallback between the two.
  #
  # Values are sealed with AES-256-GCM under STUDIO_CREDSTORE_KEY (base64,
  # 32 bytes -> `openssl rand -base64 32`). The key is deliberately NOT in this
  # file: it arrives via the env var named by key_env below, and a literal key
  # here would travel in the image and show up in --print-config.
  #
  # Key unset      -> WARN, this gear stands down, static-credstore-plugin wins
  #                   again and you get the pre-#66 behaviour (values die with
  #                   the process) instead of a failed boot.
  # Key malformed  -> boot fails loudly, because degrading quietly would only
  #                   surface as lost secrets after the next restart.
  # Key changed    -> old rows no longer decrypt and read as absent; they are
  #                   re-sealed on the next write (bootstrap at boot, or the
  #                   user re-entering a token).
  studio-documents:
    database:
      server: "pg_main"
      dbname: "studio_documents"

  studio-credstore-pg:
    database:
      server: "pg_main"
      # Own database: the values live apart from credstore's metadata rows.
      #
      # It must EXIST before the first boot — `auto_provision` above does NOT
      # create Postgres databases (see the note next to it). A fresh volume
      # gets it from docker/initdb/01-create-databases.sql; on a volume that
      # already exists, create it once by hand:
      #   docker compose exec -T graph-postgres psql -U studio -d studio -c 'CREATE DATABASE studio_credstore_values OWNER studio;'
      dbname: "studio_credstore_values"
    config:
      vendor: "constructorfabric"         # must equal credstore.vendor above
      priority: 50                        # LOWER wins; the static plugin below is 100
      key_env: "STUDIO_CREDSTORE_KEY"

  # FALLBACK ONLY. While studio-credstore-pg above is registered, this plugin
  # loses the vendor selection and the entries below are unreachable. It stays
  # configured so a deployment with no STUDIO_CREDSTORE_KEY still boots.
  static-credstore-plugin:
    config:
      vendor: "constructorfabric"
      priority: 100
      secrets:
        # These declare the references; the VALUES come from the environment
        # via studio-secrets-bootstrap (STUDIO_LLM_API_KEY /
        # STUDIO_ANTHROPIC_API_KEY), which re-PUTs them on every start.
        #
        # Keep the values empty even though the whole file IS env-expanded at
        # load since #65: studio-secrets-bootstrap stays the single seeding
        # path, and a key baked into the effective config would also show up
        # in --print-config. Empty is the honest "not configured yet".
        - key: "openai-key"
          value: ""
        # Anthropic key for the Claude Code agent in IDE sessions. Not
        # OpenAI-compatible: the agent calls Anthropic directly.
        - key: "anthropic-key"
          value: ""

  mini-chat:
    database:
      server: "pg_main"
      dbname: "studio_mini_chat"
    config:
      client_credentials:
        client_id: "mini-chat"
        client_secret: "mini-chat-dev-secret"
      providers:
        openai:
          kind: openai_responses
          storage_kind: openai
          host: "api.openai.com"
          auth_plugin_type: "gts.cf.core.oagw.auth_plugin.v1~cf.core.oagw.apikey.v1"
          auth_config:
            header: "Authorization"
            prefix: "Bearer "
            secret_ref: "openai-key"

  static-mini-chat-model-policy-plugin:
    config:
      vendor: "constructorfabric"
      priority: 100
      model_catalog:
        - id: "gpt-5.2"
          provider_model_id: "gpt-5.2"
          display_name: "GPT-5.2"
          tier: Standard
          enabled: true
          system_prompt: "You are the Constructor Studio workspace assistant. Be concise and practical."
          thread_summary_prompt: ""
          input_tokens_credit_multiplier_micro: 1000000
          output_tokens_credit_multiplier_micro: 3000000
          multimodal_capabilities: ["VISION_INPUT"]
          context_window: 128000
          max_output_tokens: 8192
          max_input_tokens: 120000
          description: "Default Studio assistant model"
          version: "2025-01"
          icon: ""
          provider_display_name: "OpenAI"
          multiplier_display: "1x"
          provider_id: "openai"
          max_num_results: 10
          max_tool_calls: 2
          estimation_budgets:
            bytes_per_token_conservative: 4
            fixed_overhead_tokens: 500
            safety_margin_pct: 10
            image_token_budget: 1000
            tool_surcharge_tokens: 200
            web_search_surcharge_tokens: 500
            code_interpreter_surcharge_tokens: 1000
            minimal_generation_floor: 100
          preference:
            is_default: true
            sort_order: 1
          general_config:
            type: "chat"
            available_from: "2025-01-01T00:00:00Z"
            max_file_size_mb: 50
            api_params:
              temperature: 0.7
              top_p: 1.0
              frequency_penalty: 0.0
              presence_penalty: 0.0
              stop: []
            features:
              streaming: true
              structured_output: true
            tool_support:
              web_search: false
              file_search: false
              image_generation: false
              code_interpreter: false
              mcp: false
            supported_endpoints:
              chat_completions: true
              responses: true
              embeddings: false
              image_generation: false
              audio_speech_generation: false
              audio_transcription: false
              audio_translation: false

  # ── Studio's own gear: per-workspace Theia IDE sessions in containers ──
  # In-docker profile: the backend container needs /var/run/docker.sock
  # mounted, and workspaces_root must be a HOST path that is mounted into
  # this container at the same location (see docker-compose.yml).
  # Re-seeds the references declared above from the environment on every start.
  # With studio-credstore-pg active the values already survive a restart, so
  # this is normally a no-op that logs "secret accessible — no heal needed". It
  # is still the ONLY source for openai-key / anthropic-key: on a first boot,
  # after STUDIO_CREDSTORE_KEY changes (old rows stop decrypting and read as
  # absent), and whenever the persistent store stands down and the in-memory
  # fallback takes over.
  studio-secrets-bootstrap:
    config:
      secrets:
        - ref: "openai-key"
          value_env: "STUDIO_LLM_API_KEY"
          sharing: "shared"
        - ref: "anthropic-key"
          value_env: "STUDIO_ANTHROPIC_API_KEY"
          sharing: "shared"

  # Projects (ADR-0005 studio-project gear) retired: a project is now an AM
  # tenant (type cf.studio.tenant.project.v1~) and its attributes live in the
  # cf.studio.project.config.v1~ tenant metadata, so there is no separate
  # project gear or studio_projects database.

  # ── ADR-0010: backend <-> Theia bridge ──
  # Dormant unless enabled. With this on, the ingress mounts and the event sink
  # (LoggingEventSink here) logs every forwarded Theia event. Requires the
  # backend built `--features theia-bridge` (see docker-compose.yml).
  studio-theia:
    config:
      enabled: true

  studio-session:
    config:
      # Locally-built Theia image that carries studio-event-forwarder.ts (the
      # ghcr `edge` tag predates it). Build it first:
      #   docker build -f theia/Dockerfile -t cf-studio-theia:local theia
      image: "cf-studio-theia:local"
      always_pull: false
      workspaces_root: "/srv/cf-studio-workspaces"
      bind_host: "127.0.0.1"
      public_host: "localhost"
      port_range_start: 41000
      port_range_end: 41099
      max_session_secs: 14400
      git_mode: "disabled"
      # ADR-0010: mint the per-session S2S control token and inject
      # STUDIO_THEIA_S2S_TOKEN + STUDIO_GATEWAY_URL into the session container,
      # so the forwarder self-arms and the studio-theia gear can dial the node.
      theia_control_enabled: true
      # The backend runs in a container; session containers publish their ports
      # on the HOST, so 127.0.0.1 would be the backend itself. Reach siblings
      # via the host gateway (Docker Desktop provides this name automatically).
      control_reach_host: "host.docker.internal"

  # OpenAI-compatible endpoint the IDE's built-in Theia AI talks to (the
  # in-container chat, not the Codex/Claude Code agents — those call their
  # providers directly). Without this section the gear logs "upstream not
  # (fully) configured" and in-IDE AI stays off, which is exactly what the
  # docker profile did until now. Same upstream as oidc.yaml/k8s.yaml.
  studio-llm-proxy:
    config:
      base_url: "https://api.groq.com/openai/v1"
      model: "llama-3.3-70b-versatile"
      developer_message_settings: "system"    # safest across providers
      api_key_env: "STUDIO_LLM_API_KEY"

  # Real login: validates the JWTs the portal obtains from the compose
  # Keycloak. Wins the vendor selection here (100 < static's 1000).
  #
  # The two URLs below are deliberately different hosts for the SAME server.
  # Keycloak mints tokens with `iss: https://localhost:8443/realms/studio`
  # (KC_HOSTNAME — what the browser must be able to reach), but inside this
  # container `localhost` is the backend itself, so discovery and JWKS have
  # to go to the compose service name. `discovery_url` exists for exactly
  # this split; without it the plugin would derive the discovery base from
  # `iss` and try to fetch its own port. The dev certificate covers both
  # names (SAN: DNS:localhost, DNS:keycloak, IP:127.0.0.1).
  oidc-authn-plugin:
    config:
      vendor: "constructorfabric"
      priority: 100    # LOWER number wins vendor selection
      jwt:
        supported_algorithms: ["RS256", "ES256"]
        require_audience: false
        trusted_issuers:
          - issuer: "https://localhost:8443/realms/studio"
            discovery_url: "https://keycloak:8443/realms/studio"
        claim_mapping:
          subject_id: "sub"              # Keycloak user id (UUID)
          subject_tenant_id: "tenant_id" # user attribute -> claim (realm import)
          token_scopes: "scope"
        first_party_clients:
          - "studio-portal"
      # The plugin refuses plain http for IdP endpoints, so dev Keycloak runs
      # TLS with a self-signed chain; docker-compose.yml mounts its CA here.
      http_client:
        custom_ca_certificate_paths:
          - "/app/certs/dev-ca.pem"
      s2s_oauth:
        # mini-chat exchanges client credentials against the same realm —
        # backend-to-Keycloak, so the service name again.
        discovery_url: "https://keycloak:8443/realms/studio"
        default_subject_type: "gts.cf.core.security.subject_service.v1~"

  # Knowledge graph: typed multi-tenant nodes and edges, bounded traversal and
  # hybrid retrieval. Pinned to `pg_graph` (PostgreSQL 19) by the block above;
  # it cannot run on the main server.
  graph-storage:
    database:
      server: "pg_graph"
      dbname: "graph_storage"
    config:
      # `pgq` runs each hop as a single SQL/PGQ `GRAPH_TABLE` statement. A
      # request whose scope cannot be bounded to a set of tenants is served by
      # `two_query` instead, so this is safe to leave on; `two_query` is the
      # portable fallback and `cte` is deliberately absent while the pinned
      # gears-rust revision predates the safe-CTE API it needs.
      traversal_hop: pgq
      # The deployment's single embedding space: 384-wide, fixed at migration
      # time, and ONE provider computes every vector in it. `onnx` runs the
      # MiniLM model from the models volume in this process; `remote` calls an
      # OpenAI-compatible /embeddings endpoint (the key stays in the process
      # environment, named here, never written into this file); `fake` is a
      # deterministic hash for exercising the write path. Switching providers
      # over a populated graph blocks vector search until it is re-embedded.
      embedding_dimension: 384
      embedding_provider: "${STUDIO_EMBEDDING_PROVIDER:-onnx}"
      embedding_model_path: "/app/models/minilm/model.onnx"
      embedding_tokenizer_path: "/app/models/minilm/tokenizer.json"
      embedding_remote_base_url: "${STUDIO_EMBED_BASE_URL:-https://api.openai.com/v1}"
      embedding_remote_model: "${STUDIO_EMBED_MODEL:-text-embedding-3-small}"
      embedding_remote_api_key_env: "STUDIO_EMBED_API_KEY"
