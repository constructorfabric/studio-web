# Constructor Studio Backend — Kubernetes profile.
# oidc.yaml parameterized for cluster deployment: every environment-specific
# value comes from the environment (wired by the Helm chart from Secrets):
#   STUDIO_PG_HOST / STUDIO_PG_USER / STUDIO_PG_PASSWORD / STUDIO_PG_DBNAME
#   STUDIO_OIDC_ISSUER                 (IdP realm URL, real TLS)
#   STUDIO_IDP_ADMIN_BASE_URL / STUDIO_IDP_ADMIN_SECRET   (REQUIRED for user
#     provisioning: the official keycloak-idp-plugin is active — see its block
#     below; add `enabled: false` there + idp.vendor "cf" to run without invites)
#   STUDIO_LLM_API_KEY / STUDIO_LLM_HOST / STUDIO_LLM_BASE_URL / STUDIO_LLM_MODEL
#   STUDIO_FS_SIGNING_SEED             (URL-signing key, per environment)
# IDE sessions are DISABLED here (studio-session.enabled=false): the Docker
# driver needs /var/run/docker.sock; the k8s Pod driver is a future ADR-0003
# step. NB: Postgres port is fixed at 5432 (integer field — no env expansion);
# override via APP__database__servers__pg_main__port if ever needed.
server:
  home_dir: "~/.cf-studio-backend"

database:
  # NB: this does NOT create missing Postgres databases, despite what it sounds
  # like — toolkit-db only consults it to create SQLite parent directories
  # (manager.rs, finalize_sqlite_paths). Postgres databases come from
  # docker/initdb/01-create-databases.sql, which runs once on an empty volume.
  auto_provision: true
  servers:
    pg_main:
      engine: "postgres"
      host: "${STUDIO_PG_HOST}"
      port: 5432
      user: "${STUDIO_PG_USER}"
      password: "${STUDIO_PG_PASSWORD}"
      dbname: "${STUDIO_PG_DBNAME}"  # admin/default db; gears override per-gear below
      pool:
        max_conns: 10
        acquire_timeout: "30s"

    # Same CloudNativePG instance as pg_main, but a distinct logical database.
    # The graph-enabled release requires PostgreSQL 19 SQL/PGQ and pgvector.
    pg_graph:
      engine: "postgres"
      host: "${STUDIO_PG_HOST}"
      port: 5432
      user: "${STUDIO_PG_USER}"
      password: "${STUDIO_PG_PASSWORD}"
      dbname: "graph_storage"
      pool:
        max_conns: 10
        acquire_timeout: "30s"

logging:
  default:
    console_level: info
    file: "logs/studio-backend.log"
    file_level: info
  account_management:
    console_level: debug
    file: "logs/account-management.log"
    file_level: debug

gears:
  # Wrapper over the external spec-quality detector service (bloat / purpose /
  # leak / traceability). The service has its OWN bearer secret; it lives here
  # (env STUDIO_SPEC_QUALITY_API_KEY) and never reaches the browser. Unset key
  # = analysis calls 500 with a clear message; the backend still boots.
  studio-spec-quality:
    config:
      base_url: "https://349ddd50986c491c844d92fdaefcadfe.constructor.pro"
      api_key_env: "STUDIO_SPEC_QUALITY_API_KEY"

  api-gateway:
    config:
      # 0.0.0.0: session containers reach the gateway via
      # host.docker.internal (the gate's /studio-api/* bridge); auth is
      # enforced by the oidc plugin on every request either way.
      bind_addr: "0.0.0.0:8090"
      prefix_path: "/cf"
      enable_docs: true
      cors_enabled: false
      openapi:
        title: "Constructor Studio Backend (k8s)"
        version: "0.1.0"
        description: "Studio backend assembly — account-management demo"

  gear-orchestrator:
    config: {}

  grpc-hub:
    config:
      listen_addr: "uds:///tmp/cf-studio-backend-grpc"

  authn-resolver:
    config:
      vendor: "constructorfabric"

  # Real login: validates JWTs issued by the Keycloak from docker-compose
  # (docker compose up -d keycloak). One authn plugin per vendor wins by
  # priority — this profile simply does not configure static-authn-plugin
  # (linked but inactive). The plugin enforces https for IdP endpoints, so
  # dev Keycloak runs TLS with a self-signed cert; its CA is trusted below.
  oidc-authn-plugin:
    config:
      vendor: "constructorfabric"
      priority: 100
      jwt:
        supported_algorithms: ["RS256", "ES256"]
        require_audience: false
        trusted_issuers:
          - issuer: "${STUDIO_OIDC_ISSUER}"
        claim_mapping:
          subject_id: "sub"              # Keycloak user id (UUID)
          subject_tenant_id: "tenant_id" # user attribute -> claim (realm import)
          token_scopes: "scope"
        first_party_clients:
          - "studio-portal"
      http_client:
        # Cluster IdP terminates real TLS; add CA paths here only for
        # private-CA environments.
        custom_ca_certificate_paths: []
      s2s_oauth:
        # mini-chat exchanges client credentials against the same realm
        # (confidential client "mini-chat", secret mini-chat-dev-secret,
        # hardcoded tenant_id claim — see docker/keycloak/realm-studio.json).
        discovery_url: "${STUDIO_OIDC_ISSUER}"
        default_subject_type: "gts.cf.core.security.subject_service.v1~"

  authz-resolver:
    config:
      vendor: "constructorfabric"

  static-authz-plugin:
    config:
      vendor: "constructorfabric"
      priority: 100

  tenant-resolver:
    config:
      vendor: "constructorfabric"

  types-registry:
    database:
      server: "pg_main"
      dbname: "studio_types_registry"
    config:
      entities:
        - "$id": "gts://gts.cf.core.am.tenant_type.v1~cf.core.am.platform.v1~"
          "$schema": "http://json-schema.org/draft-07/schema#"
          description: "Platform root tenant type (root-only)"
          type: "object"
          x-gts-traits:
            allowed_parent_types: []
            idp_provisioning: false
        - "$id": "gts://gts.cf.core.am.tenant_type.v1~cf.studio.tenant.organization.v1~"
          "$schema": "http://json-schema.org/draft-07/schema#"
          description: "Studio organization tenant"
          type: "object"
          x-gts-traits:
            allowed_parent_types: ["gts.cf.core.am.tenant_type.v1~cf.core.am.platform.v1~"]
            idp_provisioning: false
        - "$id": "gts://gts.cf.core.am.tenant_type.v1~cf.studio.tenant.workspace.v1~"
          "$schema": "http://json-schema.org/draft-07/schema#"
          description: "Studio workspace tenant (product-line context)"
          type: "object"
          x-gts-traits:
            allowed_parent_types: ["gts.cf.core.am.tenant_type.v1~cf.studio.tenant.organization.v1~"]
            idp_provisioning: false
        # Studio project tenant: a project is its own codebase context (sources,
        # IDE session, artifact graph, spec-quality) — all of which are already
        # tenant-scoped, so the id of this tenant is what the session/ingest/
        # settings paths key on.
        #
        # Two allowed parents, not one. The portal's New project wizard has no
        # workspace field (ADR-0010) and creates under the organization the
        # session is in; workspace stays allowed so the Org → Workspace →
        # Project shape remains available and already-seeded trees keep working.
        - "$id": "gts://gts.cf.core.am.tenant_type.v1~cf.studio.tenant.project.v1~"
          "$schema": "http://json-schema.org/draft-07/schema#"
          description: "Studio project tenant (a codebase context inside an organization or a workspace)"
          type: "object"
          x-gts-traits:
            allowed_parent_types:
              - "gts.cf.core.am.tenant_type.v1~cf.studio.tenant.organization.v1~"
              - "gts.cf.core.am.tenant_type.v1~cf.studio.tenant.workspace.v1~"
            idp_provisioning: false
        # Connector driver contract (see oidc.yaml for the rationale).
        - "$id": "gts://gts.cf.toolkit.plugins.plugin.v1~cf.studio.connector.plugin.v1~"
          "$schema": "http://json-schema.org/draft-07/schema#"
          description: "Studio source connector provider plugin specification"
          type: "object"
        - "$id": "gts://gts.cf.core.am.tenant_metadata.v1~cf.studio.connector.catalogue.v1~"
          "$schema": "http://json-schema.org/draft-07/schema#"
          description: "Studio source connections (free-form until gears issue #4)"
          type: "object"
          x-gts-traits:
            # inherit: a workspace sees its organization's connections.
            # The nearest row wins whole (AM does not merge across the
            # chain), so a tenant with its own catalogue shadows its
            # ancestors rather than adding to them.
            inheritance_policy: "inherit"
        - "$id": "gts://gts.cf.core.am.tenant_metadata.v1~cf.studio.workspace.settings.v1~"
          # Free-form payload: the GTS OP#12 narrowing check treats the base
          # tenant_metadata envelope as a CLOSED empty object, so a derived
          # schema may not declare typed properties at all (gears issue #4).
          # Shape {automation_level, approved_worker_categories} is enforced
          # client-side until the base schema is relaxed upstream.
          "$schema": "http://json-schema.org/draft-07/schema#"
          description: "Studio workspace settings (free-form until gears issue #4)"
          type: "object"
          x-gts-traits:
            inheritance_policy: "override_only"
        - "$id": "gts://gts.cf.core.am.tenant_metadata.v1~cf.studio.project.config.v1~"
          # Project attributes on the project tenant: {mode, stages[], status,
          # source}. Free-form for the same gears issue #4 reason as the settings
          # above; shape enforced client-side. Per-tenant (not inherited) —
          # a project must not read its parent's attributes as its own.
          "$schema": "http://json-schema.org/draft-07/schema#"
          description: "Studio project attributes (mode, stages, status, source) — free-form until gears issue #4"
          type: "object"
          x-gts-traits:
            inheritance_policy: "override_only"
        - "$id": "gts://gts.cf.core.am.tenant_metadata.v1~cf.studio.access.config.v1~"
          # Organization access config (ADR-0006): {model, roles[]}. Free-form
          # object like workspace.settings; shape enforced client-side until the
          # base tenant_metadata schema is relaxed upstream (gears issue #4).
          "$schema": "http://json-schema.org/draft-07/schema#"
          description: "Studio organization access model + roles (free-form)"
          type: "object"
          x-gts-traits:
            inheritance_policy: "inherit"

  nodes-registry:
    database:
      server: "pg_main"
      dbname: "studio_nodes_registry"
    config: {}

  resource-group:
    database:
      server: "pg_main"
      dbname: "studio_resource_group"
    config: {}

  account-management:
    database:
      server: "pg_main"
      dbname: "studio_account_management"
    config:
      bootstrap:
        root_id: "00000000-0000-0000-0000-000000000001"
        root_name: "Constructor Platform"
        root_tenant_type: "gts.cf.core.am.tenant_type.v1~cf.core.am.platform.v1~"
        strict: true
        # Bind the platform root to the shared `studio` realm; descendants inherit
        # it via parent_context (full rationale in docker.yaml). The realm must
        # exist in the target Keycloak. Only takes effect on a fresh AM database.
        root_tenant_metadata:
          realm_name: "studio"
      # Select the official Keycloak IdP plugin.
      idp:
        vendor: "keycloak"
      tr_plugin:
        enabled: true

  # Official cf-gears-keycloak-idp-plugin — real user provisioning for the k8s
  # deploy. ACTIVE (AM idp.vendor: "keycloak"). REQUIRES a reachable Keycloak with
  # a `studio` realm and a `studio-admin` service-account client carrying the
  # realm-management roles. Set in the deploy:
  #   STUDIO_IDP_ADMIN_BASE_URL   admin API base, e.g. https://idp.example.com
  #                               (must be TLS-trusted by the pod's system roots)
  #   STUDIO_IDP_ADMIN_SECRET     the studio-admin client secret
  #
  # BEHAVIOUR CHANGE vs the former in-crate plugin: this one does NOT self-disable
  # on a missing secret — if STUDIO_IDP_ADMIN_BASE_URL is unset the config load
  # fails loudly (empty URL), and if Keycloak is unreachable the admin pre-warm
  # fails and boot aborts. To run this deploy WITHOUT invites, add `enabled: false`
  # under config below and set account-management.idp.vendor back to "cf" (the
  # linked static echo IdP). See docs/keycloak-idp-migration.md.
  keycloak-idp-plugin:
    config:
      vendor: "keycloak"
      priority: 50
      security_context:
        platform_tenant_id: "00000000-0000-0000-0000-000000000001"
      keycloak:
        base_url: "${STUDIO_IDP_ADMIN_BASE_URL}"
        bootstrap_admin:
          realm: "studio"
          client_id: "studio-admin"
          client_secret: "${STUDIO_IDP_ADMIN_SECRET}"
        realm_admin:
          client_id_default: "studio-admin"
          default_shared_realm_secret: "${STUDIO_IDP_ADMIN_SECRET}"
      tenant_facade: {}
      user_facade: {}

  # ── Feature gears: per-user settings, files, AI chat ──

  simple-user-settings:
    database:
      server: "pg_main"
      dbname: "studio_settings"
    config:
      max_field_length: 200

  file-storage:
    database:
      server: "pg_main"
      dbname: "studio_file_storage"
    config:
      # Dev-only Ed25519 seed so signed URLs survive restarts (generate your
      # own for any shared environment).
      signing_key_seed: "${STUDIO_FS_SIGNING_SEED}"

  # LLM egress chain: mini-chat -> oagw -> provider; secrets via credstore
  oagw:
    config:
      proxy_timeout_secs: 120

  credstore:
    database:
      server: "pg_main"
      dbname: "studio_credstore"
    config:
      vendor: "constructorfabric"

  # ── Persistent credstore value store (issue #66) ──
  # This section is what decides whether secret VALUES survive a restart.
  # credstore selects exactly ONE backend plugin per vendor and the LOWEST
  # priority wins (toolkit::plugins::choose_plugin_instance), so at 50 this
  # gear displaces static-credstore-plugin (100) outright — there is no chain
  # and no fallback between the two.
  #
  # Values are sealed with AES-256-GCM under STUDIO_CREDSTORE_KEY (base64,
  # 32 bytes -> `openssl rand -base64 32`). The key is deliberately NOT in this
  # file: it arrives via the env var named by key_env below, and a literal key
  # here would travel in the image and show up in --print-config.
  #
  # Key unset      -> WARN, this gear stands down, static-credstore-plugin wins
  #                   again and you get the pre-#66 behaviour (values die with
  #                   the process) instead of a failed boot.
  # Key malformed  -> boot fails loudly, because degrading quietly would only
  #                   surface as lost secrets after the next restart.
  # Key changed    -> old rows no longer decrypt and read as absent; they are
  #                   re-sealed on the next write (bootstrap at boot, or the
  #                   user re-entering a token).
  studio-credstore-pg:
    database:
      server: "pg_main"
      # Own database: the values live apart from credstore's metadata rows.
      #
      # It must EXIST before the first boot — `auto_provision` above does NOT
      # create Postgres databases (see the note next to it). A fresh volume
      # gets it from docker/initdb/01-create-databases.sql; on a volume that
      # already exists, create it once by hand:
      #   kubectl exec -i postgres-0 -- psql -U studio -d studio -c 'CREATE DATABASE studio_credstore_values OWNER studio;'
      dbname: "studio_credstore_values"
    config:
      vendor: "constructorfabric"         # must equal credstore.vendor above
      priority: 50                        # LOWER wins; the static plugin below is 100
      key_env: "STUDIO_CREDSTORE_KEY"

  # FALLBACK ONLY. While studio-credstore-pg above is registered, this plugin
  # loses the vendor selection and the entries below are unreachable. It stays
  # configured so a deployment with no STUDIO_CREDSTORE_KEY still boots.
  static-credstore-plugin:
    config:
      vendor: "constructorfabric"
      priority: 100
      secrets:
        # Shared secret (no tenant_id) with the LLM provider key for the
        # Ask AI feature; without it chats are created but streaming replies
        # fail at the provider with 401.
        # The key comes from the environment, never from the file. Free
        # default is Groq: console.groq.com → API Keys (no card needed):
        #   export STUDIO_LLM_API_KEY=gsk_...  (before cargo run)
        - key: "openai-key"
          value: "${STUDIO_LLM_API_KEY:-}"
        # Anthropic key for the Claude Code agent in IDE sessions.
        # Not OpenAI-compatible: the agent calls Anthropic directly,
        # it never goes through studio-llm-proxy. Unset = agent off.
        - key: "anthropic-key"
          value: "${STUDIO_ANTHROPIC_API_KEY:-}"

  mini-chat:
    database:
      server: "pg_main"
      dbname: "studio_mini_chat"
    config:
      client_credentials:
        client_id: "mini-chat"
        client_secret: "${STUDIO_OIDC_S2S_CLIENT_SECRET:-mini-chat-dev-secret}"
      providers:
        # Any OpenAI-compatible /chat/completions provider. Defaults to
        # Groq's free tier (same key as the studio-llm-proxy above). Host
        # comes from STUDIO_LLM_HOST (hostname only — OAGW builds the URL).
        # NB when switching providers: api_path is a literal (no env
        # expansion) — adjust it together with the host (plain providers
        # use /v1/chat/completions; Groq nests under /openai). For OpenAI's
        # Responses API instead: kind openai_responses.
        openai:
          kind: openai_chat_completions
          storage_kind: openai
          host: "${STUDIO_LLM_HOST:-api.groq.com}"
          api_path: "/openai/v1/chat/completions"
          auth_plugin_type: "gts.cf.core.oagw.auth_plugin.v1~cf.core.oagw.apikey.v1"
          auth_config:
            header: "Authorization"
            prefix: "Bearer "
            secret_ref: "openai-key"

  static-mini-chat-model-policy-plugin:
    config:
      vendor: "constructorfabric"
      priority: 100
      model_catalog:
        # NB: provider_model_id is a literal model name. Keep it in sync
        # with the provider configured above / STUDIO_LLM_HOST.
        - id: "studio-default"
          provider_model_id: "llama-3.3-70b-versatile"
          display_name: "Studio assistant"
          tier: Standard
          enabled: true
          system_prompt: "You are the Constructor Studio workspace assistant. Be concise and practical."
          thread_summary_prompt: ""
          input_tokens_credit_multiplier_micro: 1000000
          output_tokens_credit_multiplier_micro: 3000000
          multimodal_capabilities: ["VISION_INPUT"]
          context_window: 128000
          max_output_tokens: 8192
          max_input_tokens: 120000
          description: "Default Studio assistant model"
          version: "2025-01"
          icon: ""
          provider_display_name: "Groq (free tier)"
          multiplier_display: "1x"
          provider_id: "openai"
          max_num_results: 10
          max_tool_calls: 2
          estimation_budgets:
            bytes_per_token_conservative: 4
            fixed_overhead_tokens: 500
            safety_margin_pct: 10
            image_token_budget: 1000
            tool_surcharge_tokens: 200
            web_search_surcharge_tokens: 500
            code_interpreter_surcharge_tokens: 1000
            minimal_generation_floor: 100
          preference:
            is_default: true
            sort_order: 1
          general_config:
            type: "chat"
            available_from: "2025-01-01T00:00:00Z"
            max_file_size_mb: 50
            api_params:
              temperature: 0.7
              top_p: 1.0
              frequency_penalty: 0.0
              presence_penalty: 0.0
              stop: []
            features:
              streaming: true
              structured_output: true
            tool_support:
              web_search: false
              file_search: false
              image_generation: false
              code_interpreter: false
              mcp: false
            supported_endpoints:
              chat_completions: true
              responses: true
              embeddings: false
              image_generation: false
              audio_speech_generation: false
              audio_transcription: false
              audio_translation: false

  # Knowledge graph: PostgreSQL 19 SQL/PGQ plus pgvector. The release binary is
  # compiled with `--no-default-features --features graph`, so this database
  # must be available before the backend starts.
  graph-storage:
    database:
      server: "pg_graph"
      dbname: "graph_storage"
    config:
      traversal_hop: pgq

  # ── Studio's own gear: per-workspace Theia IDE sessions in containers ──
  # Requires: Docker daemon on the host and the Theia image built once:
  #   cd theia && docker build -t cf-studio-theia:latest .
  # Projects (ADR-0005 studio-project gear) retired: a project is now an AM
  # tenant (type cf.studio.tenant.project.v1~) with its attributes in the
  # cf.studio.project.config.v1~ tenant metadata — no separate project gear.

  studio-session:
    config:
      # IDE sessions via the Kubernetes Pod driver (ADR-0003). Needs the
      # backend Role over pods/services (Helm backend.sessions.enabled=true)
      # and a browser reachable through the /studio proxy.
      enabled: false
      driver: "kubernetes"
      # kyverno on this cluster admits only harbor.constr.dev images, so the
      # session image goes through the ghcr proxy project (same as the backend
      # and frontend). No pull secret needed — Harbor handles the upstream.
      image: "harbor.constr.dev/proxy-ghcr.io/constructorfabric/studio-web/cf-studio-theia:edge"
      # Namespace is auto-detected from the mounted ServiceAccount token;
      # k8s_namespace / k8s_image_pull_secret override only if ever needed.
      git_mode: "disabled"

  # ── Self-heal for config-seeded credstore secrets ──
  # Re-seeds the references declared above from the environment on every start.
  # With studio-credstore-pg active the values already survive a restart, so
  # this is normally a no-op that logs "secret accessible — no heal needed". It
  # is still the ONLY source for openai-key / anthropic-key: on a first boot,
  # after STUDIO_CREDSTORE_KEY changes (old rows stop decrypting and read as
  # absent), and whenever the persistent store stands down and the in-memory
  # fallback takes over.
  studio-secrets-bootstrap:
    config:
      secrets:
        - ref: "openai-key"
          value_env: "STUDIO_LLM_API_KEY"
          sharing: "shared"
        - ref: "anthropic-key"
          value_env: "STUDIO_ANTHROPIC_API_KEY"
          sharing: "shared"

  # This plugin is linked into the binary and therefore must be configured.
  # Keep it empty and deprioritized so OIDC is the only selected AuthN provider.
  static-authn-plugin:
    config:
      vendor: "constructorfabric"
      priority: 1000
      mode: static_tokens
      tokens: []

  # ── OpenAI-compatible LLM proxy for Theia AI inside IDE sessions ──
  # Provider-agnostic gear; this PROFILE defaults to Groq's free tier
  # (console.groq.com → API Keys; free, no card, rate-limited). Env beats
  # YAML, so any other provider is a restart away:
  #   STUDIO_LLM_BASE_URL  e.g. https://api.openai.com/v1, http://localhost:11434/v1
  #   STUDIO_LLM_MODEL     e.g. gpt-4o-mini, qwen2.5-coder
  #   STUDIO_LLM_API_KEY   the provider key (server-side only)
  # The IDE never learns the provider — it reads GET /studio-llm/v1/client-config
  # and authenticates with the user's Studio token; this gear attaches the
  # server-held key upstream.
  studio-llm-proxy:
    config:
      base_url: "https://api.groq.com/openai/v1"
      model: "llama-3.3-70b-versatile"
      developer_message_settings: "system"    # safest across providers
      api_key_env: "STUDIO_LLM_API_KEY"
