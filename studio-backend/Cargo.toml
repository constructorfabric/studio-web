# Constructor Studio Backend — assembly of CF/Gears into the Studio backend server.
# Standalone crate: every gears-rust crate comes from crates.io (see the note on [dependencies]).

[package]
name = "cf-studio-backend"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Constructor Studio backend server assembled from CF/Gears (account-management demo)"

[[bin]]
name = "studio-backend"
path = "src/main.rs"

[features]
# `theia-bridge` links the studio-theia gear (ADR-0022): the
# backend-to-backend bridge to the per-session Theia node backend. Opt-in
# and OFF by default while the control path + studio-session endpoint
# discovery are still being wired, so the default build and CI are
# unaffected until it is compile-verified. Build with `--features theia-bridge`.
theia-bridge = []
# `theia-event-broker` swaps the studio-theia ingress's default StudioEventsSink
# (republishes forwarded Theia events onto studio-events as `theia.<kind>`) for
# the EventBrokerEventSink (republishes them onto the event-broker gear). Implies `theia-bridge` and pulls the SDK. Still opt-in: it
# cannot publish until the broker is linked (cluster + storage backend) and the
# topic/event-type schema are registered. Build with `--features theia-event-broker`.
theia-event-broker = ["theia-bridge", "dep:event-broker-sdk"]
# `llm` pulls in the AI chain: mini-chat, oagw (api_egress) and the in-crate
# studio-llm-proxy. Default ON so `cargo run` / the docker-compose dev build
# get Ask AI and the IDE proxy. The k8s release image drops it: release.yml
# builds `--no-default-features --features graph,theia-bridge`, so `graph` and
# the Theia bridge ARE in the release and only the LLM chain is out. The reason
# is the fresh-boot root-tenant deadlock documented on the mini_chat/api_egress
# dependencies below, not the deployment target — the DMZ justification that
# used to be here is stale, that environment is no longer deployed to (the
# Virtuozzo `studio-dev`/`studio-test` clusters are, via .github/workflows/deploy.yml).
# Turning `llm` back on for a cluster deploy therefore needs the deadlock
# resolved first, plus an LLM key in that environment.
#
# `graph` links the graph-storage gear (`cf-gears-graph-storage`) with both of
# its embedding providers, and the consumers that feed it: the repository
# importer in studio-connector, artifact-ingest and the gears catalogue.
# Default ON: `docker compose up` should give a working knowledge graph. The
# gear runs only on PostgreSQL 19 with pgvector, and its migrations run during
# boot, so a deployment that links it must provision that server first — the
# k8s release does (Deploy Infra's graph PostgreSQL) and builds `--features graph`.
#
# Both providers are compiled in, and the deployment picks one in
# `graph-storage.config.embedding_provider`: `onnx` (a MiniLM model in this
# process; needs ORT_DYLIB_PATH and the model artifacts) or `remote` (an
# OpenAI-compatible /embeddings endpoint; needs a URL, a model and a key).
# One deployment, one provider: switching over a populated graph blocks the
# vector arm until the graph is re-embedded.
default = ["llm", "graph"]
llm = ["dep:mini_chat", "dep:api_egress"]
graph = [
    "dep:graph_storage",
    "dep:graph_storage_sdk",
    "graph_storage/onnx",
    "graph_storage/remote",
]

[dependencies]
# gears-rust crates come from crates.io at the versions release-plz published
# together, and Cargo.lock records exactly what CI and releases build. Normal
# builds use `--locked`. Advance gears deliberately with `cargo update`,
# review/test the result, and commit the updated Cargo.lock; never re-resolve
# dependencies during a release.
mimalloc = "0.1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }

# ── studio-session gear (in-crate; per-workspace Theia IDE containers) ──
bollard = "0.17"
futures-util = "0.3" # image-pull stream in ensure_image
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# RFC-6902 patches: how a model edit records what it did and how to undo it
# (studio-domain-model). Already in the lockfile as a transitive dependency.
json-patch = "4"
serde_yaml = "0.9"
# The roadmap workbook is an .xlsx -- a zip of deflated XML parts. Both are
# already in the lockfile as transitive dependencies.
flate2 = "1"
crc32fast = "1"
tokio-postgres = "0.7"
inventory = "0.3"
tracing = "0.1"
tokio-util = "0.7"
utoipa = "5"
uuid = { version = "1", features = ["serde", "v4", "v5"] }
# Invitation tokens are stored as digests, never as themselves: a read of the
# table must not yield working tokens. Both crates are already in the lockfile
# transitively, so declaring them adds nothing to the build.
sha2 = "0.10"
hex = "0.4"
toolkit-macros = { package = "cf-gears-toolkit-macros", version = "0.6.6" }
credstore-sdk = { package = "cf-gears-credstore-sdk", version = "0.2.17" }
# studio-git authenticates Git's Basic credentials itself (the gateway reads only Bearer).
authn-resolver-sdk = { package = "cf-gears-authn-resolver-sdk", version = "0.3.37" }
# Strict ${VAR} pre-expansion of the config file (#65): the toolkit loader
# reads the YAML verbatim, so placeholders outside DSNs reached the runtime
# as literals. Same expansion the toolkit itself applies to DSNs.
toolkit-utils = { package = "cf-gears-toolkit-utils", version = "0.7.2" }
# studio-connector: GtsTypeId on the account-management metadata boundary.
# Same version gears-rust pins in its workspace manifest.
gts = "0.12"

# ── keycloak-idp-plugin (in-crate; real user provisioning, ADR-0004) ──
# "stream" is for the llm-proxy gear (SSE passthrough to the LLM upstream).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
account-management-sdk = { package = "cf-gears-account-management-sdk", version = "0.7.5" }
toolkit-odata = { package = "cf-gears-toolkit-odata", version = "0.9.7" }
types-registry-sdk = { package = "cf-gears-types-registry-sdk", version = "0.3.9" }
toolkit-security = { package = "cf-gears-toolkit-security", version = "0.11.0" }
# Optional: only pulled in by the `theia-event-broker` feature (ADR-0022
# phase 3). Same gears-rust source as the toolkit crates above.
event-broker-sdk = { package = "cf-gears-event-broker-sdk", version = "0.2.6", optional = true }
# `utoipa` is on for graph-storage: it renders its Problem responses into the
# OpenAPI document.
toolkit-canonical-errors = { package = "cf-gears-toolkit-canonical-errors", version = "0.9.5", features = ["axum", "utoipa"] }

# ── studio-credstore-pg (in-crate; persistent credstore value store, issue #66) ──
# The only value-store plugin CF/Gears ships keeps values in memory, so every
# backend restart lost every secret a user had typed in. This gear stores them
# encrypted in Postgres instead. `pg` + `sqlite` are named explicitly rather
# than left to feature unification from the other gears: this crate is the one
# that decides which engines the assembly can talk to.
toolkit-db = { package = "cf-gears-toolkit-db", version = "0.16.2", features = ["pg", "sqlite"] }
# Entity/migration definitions. Feature set and the runtime-tokio (NOT
# runtime-tokio-rustls) choice mirror the gears-rust workspace manifest: the
# rustls variant would activate `ring` alongside aws-lc-rs and make rustls
# panic when it can no longer auto-detect a single provider.
sea-orm = { version = "2.0", default-features = false, features = [
    "runtime-tokio",
    "with-uuid",
    "with-time",
    "with-json",
    "macros",
] }
time = "0.3"
# AES-256-GCM for values at rest, and the CSPRNG for nonces. Same crypto
# library as the platform's TLS stack and credstore's own value fence, so a
# `--features fips` build routes this through the validated module too.
aws-lc-rs = "1.17"
base64 = "0.22"

# ── studio-project (in-crate; projects with two creation shapes, ADR-0005) ──
# Membership stays on Resource Group per ADR-0002, so the gear needs RG's client.
resource_group_sdk = { package = "cf-gears-resource-group-sdk", version = "0.3.5" }

# ── graph-storage (knowledge-graph gear; behind the `graph` feature) ──
# The gear and its SDK, as crates. Consumers (artifact-ingest, the gears
# catalogue, the repository importer) talk to the gear through the SDK's
# `GraphStorageClientV1` from the ClientHub, exactly as they talk to credstore.
#
# The official crates, published by gears-rust's release-plz since
# constructorfabric/gears-rust#4794 merged; they replace the interim `weftgraph`
# preview crates, whose libraries had the same names. The embedding plugins come
# in through the gear's `onnx` and `remote` features. Every other gears crate
# comes from crates.io too, so there is one toolkit in the binary and no
# `[patch]` block.
#
# NB: this gear runs ONLY against `pg_graph` (PostgreSQL 19 + pgvector) — see
# the graph-postgres service in docker-compose.yml.
graph_storage = { package = "cf-gears-graph-storage", version = "0.1.4", optional = true }
graph_storage_sdk = { package = "cf-gears-graph-storage-sdk", version = "0.1.1", optional = true }

# ── Core toolkit ──
toolkit = { package = "cf-gears-toolkit", version = "0.10.0", features = ["bootstrap"] }

# ── System gears (required set) ──
api_gateway = { package = "cf-gears-api-gateway", version = "0.5.2" }
grpc_hub = { package = "cf-gears-grpc-hub", version = "0.3.2" }
gear_orchestrator = { package = "cf-gears-gear-orchestrator", version = "0.2.3" }
nodes_registry = { package = "cf-gears-nodes-registry", version = "0.1.43" }
types_registry = { package = "cf-gears-types-registry", version = "0.4.0" }
tenant_resolver = { package = "cf-gears-tenant-resolver", version = "0.1.41" }
authn_resolver = { package = "cf-gears-authn-resolver", version = "0.2.37" }
authz_resolver = { package = "cf-gears-authz-resolver", version = "0.2.5" }
authz_resolver_sdk = { package = "cf-gears-authz-resolver-sdk", version = "0.5.2" }
resource_group = { package = "cf-gears-resource-group", version = "0.4.5" }

# ── Dev plugins (static auth for the demo; replace with OIDC for real deployments) ──
static_authn_plugin = { package = "cf-gears-static-authn-plugin", version = "0.3.18" }
# Real login: OIDC JWT validation (used by config/oidc.yaml with Keycloak from compose)
oidc_authn_plugin = { package = "cf-gears-oidc-authn-plugin", version = "0.2.13" }
static_authz_plugin = { package = "cf-gears-static-authz-plugin", version = "0.1.38" }

# ── The gear under demonstration ──
# account-management ships its own Tenant Resolver plugin (src/tr_plugin) in-crate.
account_management = { package = "cf-gears-account-management", version = "0.10.0" }
static_idp_plugin = { package = "cf-gears-static-idp-plugin", version = "0.1.18" }
# Official Keycloak IdP plugin — full tenant/user/service-account lifecycle over
# the Keycloak Admin API. Replaces the in-crate src/keycloak_idp_plugin.rs (which
# is no longer `mod`-ed in main.rs). See docs/keycloak-idp-migration.md.
keycloak_idp_plugin = { package = "cf-gears-keycloak-idp-plugin", version = "0.1.7" }

# ── Feature gears: AI chat, per-user settings, file storage ──
# mini-chat hard-depends on oagw (LLM egress); oagw depends on credstore.
# NB: the static model-policy plugin lives INSIDE the mini-chat crate
# (src/infra/plugins/static_model_policy); the standalone
# gears/mini-chat/plugins/static-model-policy-plugin dir is a leftover
# Cargo.toml with no sources (gears issue candidate #5).
# mini-chat + oagw are gated behind the `llm` feature (default on). oagw's
# post_init provisions the mini-chat upstream under the ROOT tenant, but the
# root is created by account-management's bootstrap saga in its run phase —
# after every gear's post_init. On a fresh database the root does not exist
# yet, so oagw's post_init fails and the boot dies before the saga can seed
# it (a deadlock masked in docker only because the volume already held a root
# from an earlier boot). So the release image leaves the `llm` feature off:
# no LLM chain, no oagw, and the boot reaches the run phase and bootstraps its
# own root. That is the whole reason — it holds for any fresh database, not for
# a particular environment.
mini_chat = { package = "cf-gears-mini-chat", version = "0.4.5", optional = true }
api_egress = { package = "cf-gears-oagw", version = "0.5.5", optional = true }
credstore = { package = "cf-gears-credstore", version = "0.5.2" }
static_credstore_plugin = { package = "cf-gears-static-credstore-plugin", version = "0.2.15" }
simple_user_settings = { package = "cf-gears-simple-user-settings", version = "0.2.5" }
file_storage = { package = "cf-gears-file-storage", version = "0.2.8" }
kube = { version = "4.2.0", default-features = false, features = ["client", "runtime", "rustls-tls"] }
k8s-openapi = { version = "0.28.0", features = ["v1_32"] }
rustls = "0.23.43"
hyper-util = { version = "0.1.20", features = ["client", "client-legacy", "http1", "tokio"] }
http-body-util = "0.1.4"
hyper = { version = "1.11.0", features = ["client", "http1"] }

# ── dev only ────────────────────────────────────────────────────────────────
# studio-documents keeps its tables in PostgreSQL and its tests exercise the
# real migration set against them (ADR-0014). Testcontainers gives each test
# process its own database, which buys two things a shared server does not:
# `cargo test` needs no external setup beyond a Docker daemon, and an EDITED
# migration always re-applies -- against a long-lived database the ledger says
# it already ran, and the test then passes against a stale schema.
# Pinned below the latest on purpose: 0.24 wants a newer `bollard` than the
# `0.17` studio-session depends on, and moving that to satisfy a test harness
# would be the tail wagging the dog.
[dev-dependencies]
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }
# For `atexit`, and for nothing else. The test PostgreSQL lives in a `static`,
# which Rust never drops, so testcontainers' own removal-on-drop never runs --
# see `src/test_pg.rs`. An exit hook is the one place left to stop it, and the
# C runtime's is the only exit hook there is.
libc = "0.2"
