# Constructor Studio Backend — assembly of CF/Gears into the Studio backend server.
# Standalone crate: consumes gears-rust via path dependencies (sibling checkout ../../gears-rust).

[package]
name = "cf-studio-backend"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Constructor Studio backend server assembled from CF/Gears (account-management demo)"

[[bin]]
name = "studio-backend"
path = "src/main.rs"

[features]
# `theia-bridge` links the studio-theia gear (ADR-0010): the
# backend-to-backend bridge to the per-session Theia node backend. Opt-in
# and OFF by default while the control path + studio-session endpoint
# discovery are still being wired, so the default build and CI are
# unaffected until it is compile-verified. Build with `--features theia-bridge`.
theia-bridge = []
# `theia-event-broker` swaps the studio-theia ingress's default LoggingEventSink
# for the real EventBrokerEventSink (republishes forwarded Theia events onto the
# event-broker gear). Implies `theia-bridge` and pulls the SDK. Still opt-in: it
# cannot publish until the broker is linked (cluster + storage backend) and the
# topic/event-type schema are registered. Build with `--features theia-event-broker`.
theia-event-broker = ["theia-bridge", "dep:event-broker-sdk"]
# `llm` pulls in the AI chain: mini-chat, oagw (api_egress) and the in-crate
# studio-llm-proxy. Default ON so `cargo run` / the docker-compose dev build
# get Ask AI and the IDE proxy. The k8s release image is built
# `--no-default-features` (see .github/workflows/release.yml): the DMZ deploy
# has no LLM key and no IDE sessions, and dropping oagw removes the fresh-boot
# root-tenant deadlock documented on the mini_chat/api_egress dependencies.
#
# `graph` links the graph-storage gear (cf-gears-graph-storage) with both of
# its embedding providers, and the consumers that feed it: the repository
# importer in studio-connector, artifact-ingest and the gears catalogue.
# Default ON: `docker compose up` should give a working knowledge graph. The
# gear runs only on PostgreSQL 19 with pgvector, and its migrations run during
# boot, so a deployment that links it must provision that server first — the
# k8s release does (Deploy Infra's graph PostgreSQL) and builds `--features graph`.
#
# Both providers are compiled in, and the deployment picks one in
# `graph-storage.config.embedding_provider`: `onnx` (a MiniLM model in this
# process; needs ORT_DYLIB_PATH and the model artifacts) or `remote` (an
# OpenAI-compatible /embeddings endpoint; needs a URL, a model and a key).
# One deployment, one provider: switching over a populated graph blocks the
# vector arm until the graph is re-embedded.
default = ["llm", "graph"]
llm = ["dep:mini_chat", "dep:api_egress"]
graph = [
    "dep:graph_storage",
    "dep:graph_storage_sdk",
    "graph_storage/onnx",
    "graph_storage/remote",
]

[dependencies]
# gears-rust is declared against its `main` branch, while Cargo.lock records the
# exact reviewed commit used by CI and releases. Normal builds use `--locked`.
# Advance gears deliberately with `cargo update`, review/test the result, and
# commit the updated Cargo.lock; never re-resolve dependencies during a release.
mimalloc = "0.1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }

# ── studio-session gear (in-crate; per-workspace Theia IDE containers) ──
bollard = "0.17"
futures-util = "0.3" # image-pull stream in ensure_image
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio-postgres = "0.7"
inventory = "0.3"
tracing = "0.1"
tokio-util = "0.7"
utoipa = "5"
uuid = { version = "1", features = ["serde", "v4", "v5"] }
toolkit-macros = { package = "cf-gears-toolkit-macros", git = "https://github.com/constructorfabric/gears-rust", branch = "main" }
credstore-sdk = { package = "cf-gears-credstore-sdk", git = "https://github.com/constructorfabric/gears-rust", branch = "main" }
# Strict ${VAR} pre-expansion of the config file (#65): the toolkit loader
# reads the YAML verbatim, so placeholders outside DSNs reached the runtime
# as literals. Same expansion the toolkit itself applies to DSNs.
toolkit-utils = { package = "cf-gears-toolkit-utils", git = "https://github.com/constructorfabric/gears-rust", branch = "main" }
# studio-connector: GtsTypeId on the account-management metadata boundary.
# Same version gears-rust pins in its workspace manifest.
gts = "0.12"

# ── keycloak-idp-plugin (in-crate; real user provisioning, ADR-0004) ──
# "stream" is for the llm-proxy gear (SSE passthrough to the LLM upstream).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
account-management-sdk = { package = "cf-gears-account-management-sdk", git = "https://github.com/constructorfabric/gears-rust", branch = "main" }
toolkit-odata = { package = "cf-gears-toolkit-odata", git = "https://github.com/constructorfabric/gears-rust", branch = "main" }
types-registry-sdk = { package = "cf-gears-types-registry-sdk", git = "https://github.com/constructorfabric/gears-rust", branch = "main" }
toolkit-security = { package = "cf-gears-toolkit-security", git = "https://github.com/constructorfabric/gears-rust", branch = "main" }
# Optional: only pulled in by the `theia-event-broker` feature (ADR-0010
# phase 3). Same gears-rust source as the toolkit crates above.
event-broker-sdk = { package = "cf-gears-event-broker-sdk", git = "https://github.com/constructorfabric/gears-rust", branch = "main", optional = true }
# `utoipa` is on for graph-storage: it renders its Problem responses into the
# OpenAPI document.
toolkit-canonical-errors = { package = "cf-gears-toolkit-canonical-errors", git = "https://github.com/constructorfabric/gears-rust", branch = "main", features = ["axum", "utoipa"] }

# ── studio-credstore-pg (in-crate; persistent credstore value store, issue #66) ──
# The only value-store plugin CF/Gears ships keeps values in memory, so every
# backend restart lost every secret a user had typed in. This gear stores them
# encrypted in Postgres instead. `pg` + `sqlite` are named explicitly rather
# than left to feature unification from the other gears: this crate is the one
# that decides which engines the assembly can talk to.
toolkit-db = { package = "cf-gears-toolkit-db", git = "https://github.com/constructorfabric/gears-rust", branch = "main", features = ["pg", "sqlite"] }
# Entity/migration definitions. Feature set and the runtime-tokio (NOT
# runtime-tokio-rustls) choice mirror the gears-rust workspace manifest: the
# rustls variant would activate `ring` alongside aws-lc-rs and make rustls
# panic when it can no longer auto-detect a single provider.
sea-orm = { version = "2.0", default-features = false, features = [
    "runtime-tokio",
    "with-uuid",
    "with-time",
    "with-json",
    "macros",
] }
time = "0.3"
# AES-256-GCM for values at rest, and the CSPRNG for nonces. Same crypto
# library as the platform's TLS stack and credstore's own value fence, so a
# `--features fips` build routes this through the validated module too.
aws-lc-rs = "1.17"
base64 = "0.22"

# ── studio-project (in-crate; projects with two creation shapes, ADR-0005) ──
# Membership stays on Resource Group per ADR-0002, so the gear needs RG's client.
resource_group_sdk = { package = "cf-gears-resource-group-sdk", git = "https://github.com/constructorfabric/gears-rust", branch = "main" }

# ── graph-storage (knowledge-graph gear; behind the `graph` feature) ──
# The gear and its SDK, as crates. Consumers (artifact-ingest, the gears
# catalogue, the repository importer) talk to the gear through the SDK's
# `GraphStorageClientV1` from the ClientHub, exactly as they talk to credstore.
#
# TEMPORARY SOURCE: the gear is not yet on gears-rust `main` — it needs the
# SQL/PGQ layer of PR #4639, which is still in review — so it is pulled from the
# fork at a release tag, and the `[patch]` block at the end of this file moves
# every other gears-rust crate to the same tag (one toolkit in the binary). When
# the gear lands upstream: change `git`/`tag` here to the constructorfabric
# repository and `branch = "main"`, delete the patch block, `cargo update`, and
# commit the lockfile.
#
# NB: this gear runs ONLY against `pg_graph` (PostgreSQL 19 + pgvector) — see
# the graph-postgres service in docker-compose.yml.
graph_storage = { package = "cf-gears-graph-storage", git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1", optional = true }
graph_storage_sdk = { package = "cf-gears-graph-storage-sdk", git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1", optional = true }

# ── Core toolkit ──
toolkit = { package = "cf-gears-toolkit", git = "https://github.com/constructorfabric/gears-rust", branch = "main", features = ["bootstrap"] }

# ── System gears (required set) ──
api_gateway = { package = "cf-gears-api-gateway", git = "https://github.com/constructorfabric/gears-rust", branch = "main" }
grpc_hub = { package = "cf-gears-grpc-hub", git = "https://github.com/constructorfabric/gears-rust", branch = "main" }
gear_orchestrator = { package = "cf-gears-gear-orchestrator", git = "https://github.com/constructorfabric/gears-rust", branch = "main" }
nodes_registry = { package = "cf-gears-nodes-registry", git = "https://github.com/constructorfabric/gears-rust", branch = "main" }
types_registry = { package = "cf-gears-types-registry", git = "https://github.com/constructorfabric/gears-rust", branch = "main" }
tenant_resolver = { package = "cf-gears-tenant-resolver", git = "https://github.com/constructorfabric/gears-rust", branch = "main" }
authn_resolver = { package = "cf-gears-authn-resolver", git = "https://github.com/constructorfabric/gears-rust", branch = "main" }
authz_resolver = { package = "cf-gears-authz-resolver", git = "https://github.com/constructorfabric/gears-rust", branch = "main" }
authz_resolver_sdk = { package = "cf-gears-authz-resolver-sdk", git = "https://github.com/constructorfabric/gears-rust", branch = "main" }
resource_group = { package = "cf-gears-resource-group", git = "https://github.com/constructorfabric/gears-rust", branch = "main" }

# ── Dev plugins (static auth for the demo; replace with OIDC for real deployments) ──
static_authn_plugin = { package = "cf-gears-static-authn-plugin", git = "https://github.com/constructorfabric/gears-rust", branch = "main" }
# Real login: OIDC JWT validation (used by config/oidc.yaml with Keycloak from compose)
oidc_authn_plugin = { package = "cf-gears-oidc-authn-plugin", git = "https://github.com/constructorfabric/gears-rust", branch = "main" }
static_authz_plugin = { package = "cf-gears-static-authz-plugin", git = "https://github.com/constructorfabric/gears-rust", branch = "main" }

# ── The gear under demonstration ──
# account-management ships its own Tenant Resolver plugin (src/tr_plugin) in-crate.
account_management = { package = "cf-gears-account-management", git = "https://github.com/constructorfabric/gears-rust", branch = "main" }
static_idp_plugin = { package = "cf-gears-static-idp-plugin", git = "https://github.com/constructorfabric/gears-rust", branch = "main" }
# Official Keycloak IdP plugin — full tenant/user/service-account lifecycle over
# the Keycloak Admin API. Replaces the in-crate src/keycloak_idp_plugin.rs (which
# is no longer `mod`-ed in main.rs). See docs/keycloak-idp-migration.md.
keycloak_idp_plugin = { package = "cf-gears-keycloak-idp-plugin", git = "https://github.com/constructorfabric/gears-rust", branch = "main" }

# ── Feature gears: AI chat, per-user settings, file storage ──
# mini-chat hard-depends on oagw (LLM egress); oagw depends on credstore.
# NB: the static model-policy plugin lives INSIDE the mini-chat crate
# (src/infra/plugins/static_model_policy); the standalone
# gears/mini-chat/plugins/static-model-policy-plugin dir is a leftover
# Cargo.toml with no sources (gears issue candidate #5).
# mini-chat + oagw are gated behind the `llm` feature (default on). oagw's
# post_init provisions the mini-chat upstream under the ROOT tenant, but the
# root is created by account-management's bootstrap saga in its run phase —
# after every gear's post_init. On a fresh database the root does not exist
# yet, so oagw's post_init fails and the boot dies before the saga can seed
# it (a deadlock masked in docker only because the volume already held a root
# from an earlier boot). The DMZ deploy ships no LLM key and disables IDE
# sessions, so the release image is built `--no-default-features`: no LLM
# chain, no oagw, the boot reaches the run phase and bootstraps its own root.
mini_chat = { package = "cf-gears-mini-chat", git = "https://github.com/constructorfabric/gears-rust", branch = "main", optional = true }
api_egress = { package = "cf-gears-oagw", git = "https://github.com/constructorfabric/gears-rust", branch = "main", optional = true }
credstore = { package = "cf-gears-credstore", git = "https://github.com/constructorfabric/gears-rust", branch = "main" }
static_credstore_plugin = { package = "cf-gears-static-credstore-plugin", git = "https://github.com/constructorfabric/gears-rust", branch = "main" }
simple_user_settings = { package = "cf-gears-simple-user-settings", git = "https://github.com/constructorfabric/gears-rust", branch = "main" }
file_storage = { package = "cf-gears-file-storage", git = "https://github.com/constructorfabric/gears-rust", branch = "main" }
# File-parser is resolved through its SDK when a compatible parser gear is
# registered by the runtime. Keep the heavy parser implementation out of this
# binary: its current document-parser dependency set does not compile when the
# `quick-xml` encoding feature is unified by Cargo.
file_parser_sdk = { package = "cf-gears-file-parser-sdk", git = "https://github.com/constructorfabric/gears-rust", branch = "main" }
# Needed to hand raw file bytes to the file-parser SDK (ParseBytesRequest.bytes).
bytes = "1"
kube = { version = "4.2.0", default-features = false, features = ["client", "runtime", "rustls-tls"] }
k8s-openapi = { version = "0.28.0", features = ["v1_32"] }
rustls = "0.23.43"
hyper-util = { version = "0.1.20", features = ["client", "client-legacy", "http1", "tokio"] }
http-body-util = "0.1.4"
hyper = { version = "1.11.0", features = ["client", "http1"] }

# ── gears-rust, moved to the fork release that carries graph-storage ─────────
#
# TEMPORARY, until the graph-storage gear (and PR #4639's SQL/PGQ layer it
# needs) is on gears-rust `main`. The gear is pulled from the fork at a release
# tag above; Cargo treats a different git URL as a different source, and two
# copies of the toolkit in one binary do not link — every gears-rust crate this
# assembly resolves is therefore redirected to the same tag. The list is every
# `cf-gears-*` package Cargo.lock records from the gears-rust source; a crate
# missing here would come from upstream `main` and duplicate the toolkit.
#
# Drop this block once the gear is upstream, then `cargo update` the git
# dependencies and commit the lockfile.
[patch."https://github.com/constructorfabric/gears-rust"]
cf-gears-account-management = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
cf-gears-account-management-sdk = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
cf-gears-api-gateway = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
cf-gears-authn-resolver = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
cf-gears-authn-resolver-sdk = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
cf-gears-authz-resolver = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
cf-gears-authz-resolver-sdk = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
cf-gears-credstore = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
cf-gears-credstore-sdk = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
cf-gears-event-broker-sdk = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
cf-gears-file-parser-sdk = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
cf-gears-file-storage = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
cf-gears-file-storage-sdk = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
cf-gears-gear-orchestrator = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
cf-gears-grpc-hub = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
cf-gears-keycloak-idp-plugin = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
cf-gears-mini-chat = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
cf-gears-mini-chat-sdk = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
cf-gears-nodes-registry = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
cf-gears-nodes-registry-sdk = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
cf-gears-oagw = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
cf-gears-oagw-sdk = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
cf-gears-oidc-authn-plugin = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
cf-gears-resource-group = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
cf-gears-resource-group-sdk = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
cf-gears-simple-user-settings = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
cf-gears-simple-user-settings-sdk = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
cf-gears-static-authn-plugin = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
cf-gears-static-authz-plugin = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
cf-gears-static-credstore-plugin = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
cf-gears-static-idp-plugin = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
cf-gears-system-sdk-directory = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
cf-gears-system-sdks = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
cf-gears-tenant-resolver = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
cf-gears-tenant-resolver-sdk = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
cf-gears-toolkit = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
cf-gears-toolkit-auth = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
cf-gears-toolkit-canonical-errors = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
cf-gears-toolkit-canonical-errors-macro = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
cf-gears-toolkit-contract = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
cf-gears-toolkit-contract-macros = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
cf-gears-toolkit-db = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
cf-gears-toolkit-db-macros = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
