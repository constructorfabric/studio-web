cf-gears-toolkit-sdk = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
cf-gears-toolkit-security = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
cf-gears-toolkit-stable-hash = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
cf-gears-toolkit-transport-grpc = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
cf-gears-toolkit-utils = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
cf-gears-types-registry = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
cf-gears-types-registry-sdk = { git = "https://github.com/vasylcf/gears-rust", tag = "cf-gears-graph-storage-v0.1.1" }
