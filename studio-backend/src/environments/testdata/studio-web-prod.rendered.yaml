# Source: studio-web/charts/api-gateway/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studio-web-api-gateway
  labels:
    helm.sh/chart: api-gateway-0.1.0
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/instance: studio-web
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
      app.kubernetes.io/instance: studio-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/instance: studio-web
      annotations:
        checksum/config: 81094934b5ed9d0981887aceaf783007e824c509ac7b6fd2ea4e140400d91569
    spec:
      serviceAccountName: studio-web-api-gateway
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: api-gateway
          image: "gbx-api-gateway:0.1.0"
          imagePullPolicy: IfNotPresent
          command:
            - "gbx-api-gateway"
          args:
            - --config
            - /etc/gearbox/api-gateway.yaml
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          ports:

            - name: grpc
              containerPort: 50051
              protocol: TCP

            - name: rest
              containerPort: 8087
              protocol: TCP

          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: "GEARS_PG_PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: "studio-web-db"
                  key: "GEARS_PG_PASSWORD"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8087
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 1
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8087
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/gearbox/api-gateway.yaml
              subPath: api-gateway.yaml
              readOnly: true
            - name: home
              mountPath: /var/lib/gearbox
      volumes:
        - name: config
          configMap:
            name: studio-web-api-gateway-config
        - name: home
          emptyDir: {}
