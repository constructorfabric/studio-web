# Constructor Studio artifacts registry

# The 1129 `@cpt-frontx-*` markers in this repository arrived with the FrontX
# codebase; the artifacts they name (`cpt-frontx-algo-*`, `-flow-*`, `-dod-*`)
# live in constructorfabric/gears-frontx and are not vendored here. Validating
# them locally would report every one of them as dangling and drown the signal
# from artifacts this repository actually owns.
#
# Ignored, not deleted: the markers are correct where they came from, and if
# gears-frontx is ever added as a workspace source this block is what comes out.
[[ignore]]
reason = "FrontX-owned markers; their artifacts live in constructorfabric/gears-frontx, not here"
patterns = [
  "packages/**",
  "scripts/**",
  "vitest.setup.ts",
  "vitest.shared.ts",
  "__tests__/**",
  "src/**",
  # Copied verbatim from the _blank-mfe template into every MFE.
  "src-app/mfe_packages/*/vite.config.ts",
  "src-app/mfe_packages/*/vitest.config.ts",
  "src-app/mfe_packages/*/src/init.ts",
  # Copied verbatim too, and their markers name a FrontX-owned DoD.
  "src-app/mfe_packages/*/src/api/_BlankApiService.test.ts",
  "src-app/mfe_packages/*/src/api/mocks.test.ts",
  "src-app/mfe_packages/*/src/shared/useScreenTranslations.test.tsx",
  # The shell files that came with the template and still carry only its
  # markers. The rest of `src-app/app` is this repository's and is in scope.
  "src-app/app/actions/**",
  "src-app/app/effects/bootstrapEffects.ts",
  "src-app/app/mfe/MfeScreenContainer.tsx",
  "src-app/app/mfe/bootstrap.ts",
  "src-app/app/themes/**",
]

[[systems]]
name = "StudioFrontend"
slug = "studiofrontend"
kit = "sdlc"
children = []
# Only the MFEs this repository wrote are in scope. The rest carries FrontX
# markers whose artifacts live elsewhere (see the ignore block above), so
# widening this would measure coverage against specs this repository does not own.
codebase = [
  { path = "src-app/mfe_packages/projects-mfe/src", extensions = [".ts", ".tsx"] },
  # The shell, in scope since the workspace feature: the workspace list, the
  # slot that shows it and the property that publishes it are the shell's, so
  # the markers of `workspace-scope` live here as well as in the MFE.
  { path = "src-app/app", extensions = [".ts", ".tsx"] },
  { path = "src-app/mfe_packages/connections-mfe/src", extensions = [".ts", ".tsx"] },
  # In scope since the organization level got real screens: the workspaces list
  # and the overview carry the markers of `workspaces-screen` and
  # `organization-overview`.
  { path = "src-app/mfe_packages/organization-mfe/src", extensions = [".ts", ".tsx"] },
  # What both of the above share, extracted rather than copied. In scope because
  # the code that moved there carries markers of its own — `organization.tsx`
  # implements the org-scope DoD of both features.
  { path = "src-app/mfe_packages/shared/src", extensions = [".ts", ".tsx"] },
]

# Artifacts this repository owns live under docs/sdlc/. Deliberately narrow:
# only FEATURE is registered, and only the projects MFE's code is in scope.
#
# `docs/adr/` is NOT registered on purpose. Those five ADRs (and ADR-0010) use
# the repository's own lightweight format — `## Context` / `## Decision` /
# `## Consequences` — while the sdlc kit's ADR constraints require the MADR
# outline (`Context and Problem Statement`, `Decision Drivers`, `Considered
# Options`, …). Registering them would fail every existing ADR against a
# convention the repository never adopted. They stay readable by
# `cfs where-used` regardless: each carries its own `**ID**: cpt-…` line.
[[systems.autodetect]]
kit = "sdlc"
system_root = "{project_root}"
artifacts_root = "docs/sdlc"

[systems.autodetect.artifacts.FEATURE]
pattern = "FEATURE/*.md"
traceability = "FULL"
required = false
