# Constructor Studio — one-click dev environment.
#
#   Full stack (postgres + keycloak + backend built from source + frontend):
#     docker compose up --build -d
#     → portal:  http://localhost:8080   ("Continue with Constructor ID",
#                                         admin/studio or demo/studio)
#     → api/docs: http://localhost:8090/cf/docs
#
# Login goes through the bundled Keycloak (config/docker.yaml selects
# oidc-authn-plugin). The browser must accept its self-signed certificate
# once — open https://localhost:8443 and proceed, otherwise the redirect to
# the IdP dies silently. The portal's "Developer sign-in (static token)" is
# inert in this profile; it belongs to config/dev.yaml and config/postgres.yaml.
#
#   Database only (for a host-run backend):
#     docker compose up -d graph-postgres keycloak
#
# NB: the backend image builds the 90-crate gears workspace — the first
# `--build` takes a while; BuildKit caches make rebuilds fast. No sibling
# checkout is needed — gears-rust is a git dependency pinned in Cargo.toml.

name: studio

services:
  # Variant B: a SINGLE Postgres for the whole assembly. The graph-postgres
  # service below (PostgreSQL 19 + pgvector) is the only database instance —
  # it hosts every gear database AND graph_storage. The former postgres:16
  # service ("studio-backend-pg") was removed; config/docker.yaml now points
  # both server aliases (pg_main, pg_graph) at graph-postgres.

  # OIDC IdP for real login (config/oidc.yaml profile). Dev-grade: self-signed
  # TLS (certs in docker/keycloak/certs, CA trusted by the backend via
  # http_client.custom_ca_certificate_paths), realm imported on start.
  # Admin console: https://localhost:8443 (admin/admin). Realm users:
  # admin/studio, demo/studio. The studio-portal client whitelists both
  # localhost and 127.0.0.1 on :8080 (nginx) and :5173 (vite) — the portal
  # derives redirect_uri from window.location.origin, so opening the same
  # page under a hostname that is not in realm-studio.json fails the login
  # with "Invalid parameter: redirect_uri". NOT started by default `up` of backend+frontend
  # workflows that don't need it — but included in the default profile for
  # one-click friendliness; comment out if unwanted.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7@sha256:ff4257d0d64efbe99ed1ddfaf07765cc3c36dc7518bf8324d41961327f441c54
    container_name: studio-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/certs/keycloak.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/certs/keycloak.key
      KC_HOSTNAME: "https://localhost:8443"
      # Frontchannel URLs (issuer, authorization endpoint) stay on the
      # hostname above — the browser has to reach those. Backchannel URLs
      # (token, JWKS, userinfo) are instead resolved from the Host header of
      # the incoming request, so when the backend container fetches discovery
      # from https://keycloak:8443 it gets endpoints on keycloak:8443 rather
      # than on a localhost that means "myself" inside that container.
      # Requires KC_HOSTNAME to be a full URL, which it is.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # Put the health endpoints back on the MAIN server instead of the
      # management interface. Since Keycloak 25 health lives on the management
      # port (9000), and that interface INHERITS the main server's TLS — with
      # KC_HTTPS_CERTIFICATE_FILE set it comes up as
      # "Management interface listening on https://0.0.0.0:9000" (it says so in
      # the startup log). Keycloak's own docs state that HTTPS endpoints cannot
      # be probed from inside this image, because curl and friends are
      # deliberately removed from it. So health has to be somewhere plaintext,
      # and the main server already has plain HTTP on 8080 via KC_HTTP_ENABLED.
      #
      # This option is deprecated upstream and will go away. When the image is
      # bumped past 26.0, replace it with KC_HTTP_MANAGEMENT_SCHEME: "http"
      # (26.2+) — health stays on 9000 but stops inheriting TLS — and point the
      # probe below back at port 9000.
      KC_LEGACY_OBSERVABILITY_INTERFACE: "true"
    ports:
      - "127.0.0.1:8443:8443"
      # Plain-HTTP admin API for a backend running on the HOST (the `oidc.yaml`
      # dev profile): the keycloak-idp-plugin talks to http://localhost:8088
      # instead of the self-signed :8443. Bound to 127.0.0.1 only. The in-compose
      # backend keeps using http://keycloak:8080 on the internal network.
      - "127.0.0.1:8088:8080"
    volumes:
      - ./docker/keycloak/realm-studio.json:/opt/keycloak/data/import/realm-studio.json:ro
      - ./docker/keycloak/certs:/opt/keycloak/certs:ro
    # No curl in the image (removed upstream on purpose), so this is the bash
    # /dev/tcp form the Keycloak documentation publishes. Port 8080 — plain
    # HTTP on the main server — for the reason spelled out next to
    # KC_LEGACY_OBSERVABILITY_INTERFACE above. The previous version of this
    # probe spoke plaintext to the TLS listener on 9000: the TCP connect
    # succeeded, the response was garbage, and it failed 471 times in a row
    # while Keycloak was entirely healthy.
    #
    # Matching the status line rather than grepping the body for "UP" (HEAD has
    # no body). The version is a character class deliberately: the upstream
    # snippet hardcodes "HTTP/1.0 200", but a server answering an HTTP/1.0
    # request with an HTTP/1.1 status line is both legal and common, and that
    # difference is not worth another silent false negative.
    healthcheck:
      test: ["CMD-SHELL", "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep -qE 'HTTP/1\\.[01] 200'; } 0<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # PostgreSQL 19 + pgvector — the single PostgreSQL instance for local
  # Compose. It hosts application gear databases and graph_storage. PostgreSQL
  # 19 is required for graph-storage's vector, SQL/PGQ and HNSW features.
  graph-postgres:
    build:
      context: studio-backend/docker/graph-postgres
    container_name: studio-graph-pg
    # The single instance for the whole assembly (Variant B). User/db renamed to
    # `studio` so the gear databases (created by the init script) and graph_storage
    # all share one superuser; graph_storage is created by the init script now.
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: ${STUDIO_PG_PASSWORD:-studio}
      POSTGRES_DB: studio
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      # postgres:18+ images keep data in a versioned subdirectory and expect
      # the mount one level up, which also leaves room for pg_upgrade.
      - studio_graph_pg_data:/var/lib/postgresql
      # Per-gear databases + graph_storage, created once on first volume init.
      - ./studio-backend/docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: studio-backend/Dockerfile.src
      # ADR-0010: link the studio-theia gear (backend<->Theia bridge). Additive
      # to the default features (llm + graph). The event sink is LoggingEventSink
      # unless you also build `--features theia-event-broker` (needs event-broker
      # linked), so this profile republishes nothing and needs no broker infra.
      args:
        CARGO_FEATURES: "--features theia-bridge"
    container_name: studio-backend
    # Auto-recover without manual retry: if the backend exits (e.g. it loses
    # postgres/keycloak mid-boot, or a first-boot race) keep restarting it until
    # the healthcheck passes.
    restart: unless-stopped
    environment:
      STUDIO_PG_PASSWORD: ${STUDIO_PG_PASSWORD:-studio}
      # Provider keys. Empty is a valid state: the features that need them
      # stay off and say so, rather than the stack refusing to start.
      #   Ask AI / mini-chat + the Codex agent  -> STUDIO_LLM_API_KEY
      #   the Claude Code agent in IDE sessions -> STUDIO_ANTHROPIC_API_KEY
      STUDIO_LLM_API_KEY: ${STUDIO_LLM_API_KEY:-}
      STUDIO_ANTHROPIC_API_KEY: ${STUDIO_ANTHROPIC_API_KEY:-}
      # Bearer secret for the external spec-quality detector service. The gear
      # has base_url in config/docker.yaml but reads the KEY from this env var
      # (studio-spec-quality.config.api_key_env); without it the wrapper reports
      # "not configured" and every Spec Quality run fails. Value lives in .env.
      STUDIO_SPEC_QUALITY_API_KEY: ${STUDIO_SPEC_QUALITY_API_KEY:-}
      # Encryption key for credstore secret VALUES at rest (issue #66, base64,
      # 32 bytes). Without it the backend falls back to the in-memory value
      # store and every secret typed into the portal — source PATs, connector
      # tokens — dies with the container on the next restart. Generate it once
      # and keep it: a different key makes the stored values unreadable.
      #   openssl rand -base64 32
      STUDIO_CREDSTORE_KEY: ${STUDIO_CREDSTORE_KEY:-}
      # Knowledge-graph embeddings (graph-storage gear). ONE provider per
      # deployment — switching it over a populated graph blocks vector search
      # until the graph is re-embedded, and the backend says so at boot.
      #   onnx   (default) a MiniLM model in-process, from the models volume
      #                    the `embedding-model` service fills below.
      #   remote           an OpenAI-compatible /embeddings endpoint; set the
      #                    three STUDIO_EMBED_* values in .env. The model must
      #                    return 384-dimensional vectors (text-embedding-3-*
      #                    honour the requested width; a fixed-width model
      #                    needs embedding_dimension changed in the config).
      #   fake             deterministic hash, for exercising the write path.
      STUDIO_EMBEDDING_PROVIDER: ${STUDIO_EMBEDDING_PROVIDER:-onnx}
      STUDIO_EMBED_BASE_URL: ${STUDIO_EMBED_BASE_URL:-https://api.openai.com/v1}
      STUDIO_EMBED_MODEL: ${STUDIO_EMBED_MODEL:-text-embedding-3-small}
      STUDIO_EMBED_API_KEY: ${STUDIO_EMBED_API_KEY:-}
      # The Theia session image lives in a private ghcr repo. The Docker API
      # ignores the CLI credential store, so the gear needs its own pair —
      # without them a session launch fails with a bare "unauthorized".
      STUDIO_REGISTRY_USER: ${STUDIO_REGISTRY_USER:-}
      STUDIO_REGISTRY_TOKEN: ${STUDIO_REGISTRY_TOKEN:-}
      # Read by the container ENTRYPOINT, not by any gear: it makes the
      # bind-mount below writable for the unprivileged server user. Keep it
      # equal to studio-session.workspaces_root in config/docker.yaml and to
      # the bind path below — all three name the same directory.
      # Shared by studio-session AND studio-artifact-ingest: the session gear
      # clones repos into {root}/{workspace_id}/{repo_dir}, and the ingest gear
      # reads those same checkouts to build the artifact graph — one clone.
      STUDIO_WORKSPACES_ROOT: /srv/cf-studio-workspaces
    volumes:
      # studio-session gear: launches sibling Theia containers via the host
      # Docker daemon. The workspaces path must be IDENTICAL on host and in
      # this container — the gear passes it to the daemon as a host path.
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/cf-studio-workspaces:/srv/cf-studio-workspaces
      # CA of the dev Keycloak certificate. The OIDC plugin refuses plain
      # http for IdP endpoints, so the self-signed chain has to be trusted
      # explicitly — the paths are named in overrides.docker/*.yaml.
      - ./docker/keycloak/certs/dev-ca.pem:/app/certs/dev-ca.pem:ro
      # Embedding model artifacts for the graph-storage `onnx` provider, read
      # at /app/models/minilm (config/docker.yaml names the paths). Filled by
      # the `embedding-model` service; the ONNX Runtime library itself is in
      # the image (ORT_DYLIB_PATH), because its version is bound to the code.
      - studio_models:/app/models:ro
    ports:
      - "127.0.0.1:8090:8090"   # direct API + /cf/docs
    depends_on:
      # The single Postgres HAS to be healthy: the backend runs every gear's
      # migrations (and graph-storage's) during boot and exits non-zero if the
      # databases are not reachable.
      graph-postgres:
        condition: service_healthy
      # The `onnx` provider loads its model at boot and fails the boot when the
      # artifacts are missing (deliberately: a graph silently without vectors
      # is the failure the gear exists to prevent). So the fetch has to have
      # finished; on a warm volume it verifies the checksums and exits at once.
      embedding-model:
        condition: service_completed_successfully
      # Keycloak only has to be STARTED, not healthy. Nothing in the backend's
      # init path talks to it: oidc-authn-plugin just builds an HTTP client and
      # registers itself (discovery + JWKS are fetched lazily, on the first
      # token it validates), keycloak-idp-plugin gets its admin token on the
      # first invite, and mini-chat's OAGW provisioning runs in
      # RunnableCapability::start with its own retries. Gating on health only
      # meant that one failing IdP probe took down the entire stack —
      # including the API, which is perfectly usable meanwhile. Login starts
      # working the moment Keycloak is actually ready, with no restart.
      #
      # Keycloak keeps its healthcheck: `docker compose ps` should still tell
      # you the truth about it. Health is for observability here, depends_on
      # is for ordering — conflating the two is what cost an evening.
      keycloak:
        condition: service_started
      # Fresh-DB gate: the no-LLM seeder must seed (and realm-bind) the platform
      # root tenant and exit 0 before the LLM backend starts — otherwise oagw's
      # post_init aborts boot resolving a root that account-management has not
      # seeded yet. On a warm volume the seeder is a fast no-op (seconds).
      backend-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      # /cf/health is the endpoint the gateway actually serves (proven 200);
      # the bare /healthz was never mounted, so the probe stayed red forever and
      # the frontend — gated on `backend healthy` — never started.
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8090/cf/health"]
      interval: 10s
      timeout: 3s
      # Long grace before any failure counts against the backend: a healthy first
      # boot (Rust binary start + migrations + waiting on postgres) is slow, and
      # must not be mistaken for a dead container. During start_period a failing
      # probe neither counts toward retries nor marks the container unhealthy.
      start_period: 180s
      retries: 30

  # Fresh-DB seeder — runs automatically on every `docker compose up`.
  # On a brand-new volume the LLM chain's oagw gear aborts boot in post_init: it
  # needs the platform root tenant, but account-management only seeds it later,
  # in its serve phase. This variant is built --no-default-features, so it has
  # NO oagw (and no graph): it reaches serve, seeds (and realm-binds) the root,
  # then its bootstrap-seed.sh entrypoint exits 0. The main `backend` gates on
  # this via `service_completed_successfully`, so nothing is left running.
  # Idempotent: on a warm volume the root already exists and this exits in seconds.
  backend-bootstrap:
    # Override the image entrypoint: run the backend, wait until the root tenant
    # is seeded (gateway health 200), then exit so the gate above is satisfied.
    entrypoint: ["/usr/local/bin/bootstrap-seed.sh"]
    build:
      context: .
      dockerfile: studio-backend/Dockerfile.src
      args:
        CARGO_FEATURES: "--no-default-features"
    container_name: studio-backend-bootstrap
    restart: "no"
    environment:
      STUDIO_PG_PASSWORD: ${STUDIO_PG_PASSWORD:-studio}
      STUDIO_CREDSTORE_KEY: ${STUDIO_CREDSTORE_KEY:-}
      STUDIO_WORKSPACES_ROOT: /srv/cf-studio-workspaces
    volumes:
      - /srv/cf-studio-workspaces:/srv/cf-studio-workspaces
      - ./docker/keycloak/certs/dev-ca.pem:/app/certs/dev-ca.pem:ro
    depends_on:
      graph-postgres:
        condition: service_healthy
      # The seeder EAGERLY provisions the root tenant into Keycloak (realm-binds
      # it via the keycloak-idp-plugin), so unlike the main backend it must wait
      # for Keycloak to be fully ready — `/health/ready` is green only after the
      # studio realm import completes. Gating on `started` would race the import.
      keycloak:
        condition: service_healthy

  # Embedding model for the graph-storage `onnx` provider — a one-shot fetch
  # into the `studio_models` volume, pinned by SHA-256 (see the script). Runs
  # on every `up`; on a warm volume it only verifies the checksums. The model
  # is deployment data rather than image content so that the same backend
  # image serves the `remote` provider too, and a model swap needs no rebuild.
  # With STUDIO_EMBEDDING_PROVIDER=remote the fetch still runs (it is cheap
  # once cached) and the artifacts simply go unused.
  embedding-model:
    image: curlimages/curl:8.14.1
    container_name: studio-embedding-model
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "/usr/local/bin/fetch-embedding-model.sh"]
    environment:
      MODELS_DIR: /models
    volumes:
      - studio_models:/models
      - ./studio-backend/docker/fetch-embedding-model.sh:/usr/local/bin/fetch-embedding-model.sh:ro

  frontend:
    build:
      context: .
      dockerfile: studio-frontend/Dockerfile.src
    container_name: studio-frontend
    # Wait for the backend to be healthy and restart together with it, so the
    # portal comes up on its own once the backend is ready — no manual start.
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # image is nginx-unprivileged: listens on 8080
    depends_on:
      backend:
        condition: service_healthy
        # Restart the frontend whenever the backend is restarted (compose v2.17+),
        # so a backend recovery brings the portal back without intervention.
        restart: true
    # nginx.conf proxies /cf/ to http://studio-backend:8090 — the service's
    # container_name above must stay in sync with it.

  # Prototype portal — the fast-moving UI (Artifacts, Spec Quality, Overview).
  # Same build pattern as `frontend` (context = repo root); BACKEND_HOST is
  # baked into its image, and nginx proxies /cf/ to the backend. Published on
  # 8081 so it can run alongside the main portal on 8080. Part of the compose
  # project now, so `--remove-orphans` no longer deletes it.
  frontend-prototype:
    build:
      context: .
      dockerfile: studio-frontend-prototype/Dockerfile.src
    container_name: studio-frontend-prototype
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"   # nginx-unprivileged listens on 8080 inside
    depends_on:
      backend:
        condition: service_healthy
        restart: true

volumes:
  # The single Postgres instance's data (Variant B). The former studio_pg_data
  # volume (postgres:16) is retired; on an existing machine it simply goes
  # unused — data now lives here on the PG19 instance.
  studio_graph_pg_data:
  # Embedding model artifacts (graph-storage `onnx` provider), ~90 MB, filled
  # by the `embedding-model` service. Drop it to force a re-fetch.
  studio_models:
